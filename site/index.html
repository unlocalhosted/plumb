<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plumb</title>
<script>
  // Before paint: a saved choice wins, otherwise follow the OS.
  try { var t = localStorage.getItem('theme'); } catch (e) {}
  if (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
</script>
</head>
<body><div id="root"></div><script type="module" src="/src/entry.jsx"></script></body>
</html>
