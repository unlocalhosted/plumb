<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plumb overlay widget</title>
<style>
  /* Stand-in host pages: an ordinary app row with the kind of drift Plumb finds. */
  html { background: #eceef1; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #15181b; }
  .page { padding: 48px 64px 300px; }
  .page[data-host="dark"] { background: #0f1113; color: #e9ebee; }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 24px; color: #6a7078; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; width: 440px; background: #fff; border-radius: 14px; box-shadow: 0 2px 7px rgba(0,0,0,.13); }
  [data-host="dark"] .row { background: #1d2125; box-shadow: 0 2px 7px rgba(0,0,0,.6); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #c9d3dd; flex: none; }
  .text { flex: 1; min-width: 0; }
  .title { font: 500 13.5px/20px system-ui, sans-serif; }
  .meta { font: 400 12px/16px system-ui, sans-serif; color: #6a7078; }
  .chipx { display: inline-flex; padding: 3px 9px; border-radius: 7px; background: #e8edf7; color: #2d4a8a; font: 500 11.5px/16px system-ui; box-shadow: 0 1px 3px rgba(0,0,0,.16); }
  .chipx .title { font: inherit; }
  .btn { height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: #fff; color: #15181b; font: 500 12.5px system-ui; box-shadow: 0 0 0 1px #d0d5db; }
  [data-host="dark"] .btn { background: #2a2f34; color: #e9ebee; box-shadow: 0 0 0 1px #3a4047; }
</style>
</head>
<body>
<div class="page" data-host="light">
  <h1>Light host page · hold Alt and hover the row, click to pin</h1>
  <div style="display:flex;gap:120px;align-items:flex-start"><div class="row" id="target-light"><div class="avatar"></div><div class="text"><div class="title">Sync calendar</div><div class="meta">Last run 4 minutes ago</div></div><button class="btn">Run now</button></div><span class="chipx" id="target-chip"><span class="title">Beta</span></span></div>
</div>
<div class="page" data-host="dark">
  <h1>Dark host page</h1>
  <div class="row" id="target-dark"><div class="avatar"></div><div class="text"><div class="title">Sync calendar</div><div class="meta">Last run 4 minutes ago</div></div><button class="btn">Run now</button></div>
</div>
<script type="module">
/* ─────────────────────────────────────────────────────────
 * ANIMATION STORYBOARD · Plumb reading widget
 *
 *  hover     reticle ticks settle on the element, tag "div · 6 off" hangs below
 *  pin  0ms  the tag is the widget's shape: it grows (one shape, transform only)
 *     120ms  diagram and reading line fade in inside it
 *     160ms  the first finding's place lights up on the real element
 *  next      pin ring moves, the reading line crossfades, the lit place moves
 *  unpin     the widget shrinks back into the tag
 *  reduced motion: every step is instant
 * ───────────────────────────────────────────────────────── */
const TIMING = { grow: 220, contentIn: 120, light: 160, swap: 140 };

import { GLYPH_CSS, glyph } from '../src/glyphs.js';
const FAMILY = { spacing: 'spacing', radius: 'radius', type: 'type', shadow: 'shadow', fill: 'color' };


const tokensCss = await (await fetch('../src/tokens.css')).text();

/* What Plumb answers for this element (the /element contract), as sample data. Order is severity, then reading order. */
const reading = {
  element: 'div', file: 'src/settings/SyncRow.tsx', line: 18,
  findings: [
    { where: 'pad-top', kind: 'spacing', axis: 'y', title: 'padding-top 10px isn\'t on your spacing scale', value: 10, authored: 'py-[10px]', ledger: 'new',
      choices: [{ v: 8, name: 'mu-space-8', use: 'py-mu-space-8' }, { v: 12, name: 'mu-related', use: 'py-mu-related', why: 'related content' }], pick: 0 },
    { where: 'pad-left', kind: 'spacing', axis: 'x', title: 'padding-inline 14px isn\'t on your spacing scale', value: 14, authored: 'px-14', ledger: 'debt',
      choices: [{ v: 12, name: 'mu-related', use: 'px-mu-related', why: 'related content' }, { v: 16, name: 'mu-space-16', use: 'px-mu-space-16' }], pick: 0 },
    { where: 'gap', kind: 'spacing', axis: 'x', title: 'gap 10px isn\'t on your spacing scale', value: 10, authored: 'gap-10', ledger: 'new',
      choices: [{ v: 8, name: 'mu-space-8', use: 'gap-mu-space-8' }, { v: 12, name: 'mu-related', use: 'gap-mu-related', why: 'related content' }], pick: 1 },
    { where: 'corner', kind: 'radius', title: 'border-radius 14px isn\'t on your radius scale', value: 14, authored: 'rounded-[14px]', ledger: 'new',
      choices: [{ v: 12, name: 'row', use: 'rounded-row', why: 'rows and fields' }, { v: 18, name: 'plate', use: 'rounded-plate', why: 'floating plates' }], pick: 0 },
    { where: 'text', kind: 'type', title: 'font-size 13.5px isn\'t on your type scale', value: 13.5, authored: 'text-[13.5px]', ledger: 'new',
      choices: [{ v: 13, name: 'ui', use: 'type-ui', why: 'controls and rows' }, { v: 15, name: 'content', use: 'type-content', why: 'reading text' }], pick: 0 },
    { where: 'shadow', kind: 'shadow', title: 'This shadow is hand-written, not one of your shadow tokens', value: '0 2px 7px rgba(0,0,0,.13)', authored: 'shadow-[0_2px_7px…]', ledger: 'new',
      choices: [{ v: '0 1px 2px rgba(0,0,0,.12), 0 4px 10px -4px rgba(0,0,0,.18)', name: 'raise-sm', use: 'shadow-raise-sm', why: 'small raised objects' }], pick: 0 },
    { where: 'fill', kind: 'fill', soft: true, title: 'bg-white matches --color-s-hi but doesn\'t use it', value: '#ffffff', authored: 'bg-white', ledger: 'new',
      choices: [{ v: '#ffffff', name: 's-hi', use: 'bg-s-hi', why: 'the raised surface' }], pick: 0 },
  ],
};

const css = `
  :host { position: absolute; inset: 0; pointer-events: none; z-index: var(--pl-z); font: var(--pl-text-row); color: var(--pl-ink); }
  * { box-sizing: border-box; }
  .tick { position: absolute; width: var(--pl-tick); height: var(--pl-tick); transition: transform var(--pl-dur-travel) var(--pl-spring); }
  .tick::before, .tick::after { content: ""; position: absolute; background: var(--pl-instrument); box-shadow: 0 0 0 1px var(--pl-halo); }
  .tick::before { width: var(--pl-tick); height: 1px; } .tick::after { width: 1px; height: var(--pl-tick); }

  /* the lit place on the real element: hatching in the off colour over exactly the region the finding is about */
  .lit { position: absolute; border-radius: 2px; opacity: 0; transition: opacity var(--pl-dur-feedback) var(--pl-ease-out), transform var(--pl-dur-travel) var(--pl-spring), width var(--pl-dur-travel) var(--pl-spring), height var(--pl-dur-travel) var(--pl-spring);
         background: repeating-linear-gradient(-45deg, color-mix(in oklab, var(--pl-off) 55%, transparent) 0 1px, transparent 1px 4px); box-shadow: inset 0 0 0 1px var(--pl-off); }
  .lit.on { opacity: 1; }
  .lit.ring { background: none; border-radius: 50%; }

  /* ONE widget. Closed it is the tag; pinned it is the reading. The same element, the same corners. */
  .w { position: absolute; pointer-events: auto; background: var(--pl-paper); color: var(--pl-ink); border-radius: var(--pl-radius-card); box-shadow: var(--pl-shadow-card);
       width: 360px; transform-origin: 24px 0; overflow: clip; transition: clip-path var(--pl-dur-card) var(--pl-ease-out); }
  .w:focus-visible { outline: 2px solid var(--pl-instrument); outline-offset: 2px; }
  .w[data-state="tag"] { clip-path: inset(0 calc(100% - var(--tag-w)) calc(100% - var(--pl-tag-h)) 0 round var(--pl-radius-tag)); }
  .w[data-state="open"] { clip-path: inset(0 0 0 0 round var(--pl-radius-card)); }
  .w[data-state="tag"] .body { opacity: 0; } .body { transition: opacity var(--pl-dur-card) var(--pl-ease-out) 60ms; }

  .top { height: var(--pl-tag-h); display: flex; align-items: center; gap: 6px; padding-inline: 8px; font: var(--pl-text-label); white-space: nowrap; }
  .top .el { font-weight: 600; color: var(--pl-ink); }
  .top .n { font: var(--pl-text-reading); font-variant-numeric: tabular-nums; color: var(--pl-off); }
  .top .zoom { display: flex; gap: 1px; margin-inline-start: 8px; }
  .top .zoom button { all: unset; font: var(--pl-text-reading); font-variant-numeric: tabular-nums; color: var(--pl-ink-2); padding: 0 4px; height: 16px; line-height: 16px; border-radius: 2px; cursor: pointer; }
  .top .zoom button[aria-pressed="true"] { color: var(--pl-instrument); background: var(--pl-paper-2); }
  .top .zoom button:disabled { color: var(--pl-ink-3); cursor: default; }
  .top .zoom button:focus-visible { outline: 1px solid var(--pl-instrument); }
  .diagram { transition: opacity var(--pl-dur-feedback) var(--pl-ease-out); } .diagram.swapping { opacity: 0; }
  .top .file { font: var(--pl-text-reading); color: var(--pl-ink-2); margin-inline-start: auto; overflow: hidden; text-overflow: ellipsis; }

  /* the diagram: the element at its real proportions, pins where each problem is */
  .diagram { position: relative; margin: 10px 12px 0; }
  .d-box { position: absolute; box-shadow: inset 0 0 0 1px var(--pl-ink-3); }
  .d-child { position: absolute; box-shadow: inset 0 0 0 1px var(--pl-ink-3); }
  .d-child.text { box-shadow: none; }
  .d-child b { position: absolute; border-radius: 2px; background: var(--pl-ink-3); opacity: 0.7; }
  .pin .g { width: 13px; height: 13px; transform: var(--orient, none); }
  .pin.on-arc { background: var(--pl-paper); border-radius: 50%; } /* sits on the arc and breaks it */
  .read .t { display: flex; align-items: center; gap: 8px; }
  .read .t .g { width: 14px; height: 14px; }
  .read .t .g.off { color: var(--pl-off); } .read .t .g.soft { color: var(--pl-soft); }
  /* glyphs set into the outline: no chip, no fill; the break in the line is their frame */
  .outline { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .outline path { fill: none; stroke: var(--pl-ink-3); stroke-width: 1px; vector-effect: non-scaling-stroke; }
  .outline .reg { fill: transparent; transition: fill var(--pl-dur-feedback) var(--pl-ease-out); }
  .outline .reg[data-active] { fill: color-mix(in oklab, var(--pl-off) 20%, transparent); }
  .outline .reg.soft[data-active] { fill: color-mix(in oklab, var(--pl-soft) 22%, transparent); }
  .pin { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border: 0; padding: 0; cursor: pointer; background: transparent; color: var(--pl-ink-2);
         display: grid; place-items: center; border-radius: 3px; transition: color var(--pl-dur-feedback) var(--pl-ease-out); }
  .pin .g { width: 13px; height: 13px; }
  .pin[aria-current="true"] { color: var(--pl-off); }
  .pin.soft[aria-current="true"] { color: var(--pl-soft); }
  .pin:focus-visible { outline: 1px solid var(--pl-instrument); outline-offset: 1px; }
  @media (hover: hover) and (pointer: fine) { .pin:not([aria-current="true"]):hover { color: var(--pl-ink); } }

  /* the one reading line */
  .read { margin: 6px 12px 0; padding-block: 10px 12px; display: grid; gap: 10px; min-height: 132px; align-content: start; }
  .read .t { font: var(--pl-text-title); font-weight: 500; text-wrap: balance; }
  /* comparisons: tokens and yours side by side, in each family's own material */
  .cmp { display: grid; gap: 2px; }
  .opt { all: unset; box-sizing: border-box; display: grid; align-items: center; gap: 10px; min-height: 22px; padding: 2px 6px; margin-inline: -6px; border-radius: var(--pl-radius-tag); cursor: pointer; }
  .opt.you { cursor: default; }
  .opt[aria-pressed="true"] { background: var(--pl-paper-2); }
  @media (hover: hover) and (pointer: fine) { .opt:not(.you):hover { background: var(--pl-paper-2); } }
  .opt:focus-visible { outline: 2px solid var(--pl-instrument); outline-offset: 1px; }
  .v { font: var(--pl-text-reading); font-variant-numeric: tabular-nums; color: var(--pl-ink-2); text-align: end; }
  .opt.you .v { color: var(--pl-off); font-weight: 600; }
  .who { display: flex; align-items: baseline; gap: 6px; font: var(--pl-text-reading); white-space: nowrap; min-width: 0; }
  .who b { font-weight: 500; color: var(--pl-ink); }
  .who small { font: var(--pl-text-label); color: var(--pl-ink-2); overflow: hidden; text-overflow: ellipsis; }
  .who.you { color: var(--pl-off); font-weight: 600; font: var(--pl-text-label); letter-spacing: var(--pl-tracking-label); }
  .opt[aria-pressed="true"] .who b::after { content: "use"; margin-inline-start: 6px; font: var(--pl-text-label); letter-spacing: var(--pl-tracking-label); color: var(--pl-paper); background: var(--pl-ink); padding: 0 4px; border-radius: var(--pl-radius-mark); }

  .spacing .opt { grid-template-columns: 26px 168px 1fr; }
  .spacing .bar { display: flex; align-items: center; height: 10px; }
  .spacing .bar i { height: 8px; border-radius: 1px; background: color-mix(in oklab, var(--pl-ink-3) 55%, transparent); box-shadow: inset 0 0 0 1px var(--pl-ink-3); }
  .spacing .opt[aria-pressed="true"] .bar i { background: var(--pl-ink); box-shadow: none; }
  .spacing .opt.you .bar i { background: repeating-linear-gradient(-45deg, var(--pl-off) 0 1.5px, transparent 1.5px 4px); box-shadow: inset 0 0 0 1px var(--pl-off); }

  .radius { grid-template-columns: max-content 1fr; align-items: center; gap: 14px; }
  .radius svg path { fill: none; stroke: var(--pl-ink-3); stroke-width: 1; }
  .radius svg path.pick { stroke: var(--pl-ink); stroke-width: 1.5; }
  .radius svg path.you { stroke: var(--pl-off); stroke-width: 1.5; stroke-dasharray: 3 2; }
  .radius .list { display: grid; gap: 2px; }
  .radius .opt { grid-template-columns: 26px 1fr; }

  .type .opt { grid-template-columns: 1fr 34px minmax(150px, auto); align-items: baseline; }
  .type .spec { font-family: system-ui, sans-serif; font-weight: 500; color: var(--pl-ink); line-height: 1.25; white-space: nowrap; }
  .type .opt.you .spec { color: var(--pl-off); }

  .plates { grid-auto-flow: column; justify-content: start; gap: 8px; padding: 10px; border-radius: 4px; background: var(--ground); box-shadow: inset 0 0 0 1px var(--pl-rule); }
  .plates .opt { grid-template-columns: auto; justify-items: center; gap: 8px; margin: 0; padding: 6px 8px; }
  .plates .plate { width: 56px; height: 32px; border-radius: 7px; }
  .plates .who small { display: none; }
  .plates .who { color: var(--pl-ink); }
  .plates .opt[aria-pressed="true"] { background: color-mix(in oklab, var(--pl-paper) 70%, transparent); }

  .chips { grid-auto-flow: column; justify-content: start; align-items: center; gap: 8px; }
  .chips .opt { grid-template-columns: auto auto; gap: 6px; margin: 0; }
  .chips .chip { width: 22px; height: 22px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--pl-rule); }
  .chips .same { font: var(--pl-text-label); color: var(--pl-ink-2); }
  .read .edit { display: flex; align-items: center; gap: 8px; font: var(--pl-text-reading); }
  .read .edit s { color: var(--pl-ink-2); text-decoration-color: var(--pl-off); }
  .read .edit b { font-weight: 600; }
  .read .edit .ledger { margin-inline-start: auto; font: var(--pl-text-label); color: var(--pl-ink-2); }
  .read .edit .ledger.new { color: var(--pl-ink); }
  .read > * { transition: opacity var(--pl-dur-feedback) var(--pl-ease-out); }
  .read.swapping > * { opacity: 0; }

  .bar { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 12px; box-shadow: 0 -1px 0 var(--pl-rule); }
  .bar .count { font: var(--pl-text-reading); font-variant-numeric: tabular-nums; color: var(--pl-ink-2); margin-inline-end: auto; }
  .nav { width: 26px; height: 26px; border: 0; border-radius: var(--pl-radius-tag); background: transparent; color: var(--pl-ink-2); cursor: pointer; display: grid; place-items: center; }
  .nav svg { width: 12px; height: 12px; }
  @media (hover: hover) and (pointer: fine) { .nav:hover { background: var(--pl-paper-2); color: var(--pl-ink); } }
  .copy { height: 26px; padding-inline: 12px; border: 0; border-radius: var(--pl-radius-tag); background: var(--pl-ink); color: var(--pl-paper); font: var(--pl-text-label); letter-spacing: var(--pl-tracking-label); cursor: pointer; margin-inline-start: 4px; }
  .nav:focus-visible, .copy:focus-visible { outline: 2px solid var(--pl-instrument); outline-offset: 2px; }
`;

function hostGround(node) {
  for (let n = node.parentElement; n; n = n.parentElement) { const c = getComputedStyle(n).backgroundColor, a = c.match(/[\d.]+/g)?.map(Number); if (a && (a[3] ?? 1) > 0.5) return c; }
  return '#ffffff';
}
function hostIsDark(node) {
  for (let n = node; n; n = n.parentElement) {
    const c = getComputedStyle(n).backgroundColor.match(/[\d.]+/g)?.map(Number);
    if (c && (c[3] ?? 1) > 0.5) { const [r, g, b] = c.slice(0, 3).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b < 0.2; }
  }
  return matchMedia('(prefers-color-scheme: dark)').matches;
}

/* where each finding sits, on the diagram (percent of the diagram) and on the real element (from computed style) */
function placeOnElement(where, target) {
  const b = target.getBoundingClientRect(), cs = getComputedStyle(target), x = b.left + scrollX, y = b.top + scrollY;
  const pt = parseFloat(cs.paddingTop), pl = parseFloat(cs.paddingLeft), r = parseFloat(cs.borderTopRightRadius);
  const [c0, c1] = target.children, a = c0?.getBoundingClientRect(), t = c1?.getBoundingClientRect();
  switch (where) {
    case 'pad-top': return { x: x + pl, y, w: b.width - pl * 2, h: pt };
    case 'pad-left': return { x, y: y + pt, w: pl, h: b.height - pt * 2 };
    case 'gap': if (!c1) return { x: x + pl, y: y + pt, w: 0, h: 0 };
      return { x: a.right + scrollX, y: y + pt, w: t.left - a.right, h: b.height - pt * 2 };
    case 'corner': return { x: x + b.width - r * 2, y, w: r * 2, h: r * 2, ring: true };
    case 'text': { const tt = target.querySelector('.title').getBoundingClientRect(); return { x: tt.left + scrollX, y: tt.top + scrollY, w: tt.width, h: tt.height }; }
    case 'shadow': return { x, y: y + b.height, w: b.width, h: 6 };
    case 'fill': return { x: x + pl, y: y + pt, w: b.width - pl * 2, h: b.height - pt * 2 };
  }
}

function mount(target, data = reading) {
  const host = document.createElement('plumb-widget');
  host.dataset.scheme = hostIsDark(target) ? 'dark' : 'light';
  document.body.append(host);
  const root = host.attachShadow({ mode: 'open' });
  const b = target.getBoundingClientRect(), x = b.left + scrollX, y = b.top + scrollY;
  const f = data.findings;
  root.innerHTML = `<style>${tokensCss}${GLYPH_CSS}${css}</style>
    ${[[x, y, 1, 1], [x + b.width - 8, y, -1, 1], [x, y + b.height - 8, 1, -1], [x + b.width - 8, y + b.height - 8, -1, -1]].map(([l, t, a, d]) => `<i class="tick" style="left:${l}px;top:${t}px;transform:scale(${a},${d})"></i>`).join('')}
    <i class="lit"></i>
    <section class="w" data-state="tag" tabindex="0" role="dialog" aria-label="Plumb reading for ${data.element}, ${f.length} findings" style="left:${x}px;top:${y + b.height + 8}px">
      <div class="top"><span class="el">${data.element}</span><span class="n">${f.length} off</span><span class="file">${data.file}:${data.line}</span><span class="zoom" role="group" aria-label="Drawing scale">${[1, 2, 4].map(z => `<button data-z="${z}" aria-pressed="${z === 1}">${z}×</button>`).join('')}</span></div>
      <div class="body">
        <div class="diagram"></div>
        <div class="read" aria-live="polite"></div>
        <div class="bar">
          <span class="count"></span>
          <button class="nav prev" aria-label="Previous finding"><svg viewBox="0 0 12 12"><path d="M7.5 2.5 4 6l3.5 3.5" stroke="currentColor" stroke-width="1.4" fill="none"/></svg></button>
          <button class="nav next" aria-label="Next finding"><svg viewBox="0 0 12 12"><path d="M4.5 2.5 8 6 4.5 9.5" stroke="currentColor" stroke-width="1.4" fill="none"/></svg></button>
          <button class="copy">Copy for agent</button>
        </div>
      </div>
    </section>`;

  const w = root.querySelector('.w'), read = root.querySelector('.read'), lit = root.querySelector('.lit'), count = root.querySelector('.count');
  // The diagram is the element scaled into the widget: its box, its children, and a pin at the centre of every
  // region a finding is about, computed from the same geometry that lights the real element.
  const widgetW = Math.round(Math.min(480, Math.max(360, b.width + 24)));
  w.style.width = widgetW + 'px';
  // The drawing is the element at 1:1 by default. Magnifying redraws the same SVG at 2x or 4x: lines stay 1px and
  // glyphs keep their size, only the drawing grows. Steps that would not fit the widget's width are disabled.
  const fit = (widgetW - 24) / b.width, diagram = root.querySelector('.diagram');
  let zoom = 1;
  const drawDiagram = zoom => {
    const k = Math.min(fit, zoom), pad = 12;
    const toD = r => ({ x: (r.x - x) * k, y: (r.y - y) * k + pad, w: r.w * k, h: r.h * k });
    const drawH = b.height * k;
    diagram.style.height = pad + drawH + 22 + 'px'; // room below for the shadow and glyphs set into the bottom edge
    const cs = getComputedStyle(target);
    let shapes = '';
    for (const child of target.children) {
      const c = child.getBoundingClientRect(), d = toD({ x: c.left + scrollX, y: c.top + scrollY, w: c.width, h: c.height });
      const round = getComputedStyle(child).borderRadius;
      const lines = child.querySelectorAll('.title, .meta');
      const inner = [...lines].map(l => { const lr = l.getBoundingClientRect(); const ld = toD({ x: lr.left + scrollX, y: lr.top + scrollY, w: lr.width, h: lr.height }); return `<b style="left:${ld.x - d.x}px;top:${ld.y - d.y + ld.h * 0.3}px;width:${Math.min(ld.w, d.w) * 0.7}px;height:${Math.max(3, ld.h * 0.4)}px"></b>`; }).join('');
