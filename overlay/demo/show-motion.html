<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean-up motion · React Plumber</title>
<style>
  body { margin: 0; padding: 28px 16px 64px; background: #ecebe7; font: 14px/1.5 system-ui, sans-serif; color: #1c1b19; }
  header { max-width: 1100px; margin: 0 auto 18px; display: flex; align-items: end; gap: 16px; }
  header h1 { font-size: 18px; margin: 0; } header p { margin: 4px 0 0; opacity: .65; font-size: 13px; }
  header button { margin-left: auto; font: 600 13px system-ui; padding: 8px 14px; border-radius: 10px; border: 0; background: #f24a9f; color: #fff; cursor: pointer; }
  #board { max-width: 1100px; margin: 0 auto; }
</style>
</head>
<body>
<header><div><h1>How a change moves, for each of Clean up’s steps</h1><p>Guides draw in, the page moves on the spring, the number rolls and lands, the guides go.</p></div><button id="play">Play all</button></header>
<div id="board"></div>
<script type="module">
  import tokens from '../src/tokens.css?raw';
  import { mountMotionBoard, BOARD_CSS } from '../src/show-motion.js';
  document.head.insertAdjacentHTML('beforeend', `<style>${tokens}${BOARD_CSS}</style>`);
  const b = mountMotionBoard(document.getElementById('board'), { tokensCss: tokens, autoplay: true });
  document.getElementById('play').onclick = b.playAll;
</script>
</body>
</html>
