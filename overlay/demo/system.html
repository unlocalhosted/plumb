<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plumber design system</title>
<style>
  body { margin: 0; background: #fdfcf8; }
  body.dark { background: #1c1c1e; }
  /* Blueprint marks' specimen: a page of someone else's, so it lives outside the docs' shadow root, where the marks
     layer can find it on the page, and keeps its own plain colours */
  .bp-spec { display: flex; flex-wrap: wrap; gap: 16px; font: 14px/20px system-ui, sans-serif; color: #1c1b19; }
  .bp-card { display: flex; flex-direction: column; gap: 12px; padding: 22px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px #e6e1d6; }
  .bp-card.ok { padding: 16px; }
  .bp-t { font-size: 19px; line-height: 26px; font-weight: 600; }
  .bp-card.ok .bp-t { font-size: 20px; line-height: 28px; }
  .bp-row { display: flex; gap: 3px; }
  .bp-card.ok .bp-row { gap: 8px; }
  .bp-row span { padding: 4px 10px; border-radius: 7px; background: #f4f1ea; font-size: 13px; }
  body.dark .bp-spec { color: #f4f3ef; }
  body.dark .bp-card { background: #26262a; box-shadow: 0 0 0 1px #3a3a3f; }
  body.dark .bp-row span { background: #323236; }
</style>
</head>
<body>
<div id="system"><div slot="bp-spec" class="bp-spec">
  <div class="bp-card" data-m="c1"><b class="bp-t" data-m="t1">Reasoned for 6.2s</b><div class="bp-row" data-m="r1"><span>Search</span><span>Read</span><span>Edit</span></div></div>
  <div class="bp-card" data-m="c2" style="gap:8px"><b class="bp-t" style="font-size:20px;line-height:28px">Plan ready</b><div class="bp-row" style="gap:8px"><span>Open</span><span>Run</span></div></div>
</div></div>
<script type="module">
  /* Plumber's design system, documented (structure after mews.design: a sidebar tree, an on-this-page rail, overview
     cards, and the same tabs on every component; the look is ours). Built from the overlay's own modules, so every
     example on these pages is the real thing and the docs can't drift from the code.
     First slice (2026-11-03): the shell, Welcome, Foundations · Colour, Components · Pill. */
  import tokens from '../src/tokens.css?raw';
  import { LANGUAGE_CSS } from '../src/language.js';
  import { PRIMITIVES_CSS, stepper, swatches, segments, align, bind, place } from '../src/editor-primitives.js';
  import { SCALE_CSS, step as stepMark, place as placeMark, places as placeMarks, count as countMark, rollCount } from '../src/scale-marks.js';
  import { SHOW_CSS, chipsHtml, roll } from '../src/show.js';
  import { BLOCK_ICONS, BOXMODEL_CSS, boxModel, pointAt } from '../src/boxmodel.js';
  import { GRAVITY_CSS, Gravity } from '../src/gravity.js';
  import { SPECIMEN_CSS, Specimen } from '../src/specimen.js';
  import { CAUSE_LIST_CSS, CauseList } from '../src/cause-list.js';
  import { MARKS_CSS, MarkLayer, HEAT } from '../src/blueprint-marks.js';
  import CRAFTING from '../../docs/design/prototypes/data/crafting-ui.json';
  import { GLYPHS, GLYPH_CSS, glyph } from '../src/glyphs.js';
  import { DOCK, TIMELINE } from '../src/words.js';

  // ---------- contrast, measured on the live tokens of each scheme ----------
  const rgb = (c) => { const h = c.trim().replace('#', ''); return h.length >= 6 ? [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)) : null; };
  const lum = (c) => c.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }).reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0);
  const ratio = (a, b) => { const x = rgb(a), y = rgb(b); if (!x || !y) return null; const [p, q] = [lum(x), lum(y)].sort((m, n) => n - m); return (p + 0.05) / (q + 0.05); };
  // two probes, one per scheme, so a page can quote day and night at once
  const probe = (scheme) => { const el = document.createElement('div'); el.dataset.scheme = scheme; el.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden'; el.attachShadow({ mode: 'open' }).innerHTML = `<style>${tokens}</style><i></i>`; document.body.append(el); return (name) => getComputedStyle(el.shadowRoot.querySelector('i')).getPropertyValue(name).trim(); };
  const tok = { day: probe('light'), night: probe('dark') };
  // a verdict: the pairing itself as a sample, then pass or fail with its ratio against what it needs
  const badge = (fg, bg, need, mark = false) => { const r = ratio(fg, bg); if (r == null) return ''; const ok = r >= need;
    return `<span class="verdict"><span class="sample" style="background:${bg};color:${fg}">${mark ? `<i style="background:${fg}"></i>` : 'Aa'}</span><span class="ratio ${ok ? 'ok' : 'low'}" title="needs ${need}:1">${ok ? '✓' : '✗'} ${r.toFixed(1)}:1</span></span>`; };

  // ---------- the map: what exists, what's coming ----------
  const HUES = [
    ['sky', 'Selected, measured, focus', 'What you picked, the measurements on it, the focus ring.'],
    ['coral', 'Off your system', 'A value your scale doesn’t have; something broken. Nothing else is ever coral.'],
    ['mint', 'On your system, written', 'A value from your scale; a change that landed.'],
    ['butter', 'Softer trouble', 'Your own value typed by hand; a framework default; the wrong tier.'],
    ['pink', 'What you can do', 'The action: Write, Snap, Fix all.'],
    ['lilac', 'Names', 'A component, an element, a step of a scale.'],
  ];
  const NAV = [
    { id: 'welcome', label: 'Welcome' },
    { label: 'Foundations', items: [['colour', 'Colour'], ['type', 'Typography'], ['spacing', 'Spacing'], ['shape', 'Shape'], ['elevation', 'Elevation'], ['motion', 'Motion'], ['charts', 'Charts'], ['texture', 'Texture'], ['icons', 'Iconography'], ['voice', 'Voice and tone'], ['tokens', 'Tokens']] },
    { label: 'Components', items: [['pill', 'Pill'], ['tag', 'Tag'], ['action', 'Action'], ['stepper', 'Stepper'], ['swatches', 'Swatches'], ['segments', 'Segments'], ['chip', 'Role chip'], ['step', 'Step'], ['place', 'Place'], ['count', 'Count'], ['readout', 'Readout']] },
    { label: 'Patterns', items: [['boxmodel', 'Box model'], ['gravity', 'Gravity'], ['specimen', 'Specimen'], ['causes', 'What I’d stop first'], ['show', 'The clean-up show'], ['marks', 'Blueprint marks']] },
    { label: 'Layout', items: [['card', 'Card'], ['page', 'Page']] },
    { label: 'Resources', items: [['gallery', 'Gallery'], ['briefs', 'Briefs'], ['source', 'Source']] },
  ];
  const TABS = ['Overview', 'Style', 'Usage', 'Code', 'Accessibility'];

  // ---------- pages: each returns { title, lede, tabs?, sections: [{ id, title, html }] } ----------
  const sec = (id, title, html) => ({ id, title, html });
  // a card links only to a page that exists; one still to come says so and isn't a link
  const card = (href, title, text, art = '') => href ? `<a class="tile" href="${href}"><span class="art">${art}</span><b>${title}</b><span>${text}</span></a>`
    : `<div class="tile soon"><span class="art">${art}</span><b>${title}<span class="pl-pill coming-pill">Coming</span></b><span>${text}</span></div>`;
  const pills = (txt) => HUES.map(([h]) => `<span class="pl-pill" data-hue="${h}">${txt(h)}</span>`).join('');

  const status = (rows) => `<div class="status">${rows.map(([a, b]) => `<div><span class="pl-pill" data-hue="mint">✓ ${a}</span><span>${b}</span></div>`).join('')}</div>`;
  const ICON_MODELS = '<svg viewBox="0 0 12 12"><rect x="1.5" y="2" width="9" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="1.5" y="7" width="5" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';
  const contrastRows = (hues) => `<table class="tok"><thead><tr><th>Colour</th><th>Day</th><th>Night</th></tr></thead><tbody>${hues.map((h) => `<tr><td><span class="pl-pill" data-hue="${h}">${h}</span></td><td>${badge(tok.day(`--pl-${h}-ink`), tok.day(`--pl-${h}-soft`), 4.5)}</td><td>${badge(tok.night(`--pl-${h}-ink`), tok.night(`--pl-${h}-soft`), 4.5)}</td></tr>`).join('')}</tbody></table>`;
  const TYPE = {
    page: [['display', '--pl-page-display', '576 places type a size by hand.', '40 / 46', '600', 'A page’s headline'], ['title', '--pl-page-title', 'Where your text sizes land', '20 / 28', '600', 'A card or a section'], ['body', '--pl-page-body', 'Your theme has 10 text sizes; your code uses 49.', '16 / 26', '400', 'Body text: the intro and explanations'], ['small', '--pl-page-small', 'places use your scale', '14 / 22', '400', 'Supporting lines, a readout'], ['meta', '--pl-page-meta', 'On your scale · sm · 2xs', '13 / 20', '400', 'Names on a drawing, a legend, captions'], ['figure', '--pl-page-figure', '621', '32 / 36', '600', 'A key number'], ['display, narrow', '--pl-page-display-narrow', '576 places type a size by hand.', '30 / 36', '600', 'The headline below 720px']],
    card: [['title', '--pl-card-title', 'Padding is off your scale', '14 / 20', '600', 'What’s off, in a sentence'], ['body', '--pl-card-body', 'Your scale has 8 and 12; this is 10.', '13 / 19', '400', 'Reasons and guidance'], ['meta', '--pl-card-meta', '3 places · Board.jsx', '12 / 17', '400', 'Counts, notes, file names'], ['code', '--pl-card-code', 'p-[10px] → p-3', '12 / 17', '500 mono', 'Classes, values, file:line, the change'], ['label', '--pl-text-label', 'WRITE · FIX ALL', '11 / 14', '600', 'Tags, buttons, column labels']],
  };
  const typeTable = (rows) => `<div class="ramp">${rows.map(([n, t, sample, size, weight, use]) => `<div class="tr"><div class="meta"><b>${n}</b><code>${t}</code><span>${size} · ${weight}</span></div><div class="sample" style="font:var(${t});${t === '--pl-page-display' ? 'letter-spacing:var(--pl-tracking-display);' : t === '--pl-page-title' ? 'letter-spacing:var(--pl-tracking-title);' : t === '--pl-page-figure' ? 'font-variant-numeric:tabular-nums;letter-spacing:var(--pl-tracking-display);' : ''}">${sample}</div><div class="use">${use}</div></div>`).join('')}</div>`;

  // ---------- live controls (editor-primitives.js): each demo keeps its own state, keyed by its name ----------
  const SPACING = ['s0', 's1', 's2', 's3', 's4', 's5', 's6', 's8', 's10'].map((t, i) => ({ token: t, n: [0, 4, 8, 12, 16, 20, 24, 32, 40][i], value: `${[0, 4, 8, 12, 16, 20, 24, 32, 40][i]}px` }));
  const COLOURS = [['surface', '#ffffff'], ['ground', '#f3f4f6'], ['ink', '#1c1b19'], ['muted', '#6b7280'], ['accent', '#2c64d4'], ['ok', '#2a7d52'], ['warn', '#a8690f'], ['danger', '#c03a46']].map(([token, swatch]) => ({ token, swatch, value: swatch }));
  const DIRS = [{ token: 'row', label: 'Row', glyph: 'row' }, { token: 'column', label: 'Column', glyph: 'column' }];
  const WRAP = [{ token: 'nowrap', label: 'One line', glyph: 'nowrap' }, { token: 'wrap', label: 'Wrap', glyph: 'wrap' }];
  const FIT = [{ token: 'cover', label: 'Cover', glyph: 'cover' }, { token: 'contain', label: 'Contain', glyph: 'contain' }];
  const CELLS = ['start start', 'start center', 'start end', 'center start', 'center center', 'center end', 'end start', 'end center', 'end end'].map((token) => ({ token, label: token }));
  const DEMOS = {};
  const demo = (name, kind, state, caption = '') => { DEMOS[name] = { kind, s: structuredClone(state) }; return `<div class="demo" data-demo="${name}">${kind(name, DEMOS[name].s)}<span class="say">${caption}</span></div>`; };
  const states = (kind, rows) => `<div class="stage col states-list">${rows.map(([label, name, st, note]) => `<div class="srow"><span class="lbl">${label}</span>${demo(name, kind, st, note ?? '')}</div>`).join('')}</div>`;
  const keys = `<ul class="plain"><li>One tab stop for the whole control; ← → (and ↑ ↓) move between steps, Home and End go to the ends.</li><li>Enter or Space picks; pointing or focusing previews a step.</li><li>Each control is a <code>radiogroup</code>; each step a <code>radio</code> with <code>aria-checked</code>.</li></ul>`;

  // ---------- the scale marks and the show's chips ----------
  const ROLES = [['p', 12], ['g', 8], ['m', 24], ['r', 10], ['line', 14]].map(([k, v]) => ({ label: { p: 'padding', g: 'gap', m: 'margin', r: 'radius', line: 'type' }[k], icon: BLOCK_ICONS[k], from: v }));
  const STEP_STATES = [['rest', 'sm', 14, 15, 'In use: a sky ring, filled by how much it’s used.'], ['unused', '2xl', 28, 0, 'In your theme, nowhere in your code: dashed.'], ['pointed', 'md', 16, 8, 'Pointed at: the sky hatch, its value in a pill.'], ['pulled', 'xs', 12, 11, 'Places pulled in: mint, with what it took.'], ['off', '15px', 15, 0, 'A size your scale doesn’t have: coral, no name.']];

  // ---------- foundations data ----------
  const SPACE = [1, 2, 3, 4, 5, 6, 7, 8].map((k) => [`--pl-space-${k}`, [2, 4, 6, 8, 12, 16, 20, 24][k - 1]]);
  const RADII = [['--pl-radius-mark', 2, 'A mark on the page: a place, a tick'], ['--pl-radius-tag', 6, 'A tag'], ['--pl-radius-pill', 7, 'A pill, an action'], ['--pl-radius-row', 8, 'A row, a control'], ['--pl-radius-card', 12, 'A card, a panel']];
  const DURS = [['--pl-dur-feedback', 120, 'A press, a copy confirmed'], ['--pl-dur-undim', 120, 'Blueprint’s dimming fading out'], ['--pl-dur-drop', 140, 'The line growing to its tag'], ['--pl-dur-dim', 160, 'Blueprint’s dimming fading in'], ['--pl-dur-card', 180, 'A card opening'], ['--pl-dur-travel', 220, 'The selection moving to the next element'], ['pop', 260, 'Anything appearing (pl-pop)'], ['--pl-dur-build', 380, 'One part of a page fading in as it builds'], ['roll', 520, 'A value rolling, a fill sliding'], ['--pl-dur-arrive', 600, 'A drawing arriving, once per visit']];
  const CURVES = [['--pl-ease-out', 'Ease out', 'For things that arrive or respond to you: fast, then slowing down.'], ['--pl-spring', 'Spring', 'For things moving from one place to another. Overshoots by under 2%.'], ['--pl-spring-pop', 'Pop', 'For things that appear. Overshoots by about 4%.']];
  const FAMILY_NAMES = { spacing: 'Spacing', radius: 'Radius', type: 'Type', color: 'Colour', shadow: 'Elevation', z: 'Layers', motion: 'Motion', habit: 'Habit', ownership: 'Ownership', imitation: 'Imitation', craft: 'Craft', existence: 'Existence' };
  const BLOCK_NAMES = { p: 'Padding', m: 'Margin', g: 'Gap', b: 'Border', r: 'Radius', line: 'Type', c: 'Size' };

  // every --pl- token in tokens.css, read from the file itself (its first block), with the comment written beside it
  // line by line: several tokens on one line (sky, its fill, its ink) share the comment at the line's end
  const TOKEN_LIST = (() => { const block = tokens.slice(tokens.indexOf(':host {'), tokens.indexOf('\n}', tokens.indexOf(':host {')));
    return block.split('\n').flatMap((line) => { const note = /\/\*\s*(.*?)\s*\*\//.exec(line)?.[1] ?? ''; return [...line.matchAll(/(--pl-[\w-]+):\s*[^;]+;/g)].map(([, name]) => ({ name, note })); }); })();
  const isColour = (v) => /^#|^rgb|^color-mix|^oklch/.test(v);

  // the box model's scale for the specimen: what its steps are called
  const SPECIMEN_SCALE = { spacing: [[0, 's0'], [4, 's1'], [8, 's2'], [12, 's3'], [16, 's4'], [20, 's5'], [24, 's6'], [32, 's8']], radius: [[4, 'sm'], [6, 'md'], [10, 'lg'], [14, 'xl']], type: [[12, 'xs'], [14, 'sm'], [16, 'base'], [18, 'lg']] };
  const tokenOf = (family, n) => SPECIMEN_SCALE[family]?.find(([v]) => Math.abs(v - n) < 0.5)?.[1] ?? null;

  const pages = {
    welcome: () => ({
      title: 'Plumber design system',
      lede: 'The colours, type, marks and components Plumber is built from. The overlay on your page uses them, and so does the project page that opens when you run Plumber.',
      sections: [
        sec('start', 'Start here', `<p>Every example here runs the same code as the overlay, so it looks exactly like the product. Use the button at the top right to switch between day and night.</p>
          <div class="tiles">${card('#colour', 'Foundations', 'Colour, type, spacing, shape and motion.', `<span class="hues">${HUES.map(([h]) => `<i style="background:var(--pl-${h})"></i>`).join('')}</span>`)}${card('#pill/overview', 'Components', 'Each component with its states, usage and code.', `<span class="pl-pill" data-hue="mint">s3</span><span class="pl-pill" data-hue="coral">p-[10px]</span>`)}${card('#boxmodel', 'Patterns', 'Components working together, like the box model, Gravity and the clean-up show.', '<span class="pl-hatch hatch"></span>')}</div>`),
        sec('latest', 'Latest changes', `<ul class="log">
          <li><span class="when">Nov 3</span><span><b>Resources.</b> Gallery, Briefs and Source.</span></li>
          <li><span class="when">Nov 3</span><span><b>Layout.</b> Card and Page.</span></li>
          <li><span class="when">Nov 3</span><span><b>Readout and Blueprint marks.</b> The marks run live over two sample cards.</span></li>
          <li><span class="when">Nov 3</span><span><b>Patterns.</b> The box model, Gravity and the clean-up show, all live.</span></li>
          <li><span class="when">Nov 3</span><span><b>Voice and tone, and Tokens.</b> Both read directly from the code.</span></li>
          <li><span class="when">Nov 3</span><span><b>Six foundations.</b> Spacing, shape, elevation, motion, texture and iconography.</span></li>
          <li><span class="when">Nov 3</span><span><b>Role chip, Step, Place and Count.</b> Each one live.</span></li>
          <li><span class="when">Nov 3</span><span><b>Stepper, Swatches and Segments.</b> Every state live.</span></li>
          <li><span class="when">Nov 3</span><span><b>Typography, Tag and Action.</b> Also fixed: a tag set to sky now shows in sky.</span></li>
          <li><span class="when">Nov 3</span><span><b>White text on night pills.</b> At night a pill has a deep fill with white text. Lines and marks stay bright.</span></li>
          <li><span class="when">Nov 3</span><span><b>Page type.</b> Five sizes for anything bigger than a card: display, title, body, small and meta.</span></li>
          <li><span class="when">Nov 3</span><span><b>Scale marks.</b> Step, place and count, for drawing a scale and where it’s used.</span></li>
          <li><span class="when">Nov 3</span><span><b>The action button.</b> Pink, for the main thing you can do.</span></li></ul>`),
        sec('principles', 'Principles', `<div class="rules">
          <div><b>Each colour has one meaning</b><p>A colour means the same thing everywhere. Coral only ever means “off your system”.</p></div>
          <div><b>Shapes before words</b><p>Use shape, pattern and colour to show what’s going on. At rest only names show; a value appears only for what you point at.</p></div>
          <div><b>Pills are tinted</b><p>A pill’s fill and text are two shades of the same colour: a pale fill with dark text by day, a deep fill with white text at night.</p></div>
          <div><b>Motion is quick</b><p>Things that appear scale up from 92% with a slight overshoot. Only the marching ants loop.</p></div></div>`),
      ],
    }),

    colour: () => ({
      title: 'Colour',
      lede: 'Six colours, each with one meaning, on an off-white background by day and dark grey at night. Colour always comes with a shape or a word, so nobody has to rely on colour alone.',
      sections: [
        sec('meanings', 'One colour, one meaning', `<div class="hue-grid">${HUES.map(([h, name, text]) => `<div class="hue-card">
            <div class="chips"><i class="line" style="background:var(--pl-${h})"></i><span class="pl-pill" data-hue="${h}">${h}</span></div>
            <b>${name}</b><p>${text}</p></div>`).join('')}</div>`),
        sec('two-cues', 'Two cues for every meaning', `<p>Every meaning comes with colour and one more cue: a shape, a word, or a place. On a drawing, the three results about your code each get a shape too, so they read in greyscale and to someone who can’t tell the colours apart.</p>
          <div class="stage col states-list">${[['on', 'mint', 'A filled disc', 'On your scale'], ['typed', 'butter', 'A ring', 'Your size, typed by hand'], ['off', 'coral', 'A filled square', 'Not on your scale']].map(([t, h, shape, say]) => `<div class="srow"><span class="lbl">${h}</span><div class="demo"><span class="trio">${placeMark(t)}${placeMark(t)}${placeMark(t)}</span><span class="say"><b>${shape}</b> · ${say}</span></div></div>`).join('')}</div>
          <p>The day mint, butter and coral were re-stepped on 2026-11-04 so that a deuteranope (about 1 in 16 men) can tell them apart. The closest pair is 7.7 apart for them, which is enough only because the shapes are there; with full colour vision they’re 21.4 apart. Butter is a mark colour: a word or glyph in its tone uses <code>--pl-soft-text</code> (5.3:1 on a card) instead.</p>
          <p>Text never takes a data colour, with one exception: a page headline’s big numbers, at display size, where they pass 3:1 on the desk.</p>`),
        sec('day-night', 'Day and night', `<p>By day a pill has a pale fill with dark text in the same colour. At night it has a deep fill with white text, and lines and marks use the bright pastels. The contrast of both is measured below.</p>
          <div class="pair">${['day', 'night'].map((s) => `<div class="mini" data-mini="${s}"></div>`).join('')}</div>`),
        sec('neutrals', 'Neutrals', `<table class="tok"><thead><tr><th>Token</th><th>Day</th><th>Night</th><th>Use</th></tr></thead><tbody>${[
            ['--pl-paper', 'Card and page ground'], ['--pl-paper-2', 'Inset, hover, pressed'], ['--pl-rule', 'Dividers and hairlines'],
            ['--pl-ink', 'Titles and readings'], ['--pl-ink-2', 'Supporting words'], ['--pl-ink-3', 'Ticks and faint hints, never the only sign of something']]
          .map(([t, use]) => `<tr><td><code>${t}</code></td>${['day', 'night'].map((s) => `<td><span class="dot" style="background:${tok[s](t)}"></span><code>${tok[s](t)}</code></td>`).join('')}<td>${use}</td></tr>`).join('')}</tbody></table>`),
        sec('contrast', 'Contrast', `<p>Measured from the current tokens. Text needs 4.5:1 against its background; marks and lines need 3:1.</p>
          <table class="tok"><thead><tr><th>Colour</th><th>Pill lettering, day</th><th>Pill lettering, night</th><th>Line on the card, day</th><th>Line on the card, night</th></tr></thead><tbody>${HUES.map(([h]) => `<tr><td><span class="pl-pill" data-hue="${h}">${h}</span></td>
            <td>${badge(tok.day(`--pl-${h}-ink`), tok.day(`--pl-${h}-soft`), 4.5)}</td><td>${badge(tok.night(`--pl-${h}-ink`), tok.night(`--pl-${h}-soft`), 4.5)}</td>
            <td>${badge(tok.day(`--pl-${h}`), tok.day('--pl-paper'), 3, true)}</td><td>${badge(tok.night(`--pl-${h}`), tok.night('--pl-paper'), 3, true)}</td></tr>`).join('')}</tbody></table>`),
        sec('rules', 'Do and don’t', `<div class="dd">
