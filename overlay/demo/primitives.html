<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor primitives · React Plumber</title>
<style>
  body { margin: 0; padding: 32px 16px 64px; background: #ecebe7; font: 14px/1.5 system-ui, sans-serif; color: #1c1b19; }
  body.dark { background: #0f0f11; color: #eeede9; }
  header { max-width: 1040px; margin: 0 auto 20px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; opacity: .7; font-size: 13px; }
  header button { margin-left: auto; font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid currentColor; background: none; color: inherit; cursor: pointer; }
  #board { max-width: 1040px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <h1>Editor primitives</h1>
  <p>Every control the element editors are built from, in every state. Hover previews, click picks, arrows move.</p>
  <button id="scheme" type="button">Dark</button>
</header>
<div id="board"></div>
<script type="module">
  import tokens from '../src/tokens.css?raw';
  import { LANGUAGE_CSS } from '../src/language.js';
  import { BOXMODEL_CSS, BLOCK_ICONS, boxModel, pointAt, bandAt } from '../src/boxmodel.js';
  import { SCRUB_CSS, scrub, cursorOf } from '../src/scrub.js';
  import { CHANGES_CSS, Changes } from '../src/changes.js';
  import { PRIMITIVES_CSS, stepper, swatches, radius, segments, align, shadows, row, bind, place } from '../src/editor-primitives.js';
  import { SCALE_CSS, step, places, place as mark, count, rollCount } from '../src/scale-marks.js';
  import { SHOW_CSS, HUES, chipsHtml, roll } from '../src/show.js';
  import { GLYPHS, GLYPH_CSS, glyph } from '../src/glyphs.js';

  const host = document.getElementById('board');
  const root = host.attachShadow({ mode: 'open' });
  const spacing = ['s0', 's1', 's2', 's3', 's4', 's5', 's6', 's8', 's10'].map((t, i) => ({ token: t, n: [0, 4, 8, 12, 16, 20, 24, 32, 40][i], value: `${[0, 4, 8, 12, 16, 20, 24, 32, 40][i]}px` }));
  const colors = [['surface', '#ffffff'], ['ground', '#f3f4f6'], ['ink', '#1c1b19'], ['muted', '#6b7280'], ['accent', '#2c64d4'], ['ok', '#2a7d52'], ['warn', '#a8690f'], ['danger', '#c03a46']].map(([token, swatch]) => ({ token, swatch }));
  const radii = [['none', 0], ['sm', 4], ['md', 6], ['lg', 10], ['xl', 14], ['full', 99]].map(([token, n]) => ({ token, n, value: `${n}px` }));
  const elevation = [['none', 'none'], ['rest', '0 1px 2px rgb(0 0 0 / .12)'], ['raised', '0 2px 6px rgb(0 0 0 / .16)'], ['float', '0 8px 20px -6px rgb(0 0 0 / .28)']].map(([token, shadow]) => ({ token, shadow }));
  const dirs = [{ token: 'row', label: 'Row', glyph: 'row' }, { token: 'column', label: 'Column', glyph: 'column' }];
  const wrap = [{ token: 'nowrap', label: 'One line', glyph: 'nowrap' }, { token: 'wrap', label: 'Wrap', glyph: 'wrap' }];
  const fit = [{ token: 'cover', label: 'Cover', glyph: 'cover' }, { token: 'contain', label: 'Contain', glyph: 'contain' }];
  const cells = ['start start', 'start center', 'start end', 'center start', 'center center', 'center end', 'end start', 'end center', 'end end'].map((token) => ({ token, label: token }));

  // each demo: a name, a primitive, its state; picks update the state and the control re-renders
  const demos = {
    'Padding': { kind: stepper, s: { steps: spacing, current: 's3' } },
    'Padding picked': { kind: stepper, s: { steps: spacing, current: 's3', picked: 's4' } },
    'Padding drift': { kind: stepper, s: { steps: spacing, current: null, drift: { n: 10, label: '10' } } },
    'Gap disabled': { kind: stepper, s: { steps: spacing, current: 's2', disabled: true }, note: 'Set in code: <code>gap={size}</code>' },
    'Gap loading': { kind: stepper, s: { steps: [], busy: true } },
    'Fill': { kind: swatches, s: { steps: colors, current: 'surface' } },
    'Fill drift': { kind: swatches, s: { steps: colors, current: null, drift: { label: '#d23a3a', swatch: '#d23a3a' } } },
    'Radius': { kind: radius, s: { steps: radii, current: 'lg' } },
    'Radius drift': { kind: radius, s: { steps: radii, current: null, drift: { n: 12, label: '12' } } },
    'Shadow': { kind: shadows, s: { steps: elevation, current: 'rest' } },
    'Direction': { kind: segments, s: { steps: dirs, current: 'row' } },
    'Wrap': { kind: segments, s: { steps: wrap, current: 'nowrap' } },
    'Fit': { kind: segments, s: { steps: fit, current: 'cover' } },
    'Align': { kind: align, s: { steps: cells, current: 'center start' } },
    'Line height empty': { kind: null, note: 'Your theme has no line-height steps yet.' },
    'Padding refused': { kind: stepper, s: { steps: spacing, current: 's3', picked: 's5' }, note: 'Board.jsx changed since it was read. Pick again to retry.', error: true },
  };
  const card = (title, names) => `<section class="card"><div class="head">${title}</div>${names.map((n) => { const d = demos[n]; return row(n, d.kind ? d.kind(n, d.s) : '<span class="note">—</span>', d.note ?? '', d.error ? 'error' : ''); }).join('')}</section>`;
  // the language itself: colour by meaning, pills and tags, the old Mac patterns, the ants, the rainbow, the pop
  const hues = [['sky', 'selected · measure · focus'], ['coral', 'off the system'], ['mint', 'on the system · written'], ['butter', 'softer trouble'], ['pink', 'actions'], ['lilac', 'names']];
  const language = `<section class="card lang"><div class="head">Language</div>
    <div class="hues">${hues.map(([h, what]) => `<div class="hue"><span class="chip" style="background:var(--pl-${h}-soft)"></span><span class="line" style="background:var(--pl-${h})"></span><b>${h}</b><span>${what}</span></div>`).join('')}</div>
    <div class="strip"><span class="pl-pill">12</span><span class="pl-pill" data-hue="coral">0</span><span class="pl-pill" data-hue="coral">p-[10px]</span><span class="pl-pill" data-hue="mint">s3</span><span class="pl-pill" data-hue="butter">text-white</span><span class="pl-pill" data-hue="pink">Write 2</span>
      <span class="pl-tag"><svg viewBox="0 0 12 12"><rect x="1.5" y="2" width="9" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="1.5" y="7" width="5" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>Models</span>
      <span class="pl-tag" data-hue="sky">W Fill 500px</span></div>
    <div class="pats"><div><span class="pl-hatch sw"></span>hatch · padding</div><div><span class="pl-dither sw"></span>dither · margin</div><div><span class="pl-checker sw"></span>checker · clear</div></div>
    <div class="measure"><div class="box pl-hatch"><div class="inner">Opus 5.5 <span class="pl-pill" data-hue="mint">High</span></div><span class="pl-pill n t">12</span><span class="pl-pill n l">12</span><span class="pl-pill n b">12</span><span class="pl-pill n r" data-hue="coral">0</span></div></div>
    <div class="strip"><span class="ants pl-ants">picked, not written</span><span class="written">written</span></div>
    <div class="strip"><span class="pl-rainbow band"></span><button type="button" class="replay">Pop</button><span class="pl-tag pop">Models</span></div>
  </section>`;
  // the box model on real elements: a card (margin, border, radius, padding with one side off the scale, a gap between
  // two children) and a paragraph (line boxes, baselines, its type); drawn by the renderer the overlay uses
  const boxes = `<section class="card bxm"><div class="head">Box model</div>
    <div class="stage"><div class="spec" id="spec"><span class="a">Opus 5.5</span><span class="b">High</span></div></div>
    <div class="stage"><p class="para" id="para">Reasoned for six seconds across search, read, code and write.</p></div>
    <div class="legend">${[['m', 'margin'], ['p', 'padding'], ['g', 'gap'], ['b', 'border'], ['r', 'radius'], ['line', 'type'], ['c', 'size']].map(([k, w]) => `<span><i class="ki">${BLOCK_ICONS[k]}</i>${w}</span>`).join('')}<span><i class="ki off">${BLOCK_ICONS.p}</i>off the scale</span><span class="hint">point at a band for its value</span></div>
  </section>`;
  // a scale and the places that use it (scale-marks.js): every state of a step, the three verdicts of a place, the count
  const states = [['rest', 'sm', 14, 15], ['unused', '2xl', 28, 0], ['pointed', 'md', 16, 8], ['pulled', 'xs', 12, 11], ['off', '', 15, 0]];
  const scaleCard = `<section class="card scm"><div class="head">Scale · places</div>
    <div class="row-s"><span class="lbl">Step</span><div class="steps">${states.map(([state, name, n, uses]) => `<div class="cell">${step({ name: name || `${n}px`, n, uses, took: state === 'pulled' ? 87 : 0, state })}<small>${state}</small></div>`).join('')}</div></div>
    <div class="row-s"><span class="lbl">Place</span><div class="steps">${[['off', 'not on your scale'], ['typed', 'yours, typed by hand'], ['on', 'on your scale']].map(([t, w]) => `<div class="cell"><span class="trio">${['rest', 'dim', 'lit'].map((sh) => mark(t, sh)).join('')}</span><small>${w}</small></div>`).join('')}</div></div>
    <div class="row-s"><span class="lbl">Places by a step</span><div class="near">${places(9, 'off')}${places(14, 'typed')}${step({ name: 'xs', n: 12, uses: 11, state: 'rest' })}${places(6, 'off')}${places(11, 'off')}${step({ name: 'sm', n: 14, uses: 15, state: 'pointed' })}${places(4, 'typed', 'lit')}</div></div>
    <div class="row-s"><span class="lbl">Count</span><div class="cnt">${count(45, 'places use your scale')}<button type="button" class="pl-act" id="roll">Snap to your scale</button></div></div>
  </section>`;
  // what the overlay already draws in colour: the clean-up's role chips (an icon lit in its role's hue, the value rolls)
  // and a glyph for each family Plumber judges
  const chipRoles = [['p', 12], ['g', 8], ['m', 24], ['r', 10], ['line', 14]].map(([k, v]) => ({ label: k, icon: BLOCK_ICONS[k], from: v }));
  const families = ['spacing', 'radius', 'type', 'color', 'shadow', 'z', 'motion', 'habit', 'ownership', 'imitation', 'existence'];
  const chipsCard = `<section class="card scc"><div class="head">Roles · families</div>
    <div class="row-s"><span class="lbl">Role chips</span><div class="chips-at" data-state="rest">${chipsHtml(chipRoles)}</div></div>
    <div class="row-s"><span class="lbl">Playing</span><div class="chips-at" id="playing">${chipsHtml(chipRoles)}</div></div>
    <div class="row-s"><span class="lbl">Families</span><div class="fams">${families.map((f, i) => `<span class="fam" style="--hue:var(--pl-${HUES[i % HUES.length]})">${glyph(f)}<small>${f}</small></span>`).join('')}</div></div>
    <div class="row-s"><span class="lbl"></span><button type="button" class="pl-act quiet" id="play">Play the chips</button></div>
  </section>`;
  // the page's type: five steps, calm editorial; mono only for code
  const typeRows = [['display', 'page-display', '576 places type a size by hand.'], ['title', 'page-title', 'Where your text sizes land'], ['body', 'page-body', 'Your theme has 10 text sizes; your code uses 49.'], ['small', 'page-small', 'places use your scale'], ['meta', 'page-meta', 'On your scale · sm · 2xs'], ['figure', 'page-figure', '621']];
  const typeCard = `<section class="card typ"><div class="head">Page type</div>${typeRows.map(([n, t, sample]) => `<div class="tr"><span class="lbl">${n}<small>--pl-${t}</small></span><span style="font:var(--pl-${t});${t === 'page-display' ? 'letter-spacing:var(--pl-tracking-display)' : t === 'page-title' ? 'letter-spacing:var(--pl-tracking-title)' : t === 'page-figure' ? 'font-variant-numeric:tabular-nums;letter-spacing:var(--pl-tracking-display)' : ''}">${sample}</span></div>`).join('')}
    <div class="tr"><span class="lbl">code<small>--pl-card-code</small></span><span style="font:var(--pl-card-code)">text-[0.9375rem] ×62</span></div></section>`;
  const scale = { spacing: [[0, 's0'], [4, 's1'], [8, 's2'], [12, 's3'], [16, 's4'], [20, 's5'], [24, 's6'], [32, 's8']], radius: [[4, 'sm'], [6, 'md'], [10, 'lg'], [14, 'xl']], type: [[12, 'xs'], [14, 'sm'], [16, 'base'], [18, 'lg']] };
  const tokenOf = (family, n) => scale[family]?.find(([v]) => Math.abs(v - n) < 0.5)?.[1] ?? null;
  const css = `${tokens}${PRIMITIVES_CSS}${LANGUAGE_CSS}${BOXMODEL_CSS}${SCRUB_CSS}${CHANGES_CSS}${SCALE_CSS}${SHOW_CSS}${GLYPH_CSS}
    .scm .row-s, .scc .row-s { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--pl-rule); }
    .scm .lbl, .scc .lbl { font: var(--pl-card-meta); color: var(--pl-ink-2); }
    .scm .steps { display: flex; flex-wrap: wrap; align-items: end; gap: 18px; }
    .scm .cell { display: grid; justify-items: center; gap: 6px; }
    .scm .cell small, .scc .fam small { font: 500 10.5px var(--pl-mono); color: var(--pl-ink-3); }
    .scm .trio { display: inline-flex; gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--pl-paper-2); }
    .scm .near { position: relative; display: flex; align-items: center; gap: 10px; height: 120px; padding: 0 8px; }
    .scm .near::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--pl-rule); }
    .scm .near > * { position: relative; }
    .scm .near .sc-step { translate: 0 6px; }
    .scm .cnt { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .typ .tr { display: grid; grid-template-columns: 112px 1fr; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--pl-rule); }
    .typ .lbl { font: var(--pl-card-meta); color: var(--pl-ink-2); display: grid; }
    .typ .lbl small { font: 500 10.5px var(--pl-mono); color: var(--pl-ink-3); }
    .scc .fams { display: flex; flex-wrap: wrap; gap: 10px 14px; }
    .scc .fam { display: grid; justify-items: center; gap: 4px; color: var(--hue); }
    .scc .fam svg { width: 26px; height: 26px; padding: 6px; border-radius: 8px; background: color-mix(in oklab, var(--hue) 14%, transparent); }
    .bxm .stage { padding: 56px 48px 48px; display: flex; }
    .bxm .spec { display: flex; align-items: center; gap: 8px; margin: 16px; padding: 20px 24px 20px 10px; min-width: 300px; border: 1px solid var(--pl-rule); border-radius: 10px; background: var(--pl-paper-2); font: 600 15px var(--pl-sans); color: var(--pl-ink); }
    .bxm .spec .b { font: 600 12px var(--pl-mono); color: var(--pl-mint-ink); background: var(--pl-mint-soft); padding: 3px 8px; border-radius: 7px; }
    .bxm .para { max-width: 260px; margin: 0; font: 500 14px/20px var(--pl-sans); color: var(--pl-ink); }
    .bxm .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 8px 0 4px; font: var(--pl-card-meta); color: var(--pl-ink-2); }
    .bxm .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .bxm .ki { display: inline-block; width: 14px; height: 14px; color: var(--pl-sky); }
    .bxm .ki svg { display: block; width: 100%; height: 100%; }
    .bxm .ki.off { color: var(--pl-coral); }
    .bxm .legend .hint { margin-left: auto; color: var(--pl-ink-3); }
    .lang .hues { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 16px; margin-bottom: 12px; }
    .lang .hue { display: grid; grid-template-columns: 22px 22px 52px 1fr; align-items: center; gap: 6px; font: var(--pl-card-meta); color: var(--pl-ink-2); }
    .lang .hue b { color: var(--pl-ink); font: 600 12px var(--pl-mono); }
    .lang .chip { width: 22px; height: 22px; border-radius: 6px; }
    .lang .line { width: 22px; height: 3px; border-radius: 2px; }
    .lang .strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
    .lang .pats { display: flex; gap: 16px; margin: 10px 0; font: var(--pl-card-meta); color: var(--pl-ink-2); }
    .lang .pats div { display: flex; align-items: center; gap: 8px; }
    .lang .sw { width: 44px; height: 30px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--pl-rule); }
    .lang .measure { padding: 18px 26px; }
    .lang .box { position: relative; padding: 12px; border-radius: 10px; box-shadow: 0 0 0 1px var(--pl-sky); }
    .lang .inner { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; background: var(--pl-paper); font: 600 15px var(--pl-sans); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--pl-sky) 50%, transparent); }
    .lang .n { position: absolute; }
    .lang .n.t { top: -10px; right: 24px; } .lang .n.b { bottom: -10px; right: 24px; } .lang .n.l { left: -18px; top: 50%; translate: 0 -50%; } .lang .n.r { right: -14px; top: 50%; translate: 0 -50%; }
    .lang .ants { padding: 8px 12px; font: var(--pl-card-meta); color: var(--pl-ink); }
    .lang .written { padding: 8px 12px; font: var(--pl-card-meta); color: var(--pl-ink); box-shadow: inset 0 0 0 1px var(--pl-mint); }
    .lang .band { width: 64px; height: 8px; border-radius: 4px; }
    .lang .replay { font: var(--pl-text-label); padding: 4px 10px; border-radius: 7px; border: 0; background: var(--pl-pink-soft); color: var(--pl-pink-ink); cursor: pointer; }
    :host { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 16px; }
    .card { background: var(--pl-paper); border-radius: var(--pl-radius-card); box-shadow: var(--pl-shadow-card); padding: 4px 16px 12px; color: var(--pl-ink); }
    .card .head { font: var(--pl-card-title); padding: 12px 0 6px; }`;
  function render() {
    root.innerHTML = `<style>${css}</style><div class="grid">${[
      language,
      boxes,
      typeCard,
      scaleCard,
      chipsCard,
      card('Scale stepper', ['Padding', 'Padding picked', 'Padding drift', 'Gap disabled', 'Gap loading', 'Padding refused']),
      card('Swatches · radius · shadow', ['Fill', 'Fill drift', 'Radius', 'Radius drift', 'Shadow']),
      card('Segments · align', ['Direction', 'Wrap', 'Fit', 'Align', 'Line height empty']),
    ].join('')}</div>`;
    bind(root, {
      // a pick updates the control in place, so the current fill slides to it
      pick: (name, i) => {
        const d = demos[name]; d.s.current = d.s.steps[i].token; d.s.picked = null; d.s.drift = null;
        const g = root.querySelector(`[aria-label="${name}"]`);
        g.querySelectorAll('.opt[role="radio"]').forEach((o) => { o.setAttribute('aria-checked', String(+o.dataset.i === i)); o.removeAttribute('data-picked'); });
        g.querySelector('.notch')?.remove();
        place(g);
      },
      page: (name, start) => { demos[name].s.start = start; render(); },
    });
  }
  render();
  // the overlay over the specimens, drawn from their live layout and redrawn as the page moves
  const layer = document.createElement('div');
  // at rest, only patterns, colour and the names; pointing at one band shows its one value
  let bands = [];
  const pointed = document.createElement('div');
  const draw = () => {
    const a = boxModel(root.getElementById('spec'), { name: 'ModelRow', tokenOf }), b = boxModel(root.getElementById('para'), { name: 'p', tokenOf });
    bands = [...a.bands, ...b.bands];
    layer.innerHTML = a.html + b.html;
    if (!layer.isConnected) root.append(layer, pointed);
  };
  draw();
  addEventListener('scroll', draw, { passive: true });
  addEventListener('resize', draw);
  // direct manipulation: over a band the cursor says it can be dragged; pressing scrubs it through the scale with the
  // pointer held in place; the box model redraws as it steps; letting go adds the change to the bar
  const names = new Map([['spec', 'ModelRow'], ['para', 'p']]);
  const changes = new Changes(root, { onAccept: async (batch) => { await new Promise((r) => setTimeout(r, 400)); return batch.map((b) => ({ el: b.el, ok: true })); }, onSelect: () => draw() });
  let dragging = false;
  addEventListener('pointermove', (e) => {
    if (dragging) return;
    const b = bandAt(bands, e.clientX, e.clientY);
    document.documentElement.style.cursor = b?.prop && b.family === 'spacing' ? cursorOf(b.prop) : '';
    pointAt(pointed, bands, e.clientX, e.clientY);
  }, { passive: true });
  addEventListener('pointerdown', (e) => {
    const b = bandAt(bands, e.clientX, e.clientY);
    if (!b?.prop || b.family !== 'spacing') return;
    const steps = scale.spacing.map(([n, token]) => ({ token, n }));
    const original = [b.el.style.getPropertyValue(b.prop), b.el.style.getPropertyPriority(b.prop)];
    const from = { token: tokenOf('spacing', b.n), n: b.n };
    dragging = true;
    pointAt(pointed, [], 0, 0);
    scrub(e, { el: b.el, prop: b.prop, steps, from: b.n, host: pointed, onStep: () => draw(),
      onDone: (step) => { dragging = false; draw(); if (step) changes.set(b.el, names.get(b.el.id) ?? b.el.localName, b.prop, from, step, original); } });
  }, true);
  addEventListener('keydown', (e) => { if ((e.key === 'j' || e.key === 'k') && changes.move(e.key === 'j' ? 1 : -1)) e.preventDefault(); });
  // the count rolls to what every place snapped in would make, and back
  root.addEventListener('click', (e) => {
    const b = e.target.closest('#roll'); if (!b) return;
    const on = b.dataset.on !== '1'; b.dataset.on = on ? '1' : '0'; b.textContent = on ? 'Let go' : 'Snap to your scale';
    const c = root.querySelector('.scm .sc-count'); rollCount(c, on ? 621 : 45);
    c.querySelector('.say').textContent = on ? 'places on your scale, if every size snapped to it' : 'places use your scale';
  });
  // the chips play as the show plays them: one role at a time lights in its hue and its value rolls
  root.addEventListener('click', async (e) => {
    if (!e.target.closest('#play')) return;
    const chips = [...root.querySelectorAll('#playing .sh-chip')], to = [16, 12, 24, 12, 16];
    chips.forEach((c) => { c.removeAttribute('data-on'); c.removeAttribute('data-done'); });
    for (const [i, c] of chips.entries()) { c.setAttribute('data-on', ''); roll(c, to[i]); await new Promise((r) => setTimeout(r, 700)); c.removeAttribute('data-on'); c.setAttribute('data-done', ''); }
  });
  root.addEventListener('click', (e) => { if (!e.target.closest('.replay')) return; const t = root.querySelector('.pop'); t.classList.remove('pl-pop'); void t.offsetWidth; t.classList.add('pl-pop'); });
  // the page and the cards always share one scheme: the OS's at first, then the button's
  const button = document.getElementById('scheme');
  const setScheme = (dark) => { document.body.classList.toggle('dark', dark); host.dataset.scheme = dark ? 'dark' : 'light'; button.textContent = dark ? 'Light' : 'Dark'; };
  setScheme(matchMedia('(prefers-color-scheme: dark)').matches);
  button.addEventListener('click', () => setScheme(!document.body.classList.contains('dark')));
</script>
</body>
</html>
