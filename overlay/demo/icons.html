<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icons · React Plumber</title>
<style>
  body { margin: 0; padding: 32px 16px 64px; background: #f6f1e6; font: 14px/1.5 system-ui, sans-serif; color: #1c1b19; }
  body.dark { background: #17161a; color: #eeede9; }
  header { max-width: 1040px; margin: 0 auto 20px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; opacity: .7; font-size: 13px; max-width: 760px; }
  header button { margin-left: auto; font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid currentColor; background: none; color: inherit; cursor: pointer; }
  #board { max-width: 1040px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <h1>Icons</h1>
  <p>A review sheet. The toy set: solid, in colour, each property in its own hue and its own pattern, the way the pieces fly out when a fix lands. Point at one. Proposals live on this page only until they are approved.</p>
  <button id="scheme" type="button">Dark</button>
</header>
<div id="board"></div>
<script type="module">
  import tokens from '../src/tokens.css?raw';
  import { LANGUAGE_CSS } from '../src/language.js';
  import { BLOCK_ICONS } from '../src/boxmodel.js';

  const host = document.getElementById('board');
  const root = host.attachShadow({ mode: 'open' });
  host.dataset.scheme = 'light';

  // ── the toy set ──
  // Rules: a 24 grid; solid shapes in the overlay's own hues; white for what sits on a solid; a pattern says "space"
  // (padding is hatched, margin is dotted, a gap is striped: the same three the page is drawn with); no hairlines, no
  // grey; one small joke allowed per icon.
  const HUES = ['mint', 'butter', 'lilac', 'pink', 'sky'];
  const h = (hue) => `var(--pl-${hue})`, ink = (hue) => `var(--pl-${hue}-ink)`, soft = (hue) => `var(--pl-${hue}-soft)`;
  const W = '#fff';
  const line = (d, color, w = 2.2) => `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const svg = (body) => `<svg viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
  const tileOf = (hue, mark) => `<rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="${h(hue)}"/>${mark}`;
  // the patterns, one of each per hue (a pattern takes its colour from where it is defined, not where it is used)
  const defs = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${HUES.map((hue) => `
    <pattern id="hatch-${hue}" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.5" height="3.4" fill="${h(hue)}"/></pattern>
    <pattern id="dots-${hue}" width="3.6" height="3.6" patternUnits="userSpaceOnUse"><circle cx="1.8" cy="1.8" r="1" fill="${h(hue)}"/></pattern>
    <pattern id="stripes-${hue}" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="${h(hue)}"/></pattern>
    <pattern id="check-${hue}" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="2.5" height="2.5" fill="${h(hue)}" opacity=".55"/><rect x="2.5" y="2.5" width="2.5" height="2.5" fill="${h(hue)}" opacity=".55"/></pattern>`).join('')}</defs></svg>`;

  const PROPS = [
    ['padding', 'the space inside: hatched', svg(`<rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="${soft('mint')}"/><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="url(#hatch-mint)"/><rect x="7.5" y="7.5" width="9" height="9" rx="2.6" fill="${h('mint')}"/>`)],
    ['margin', 'the space outside: dotted', svg(`<rect x="1.5" y="1.5" width="21" height="21" rx="6.5" fill="url(#dots-butter)"/><rect x="6.5" y="6.5" width="11" height="11" rx="3.2" fill="${h('butter')}"/>`)],
    ['gap', 'the space between: striped', svg(`<rect x="2" y="4" width="7.4" height="16" rx="2.6" fill="${h('lilac')}"/><rect x="14.6" y="4" width="7.4" height="16" rx="2.6" fill="${h('lilac')}"/><rect x="10" y="6.5" width="4" height="11" rx="1" fill="url(#stripes-lilac)"/>`)],
    ['corner', '', svg(`<path d="M3.5 20.5V12a8.5 8.5 0 0 1 8.5-8.5h8.5v17z" fill="${h('pink')}"/>${line('M8.5 20.5V13a4.5 4.5 0 0 1 4.5-4.5h7.5', W, 1.8)}`)],
    ['border', '', svg(`<rect x="4.2" y="4.2" width="15.6" height="15.6" rx="5" fill="${soft('sky')}" stroke="${h('sky')}" stroke-width="4.4"/>`)],
    ['type', '', svg(tileOf('sky', line('M7.6 17 12 6.8 16.4 17M9.4 13.4h5.2', W, 2.3)))],
    ['size', '', svg(`<path d="M2 12 7.6 6.4v3.4h8.8V6.4L22 12l-5.6 5.6v-3.4H7.6v3.4z" fill="${h('mint')}"/>`)],
    ['position', 'how far from an edge', svg(`<rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="${soft('lilac')}"/><rect x="7.5" y="4.8" width="9" height="7.6" rx="2.4" fill="${h('lilac')}"/>${line('M12 14.2v5M9.4 19.2h5.2', ink('lilac'), 2)}`)],
    ['width', '', svg(`<rect x="2.2" y="3.5" width="3.4" height="17" rx="1.7" fill="${ink('sky')}"/><rect x="18.4" y="3.5" width="3.4" height="17" rx="1.7" fill="${ink('sky')}"/><rect x="7" y="8.4" width="10" height="7.2" rx="2.4" fill="${h('sky')}"/>`)],
    ['height', '', svg(`<rect x="3.5" y="2.2" width="17" height="3.4" rx="1.7" fill="${ink('sky')}"/><rect x="3.5" y="18.4" width="17" height="3.4" rx="1.7" fill="${ink('sky')}"/><rect x="8.4" y="7" width="7.2" height="10" rx="2.4" fill="${h('sky')}"/>`)],
    ['text colour', '', svg(`${line('M6.8 14.6 12 3.2l5.2 11.4M8.9 10.6h6.2', 'var(--pl-ink)', 2.5)}<rect x="2.5" y="17.6" width="5.2" height="4" rx="2" fill="${h('pink')}"/><rect x="7.1" y="17.6" width="5" height="4" fill="${h('butter')}"/><rect x="11.9" y="17.6" width="5" height="4" fill="${h('mint')}"/><rect x="16.3" y="17.6" width="5.2" height="4" rx="2" fill="${h('sky')}"/>`)],
    ['fill', 'background', svg(`<path d="M12 2c4 4.8 6.6 8 6.6 11.4a6.6 6.6 0 0 1-13.2 0C5.4 10 8 6.800 12 2z" fill="${h('pink')}"/>${line('M8.8 13.8a3.2 3.2 0 0 0 2.6 3.4', W, 1.8)}`)],
    ['shadow', '', svg(`<rect x="6.5" y="7" width="15.5" height="14.5" rx="4.4" fill="${ink('butter')}" opacity=".3"/><rect x="2" y="2.5" width="15.5" height="14.5" rx="4.4" fill="${h('butter')}"/>`)],
    ['opacity', '', svg(`<circle cx="12" cy="12" r="9.5" fill="url(#check-lilac)"/><path d="M12 2.500a9.5 9.5 0 0 0 0 19z" fill="${h('lilac')}"/><circle cx="12" cy="12" r="8.6" fill="none" stroke="${h('lilac')}" stroke-width="1.8"/>`)],
    ['layer', 'what sits on top', svg(`<path d="M12 12.6 21.5 17 12 21.4 2.5 17z" fill="${h('sky')}"/><path d="M12 8.1 21.5 12.500 12 16.9 2.5 12.500z" fill="${h('butter')}"/><path d="M12 3.6 21.5 8 12 12.4 2.500 8z" fill="${h('pink')}"/>`)],
    ['motion', 'it bounces', svg(`<circle cx="4.200" cy="18.5" r="1.3" fill="${h('mint')}" opacity=".35"/><circle cx="7.600" cy="13.8" r="1.9" fill="${h('mint')}" opacity=".55"/><circle cx="11.6" cy="10" r="2.500" fill="${h('mint')}" opacity=".78"/><circle cx="17" cy="7" r="4.6" fill="${h('mint')}"/><circle cx="15.5" cy="5.500" r="1.100" fill="${W}" opacity=".9"/>`)],
    ['alignment', '', svg(`<rect x="2.500" y="2.500" width="3" height="19" rx="1.500" fill="${ink('lilac')}"/><rect x="7.500" y="4.500" width="14" height="4.200" rx="2.100" fill="${h('lilac')}"/><rect x="7.500" y="9.900" width="8" height="4.200" rx="2.100" fill="${h('pink')}"/><rect x="7.500" y="15.300" width="11" height="4.200" rx="2.100" fill="${h('lilac')}"/>`)],
  ].map(([name, note, icon]) => ({ name, note, icon }));

  const PARTS = [
    ['button', 'with something to press it', svg(`<rect x="1.800" y="5.500" width="20.400" height="11.500" rx="5.750" fill="${h('pink')}"/><rect x="6.500" y="10.200" width="9" height="2.200" rx="1.100" fill="${W}"/><path d="M14.800 12.800 21.600 15.800l-2.900 .900-.900 2.900z" fill="${ink('pink')}" stroke="${W}" stroke-width="1" stroke-linejoin="round"/>`)],
    ['link', '', svg(`<rect x="2.300" y="8.300" width="11.400" height="7.400" rx="3.700" fill="none" stroke="${h('sky')}" stroke-width="2.800"/><rect x="10.300" y="8.300" width="11.400" height="7.400" rx="3.700" fill="none" stroke="${h('mint')}" stroke-width="2.800"/>`)],
    ['field', 'input, textarea', svg(`<rect x="2" y="5" width="20" height="14" rx="4.400" fill="${soft('sky')}" stroke="${h('sky')}" stroke-width="1.800"/><rect x="6" y="8.600" width="2.200" height="6.800" rx="1.100" fill="${ink('sky')}"/><circle cx="11.400" cy="12" r="1.100" fill="${h('sky')}"/><circle cx="14.600" cy="12" r="1.100" fill="${h('sky')}"/><circle cx="17.800" cy="12" r="1.100" fill="${h('sky')}"/>`)],
    ['select', 'a menu of options', svg(`<rect x="2" y="5" width="20" height="14" rx="4.400" fill="${soft('lilac')}" stroke="${h('lilac')}" stroke-width="1.800"/><rect x="13" y="7.200" width="6.800" height="9.600" rx="2.400" fill="${h('lilac')}"/>${line('M14.800 11.200l1.600 1.700 1.600-1.700', W, 1.700)}<rect x="5" y="10.900" width="5.500" height="2.200" rx="1.100" fill="${ink('lilac')}"/>`)],
    ['checkbox', '', svg(`<rect x="3" y="3" width="18" height="18" rx="5.600" fill="${h('mint')}"/>${line('M7.400 12.400l3.100 3.100 6.100-7', W, 2.600)}`)],
    ['switch', '', svg(`<rect x="1.800" y="5.800" width="20.400" height="12.400" rx="6.200" fill="${h('mint')}"/><circle cx="16" cy="12" r="4.300" fill="${W}"/>`)],
    ['heading', '', svg(tileOf('pink', line('M8 7.200v9.600M16 7.200v9.600M8 12h8', W, 2.500)))],
    ['text', 'a paragraph, a label', svg(`<rect x="3" y="4.200" width="18" height="3.800" rx="1.900" fill="${h('lilac')}"/><rect x="3" y="10.100" width="18" height="3.800" rx="1.900" fill="${h('lilac')}"/><rect x="3" y="16" width="10.500" height="3.800" rx="1.900" fill="${h('lilac')}" opacity=".55"/>`)],
    ['image', 'sun, hills', svg(`<rect x="2" y="3.500" width="20" height="17" rx="4.800" fill="${h('sky')}"/><circle cx="8" cy="8.800" r="2.500" fill="${h('butter')}"/><path d="M2.300 17.800 8.600 12.200l3.800 3.300 3.300-2.800 6 5.100a4.800 4.800 0 0 1-4.500 2.700H6.800a4.800 4.800 0 0 1-4.500-2.700z" fill="${h('mint')}"/>`)],
    ['icon', 'an svg mark', svg(`<path d="M12 1.800 14.500 9.500 22.200 12l-7.700 2.500L12 22.200l-2.500-7.700L1.800 12l7.700-2.500z" fill="${h('butter')}"/><circle cx="19.200" cy="4.800" r="1.600" fill="${h('pink')}"/>`)],
    ['avatar', 'says hello', svg(`<circle cx="12" cy="12" r="9.800" fill="${h('pink')}"/><circle cx="8.700" cy="10.200" r="1.300" fill="${ink('pink')}"/><circle cx="15.300" cy="10.200" r="1.300" fill="${ink('pink')}"/>${line('M8.200 14.200a4.400 4.400 0 0 0 7.600 0', ink('pink'), 1.800)}`)],
    ['chip', 'a tag, a badge', svg(`<rect x="1.800" y="7" width="20.400" height="10" rx="5" fill="${soft('lilac')}" stroke="${h('lilac')}" stroke-width="1.800"/><circle cx="7" cy="12" r="2.200" fill="${h('lilac')}"/><rect x="10.600" y="10.900" width="8" height="2.200" rx="1.100" fill="${ink('lilac')}"/>`)],
    ['card', '', svg(`<rect x="2.500" y="2.500" width="19" height="19" rx="5" fill="${soft('butter')}" stroke="${h('butter')}" stroke-width="1.800"/><rect x="5.600" y="5.600" width="12.800" height="6" rx="2" fill="${h('butter')}"/><rect x="5.600" y="13.800" width="9" height="2.100" rx="1.050" fill="${ink('butter')}" opacity=".7"/><rect x="5.600" y="17.100" width="6" height="2.100" rx="1.050" fill="${ink('butter')}" opacity=".4"/>`)],
    ['list', '', svg(`<circle cx="4.500" cy="5.800" r="2.200" fill="${h('pink')}"/><circle cx="4.500" cy="12" r="2.200" fill="${h('butter')}"/><circle cx="4.500" cy="18.200" r="2.200" fill="${h('mint')}"/><rect x="9" y="4.300" width="12.500" height="3" rx="1.500" fill="var(--pl-ink)" opacity=".8"/><rect x="9" y="10.500" width="9.500" height="3" rx="1.500" fill="var(--pl-ink)" opacity=".8"/><rect x="9" y="16.700" width="11.500" height="3" rx="1.500" fill="var(--pl-ink)" opacity=".8"/>`)],
    ['row', 'one item of a list', svg(`<rect x="1.800" y="6.500" width="20.400" height="11" rx="3.600" fill="${soft('sky')}"/><circle cx="6.600" cy="12" r="2.600" fill="${h('sky')}"/><rect x="10.800" y="10.800" width="6.500" height="2.400" rx="1.200" fill="${ink('sky')}"/>${line('M19 10.400l1.500 1.600-1.500 1.600', h('sky'), 1.700)}`)],
    ['table', '', svg(`<rect x="2" y="3" width="20" height="18" rx="4.400" fill="${soft('mint')}"/><path d="M6.400 3h11.200A4.400 4.400 0 0 1 22 7.400V9H2V7.400A4.400 4.400 0 0 1 6.400 3z" fill="${h('mint')}"/>${line('M2.500 14.800h19M9 9.500v11M15.500 9.500v11', h('mint'), 1.500)}`)],
    ['tabs', '', svg(`<path d="M2 19.500V9a3.200 3.200 0 0 1 3.200-3.200h3.600A3.200 3.200 0 0 1 12 9v10.500z" fill="${h('pink')}"/><rect x="13.200" y="9.200" width="4" height="10.300" rx="1.600" fill="${soft('pink')}"/><rect x="18.200" y="9.200" width="3.800" height="10.300" rx="1.600" fill="${soft('pink')}"/><rect x="1.500" y="18.800" width="21" height="2.400" rx="1.200" fill="${ink('pink')}"/>`)],
    ['navigation', 'a sidebar, a header', svg(`<rect x="2" y="3" width="20" height="18" rx="4.600" fill="${soft('lilac')}"/><path d="M6.600 3H9.500v18H6.600A4.600 4.600 0 0 1 2 16.400V7.600A4.600 4.600 0 0 1 6.600 3z" fill="${h('lilac')}"/><circle cx="5.750" cy="7.800" r="1.200" fill="${W}"/><circle cx="5.750" cy="12" r="1.200" fill="${W}" opacity=".6"/><circle cx="5.750" cy="16.200" r="1.200" fill="${W}" opacity=".6"/>`)],
    ['dialog', 'three dots, of course', svg(`<rect x="2" y="3.500" width="20" height="17" rx="4.600" fill="${soft('sky')}"/><path d="M6.600 3.500h10.800A4.600 4.600 0 0 1 22 8.100V9.400H2V8.100A4.600 4.600 0 0 1 6.600 3.500z" fill="${h('sky')}"/><circle cx="5.800" cy="6.500" r="1.150" fill="${h('pink')}"/><circle cx="9.200" cy="6.500" r="1.150" fill="${h('butter')}"/><circle cx="12.600" cy="6.500" r="1.150" fill="${h('mint')}"/><rect x="12.500" y="14" width="6.500" height="3.800" rx="1.900" fill="${h('pink')}"/>`)],
    ['tooltip', 'a popover, a menu', svg(`<path d="M5.500 2.800h13A3.800 3.800 0 0 1 22.300 6.600v6.800a3.800 3.800 0 0 1-3.800 3.800h-3.300L12 21.200l-3.200-4H5.500a3.800 3.800 0 0 1-3.800-3.800V6.600A3.800 3.800 0 0 1 5.500 2.800z" fill="${h('butter')}"/><circle cx="7.800" cy="10" r="1.500" fill="${W}"/><circle cx="12" cy="10" r="1.500" fill="${W}"/><circle cx="16.200" cy="10" r="1.500" fill="${W}"/>`)],
    ['toast', 'it is toast', svg(`<path d="M5.200 10.200C2.600 9.200 2.400 5.200 6.200 4c2.600-.800 9-.800 11.600 0 3.800 1.200 3.600 5.200 1 6.200V18a3 3 0 0 1-3 3H8.200a3 3 0 0 1-3-3z" fill="${h('butter')}" stroke="${ink('butter')}" stroke-width="1.500" stroke-linejoin="round"/><circle cx="9.400" cy="12.600" r="1.050" fill="${ink('butter')}"/><circle cx="14.600" cy="12.600" r="1.050" fill="${ink('butter')}"/>${line('M9.800 15.600a2.800 2.800 0 0 0 4.400 0', ink('butter'), 1.500)}`)],
  ].map(([name, note, icon]) => ({ name, note, icon }));

  const toy = (i) => `<figure class="toy" tabindex="0"><span class="row"><i class="big">${i.icon}</i><i class="mid">${i.icon}</i><i class="sm">${i.icon}</i></span><figcaption>${i.name}${i.note ? `<small>${i.note}</small>` : ''}</figcaption></figure>`;
  const OLD = [['p', 'padding'], ['m', 'margin'], ['g', 'gap'], ['b', 'border'], ['r', 'corner'], ['line', 'type'], ['c', 'size']];

  root.innerHTML = `<style>${tokens}${LANGUAGE_CSS}
    :host { display: block; font-family: var(--pl-sans); color: var(--pl-ink); }
    :host([data-scheme="dark"]) { --pl-paper: #2a2930; --pl-paper-2: #35343c; --pl-rule: #45444d; --pl-ink: #f4f3ef; }
    .band { margin: 28px 0 12px; font: 600 12px/1 var(--pl-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--pl-ink-2); }
    .band:first-of-type { margin-top: 0; }
    .set { margin: 0 0 14px; padding: 16px 16px 18px; border-radius: 18px; background: var(--pl-paper); box-shadow: 0 0 0 1px var(--pl-rule); }
    .set h2 { margin: 0; font: 600 15px/20px var(--pl-sans); }
    .set p { margin: 3px 0 0; font: 400 13px/19px var(--pl-sans); color: var(--pl-ink-2); max-width: 760px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
    .toy { margin: 0; padding: 14px 12px 11px; border-radius: 14px; background: var(--pl-paper-2); display: flex; flex-direction: column; gap: 10px; outline: none; cursor: default;
      transition: background-color 200ms var(--pl-ease-out), translate 300ms var(--pl-spring-pop); }
    .toy .row { display: flex; align-items: flex-end; gap: 12px; height: 46px; }
    .toy i { display: block; flex: none; transform-origin: 50% 80%; transition: rotate 420ms var(--pl-spring-pop), scale 420ms var(--pl-spring-pop); }
    .toy svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .toy .big { width: 44px; height: 44px; }
    .toy .mid { width: 24px; height: 24px; }
    .toy .sm { width: 16px; height: 16px; }
    /* pointed at, the toy is picked up: it tips and grows, the small ones lean the other way */
    .toy:hover, .toy:focus-visible { translate: 0 -2px; background: color-mix(in oklab, var(--pl-butter-soft) 55%, var(--pl-paper-2)); }
    .toy:hover .big, .toy:focus-visible .big { rotate: -9deg; scale: 1.14; }
    .toy:hover .mid, .toy:focus-visible .mid { rotate: 7deg; scale: 1.08; }
    .toy:hover .sm, .toy:focus-visible .sm { rotate: -5deg; }
    .toy figcaption { font: 600 13px/16px var(--pl-sans); color: var(--pl-ink); }
    .toy figcaption small { display: block; font: 400 11px/14px var(--pl-sans); color: var(--pl-ink-3); }
    .was { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-top: 12px; align-items: center; }
    .was span { display: inline-flex; align-items: center; gap: 7px; font: 500 12px/1 var(--pl-sans); color: var(--pl-ink-2); }
    .was i { display: block; width: 16px; height: 16px; color: var(--pl-ink-2); }
    .was svg { display: block; width: 100%; height: 100%; }
    /* the bar, with a toy in it */
    .bars { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .fb { display: inline-flex; align-items: center; gap: 9px; height: 46px; padding: 0 14px 0 9px; border-radius: 23px; white-space: nowrap; }
    .fb i { display: block; width: 28px; height: 28px; }
    .fb svg { display: block; width: 100%; height: 100%; }
    .fb code { font: 600 13px/1 var(--pl-mono); color: var(--pl-ink); }
    @media (prefers-reduced-motion: reduce) { .toy, .toy i { transition: none; } }
  </style>${defs}
  <div class="band">The toy set · proposed</div>
  <section class="set"><h2>Properties</h2><p>Padding is hatched, margin is dotted, a gap is striped: the same three patterns the page is drawn with, each in its own colour. The rest follow: solid shapes, the overlay’s five hues, white for what sits on a solid.</p><div class="grid">${PROPS.map(toy).join('')}</div></section>
  <section class="set"><h2>Elements and patterns</h2><p>What a page is made of, for saying what the thing in hand is with a picture. Each has one small joke.</p><div class="grid">${PARTS.map(toy).join('')}</div></section>
  <section class="set"><h2>In the fix bar</h2><p>How a cause would open: its toy, then the class.</p><div class="bars">${[[PROPS[3], 'rounded-[5px]'], [PROPS[0], 'px-[7px]'], [PROPS[2], 'gap-[13px]'], [PROPS[1], 'mt-[10px]'], [PROPS[5], 'text-[13px]'], [PROPS[12], 'shadow-[0_1px_2px]']].map(([i, cls]) => `<span class="fb pl-card"><i>${i.icon}</i><code>${cls}</code></span>`).join('')}</div></section>
  <div class="band">What the overlay has today</div>
  <section class="set"><h2>The grey line set</h2><p>The box icons the overlay uses now, for comparison. The toy set would take their place.</p><div class="was">${OLD.map(([k, name]) => `<span><i>${BLOCK_ICONS[k]}</i>${name}</span>`).join('')}</div></section>`;

  document.getElementById('scheme').onclick = (e) => { const dark = document.body.classList.toggle('dark'); host.dataset.scheme = dark ? 'dark' : 'light'; e.target.textContent = dark ? 'Light' : 'Dark'; };
</script>
</body>
</html>
