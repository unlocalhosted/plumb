<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icons · React Plumber</title>
<style>
  body { margin: 0; padding: 32px 16px 64px; background: #f6f1e6; font: 14px/1.5 system-ui, sans-serif; color: #1c1b19; }
  body.dark { background: #17161a; color: #eeede9; }
  header { max-width: 1040px; margin: 0 auto 20px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; opacity: .7; font-size: 13px; max-width: 760px; }
  header button { margin-left: auto; font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid currentColor; background: none; color: inherit; cursor: pointer; }
  #board { max-width: 1040px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <h1>Icons</h1>
  <p>A review sheet for the toy set. The avatar, the toast and the tooltip are the bar every other one is drawn to. Point at one. Proposals live on this page only until they are approved.</p>
  <button id="scheme" type="button">Dark</button>
</header>
<div id="board"></div>
<script type="module">
  import tokens from '../src/tokens.css?raw';
  import { LANGUAGE_CSS } from '../src/language.js';
  import { BLOCK_ICONS } from '../src/boxmodel.js';

  const host = document.getElementById('board');
  const root = host.attachShadow({ mode: 'open' });
  host.dataset.scheme = 'light';

  // ── the toy set ──
  // The rules (written out on the page too): one solid body in one hue; details cut out in white or drawn on in the
  // hue's own ink, never a tint with an outline; it says what the thing does; nothing finer than 1.5 on the 24 grid and
  // no more than four parts, so it still reads at 16; a pattern only ever means space; a face only on things that
  // speak to you.
  const h = (hue) => `var(--pl-${hue})`, ink = (hue) => `var(--pl-${hue}-ink)`, soft = (hue) => `var(--pl-${hue}-soft)`;
  const W = '#fff';
  const line = (d, color, w = 2.2) => `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const box = (x, y, w, hh, r, fill, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="${r}" fill="${fill}"${extra}/>`;
  const dot = (cx, cy, r, fill, extra = '') => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}"${extra}/>`;
  const svg = (body) => `<svg viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
  const tile = (hue, mark) => box(2.5, 2.5, 19, 19, 5.5, h(hue)) + mark;
  // two patterns are drawn as patterns (the hatch of padding, the checker of see-through); dots and stripes are placed
  // one by one, so each sits where it should at every size
  const defs = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <pattern id="hatch-mint" width="4.6" height="4.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.1" height="4.6" fill="${h('mint')}"/></pattern>
    <pattern id="check-lilac" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="${h('lilac')}" opacity=".5"/><rect x="3" y="3" width="3" height="3" fill="${h('lilac')}" opacity=".5"/></pattern>
    <clipPath id="pad-clip"><rect x="2" y="2" width="20" height="20" rx="6"/></clipPath></defs></svg>`;
  // margin's halo: sixteen dots on a ring around the block, none behind it
  const halo = [3.1, 7.55, 12, 16.45, 20.9].flatMap((x) => [[x, 3.1], [x, 20.9]]).concat([7.55, 12, 16.45].flatMap((y) => [[3.1, y], [20.9, y]])).map(([x, y]) => dot(x, y, 1.25, h('butter'))).join('');
  // a ring of eight dots, each a little smaller and fainter than the one before: something turning
  const turning = [[12, 4], [17.66, 6.34], [20, 12], [17.66, 17.66], [12, 20], [6.34, 17.66], [4, 12], [6.34, 6.34]].map(([x, y], k) => dot(x, y, 2.5 - k * 0.2, h('sky'), ` opacity="${(1 - k * 0.09).toFixed(2)}"`)).join('');

  const PROPS = [
    ['padding', 'the cushion inside: hatched', svg(`<g clip-path="url(#pad-clip)"><rect x="2" y="2" width="20" height="20" fill="url(#hatch-mint)"/></g><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="${h('mint')}" stroke-width="2"/>${box(8, 8, 8, 8, 2.4, h('mint'))}`)],
    ['margin', 'the room outside: dotted', svg(halo + box(6.6, 6.6, 10.8, 10.8, 3.2, h('butter')))],
    ['gap', 'the space between: striped', svg(box(2, 4, 7.2, 16, 2.6, h('lilac')) + box(14.8, 4, 7.2, 16, 2.6, h('lilac')) + [6.4, 9.55, 12.7, 15.85].map((y) => box(10.3, y, 3.4, 1.75, 0.875, h('lilac'))).join(''))],
    ['corner', 'the arc, and the arc inside it', svg(`<path d="M3.500 20.500V12a8.500 8.500 0 0 1 8.500-8.500h8.500v17z" fill="${h('pink')}"/>${line('M8.500 20.500V13a4.500 4.500 0 0 1 4.500-4.500h7.500', W, 1.9)}`)],
    ['border', 'only the edge', svg(`<rect x="4.300" y="4.300" width="15.400" height="15.400" rx="4.800" fill="none" stroke="${h('sky')}" stroke-width="4.600"/>`)],
    ['size', 'pulled from two corners', svg(tile('mint', line('M7.600 12V7.600H12M16.400 12v4.400H12', W, 2.2) + line('M8.400 8.400l7.200 7.200', W, 1.8)))],
    ['width', '', svg(box(1.8, 6.5, 20.4, 11, 3.6, h('sky')) + line('M6.800 12h10.400', W, 2) + line('M8.700 9.700 6.400 12l2.300 2.300M15.300 9.700 17.600 12l-2.300 2.300', W, 2))],
    ['height', '', svg(box(6.5, 1.8, 11, 20.4, 3.6, h('sky')) + line('M12 6.800v10.400', W, 2) + line('M9.700 8.700 12 6.400l2.300 2.300M9.700 15.300 12 17.600l2.300-2.300', W, 2))],
    ['ratio', 'the diagonal holds the shape', svg(box(1.8, 5.2, 20.4, 13.6, 3.6, h('butter')) + line('M6.200 15.200 17.800 8.800', W, 2) + dot(6.2, 15.2, 1.5, W) + dot(17.8, 8.8, 1.5, W)), 1],
    ['position', 'a pin where it sits', svg(`<path d="M12 2.200a7.300 7.300 0 0 1 7.300 7.300c0 5.200-7.300 12.300-7.300 12.300S4.700 14.700 4.700 9.500A7.300 7.300 0 0 1 12 2.200z" fill="${h('lilac')}"/>${dot(12, 9.5, 2.7, W)}`)],
    ['layer', 'what sits on top', svg(`<path d="M12 12.600 21.500 17 12 21.400 2.500 17z" fill="${h('sky')}"/><path d="M12 8.100 21.500 12.500 12 16.900 2.500 12.500z" fill="${h('butter')}"/><path d="M12 3.600 21.500 8 12 12.400 2.500 8z" fill="${h('pink')}"/>`)],
    ['rotate', '', svg(`<rect x="6.800" y="7.800" width="10.400" height="10.400" rx="3" fill="${h('pink')}" transform="rotate(-14 12 13)"/>${line('M5.200 7.400a9 9 0 0 1 12.600-2.600', ink('pink'), 2)}${line('M15 2.400l3 2.300-2.200 3', ink('pink'), 2)}`), 1],
    ['type', '', svg(tile('sky', line('M7.600 17 12 6.800 16.400 17M9.400 13.400h5.200', W, 2.3)))],
    ['weight', 'how heavy the letters are', svg(tile('sky', `<path d="M8.600 6.800h4.200a2.600 2.600 0 0 1 0 5.200H8.600zM8.600 12h4.900a2.600 2.600 0 0 1 0 5.200H8.600z" fill="none" stroke="${W}" stroke-width="2.4" stroke-linejoin="round"/>`)), 1],
    ['line height', 'the air between lines', svg(tile('sky', box(10.6, 7, 7.6, 2.6, 1.3, W) + box(10.6, 14.4, 7.6, 2.6, 1.3, W) + line('M7 7.400v9.200', W, 1.9) + line('M5.400 9 7 7.400 8.600 9M5.400 15 7 16.600 8.600 15', W, 1.9))), 1],
    ['letter spacing', 'the air between letters', svg(tile('sky', line('M6.400 7v10M17.600 7v10', W, 2) + line('M9.500 16 12 9.200 14.500 16', W, 2))), 1],
    ['text colour', '', svg(`${line('M6.800 14.600 12 3.200l5.200 11.400M8.900 10.600h6.200', 'var(--pl-ink)', 2.6)}${box(2.5, 17.6, 5.4, 4, 2, h('pink'))}<rect x="7.100" y="17.600" width="5" height="4" fill="${h('butter')}"/><rect x="11.900" y="17.600" width="5" height="4" fill="${h('mint')}"/>${box(16.1, 17.6, 5.4, 4, 2, h('sky'))}`)],
    ['fill', 'a drop of paint', svg(`<path d="M12 2c4 4.800 6.600 8 6.600 11.400a6.600 6.600 0 0 1-13.200 0C5.400 10 8 6.800 12 2z" fill="${h('pink')}"/>${line('M8.800 13.800a3.200 3.200 0 0 0 2.600 3.400', W, 1.9)}`)],
    ['shadow', 'the block and what it casts', svg(box(6.5, 7, 15.5, 14.5, 4.4, ink('butter'), ' opacity=".32"') + box(2, 2.5, 15.5, 14.5, 4.4, h('butter')))],
    ['opacity', 'half there', svg(`<circle cx="12" cy="12" r="9.500" fill="url(#check-lilac)"/><path d="M12 2.500a9.500 9.500 0 0 0 0 19z" fill="${h('lilac')}"/><circle cx="12" cy="12" r="8.500" fill="none" stroke="${h('lilac')}" stroke-width="2"/>`)],
    ['motion', 'it bounces', svg(dot(4.2, 18.5, 1.3, h('mint'), ' opacity=".35"') + dot(7.6, 13.8, 1.9, h('mint'), ' opacity=".55"') + dot(11.6, 10, 2.5, h('mint'), ' opacity=".78"') + dot(17, 7, 4.6, h('mint')) + dot(15.5, 5.5, 1.1, W))],
    ['alignment', 'everything against one edge', svg(box(2.5, 2.5, 3, 19, 1.5, ink('lilac')) + box(7.5, 4.5, 14, 4.2, 2.1, h('lilac')) + box(7.5, 9.9, 8, 4.2, 2.1, h('lilac')) + box(7.5, 15.3, 11, 4.2, 2.1, h('lilac')))],
    ['direction', 'which way things flow', svg(`<path d="M2.800 9.200h9.700V4.800L21.600 12l-9.100 7.200v-4.400H2.800z" fill="${h('lilac')}"/>`), 1],
    ['wrap', 'the fourth one goes below', svg(box(2.2, 4.2, 5.6, 5.6, 1.8, h('lilac')) + box(9.2, 4.2, 5.6, 5.6, 1.8, h('lilac')) + box(16.2, 4.2, 5.6, 5.6, 1.8, h('lilac')) + box(2.2, 14.2, 5.6, 5.6, 1.8, h('pink')) + line('M19 12v2.200a2.800 2.800 0 0 1-2.800 2.800H11.200', ink('lilac'), 2) + line('M13.200 14.800 11 17l2.200 2.200', ink('lilac'), 2)), 1],
    ['grid', 'rows and columns', svg(box(2.6, 2.6, 8.4, 8.4, 2.6, h('mint')) + box(13, 2.6, 8.4, 8.4, 2.6, h('mint')) + box(2.6, 13, 8.4, 8.4, 2.6, h('mint')) + box(13, 13, 8.4, 8.4, 2.6, h('butter'))), 1],
    ['scroll', 'more than fits', svg(tile('sky', box(6, 7.4, 7.6, 2.5, 1.25, W) + box(6, 11.9, 5.4, 2.5, 1.25, W) + box(16.2, 6.4, 2.6, 6.4, 1.3, W) + line('M16 15.400l1.500 1.600 1.500-1.600', W, 1.8))), 1],
    ['cursor', 'what the pointer becomes', svg(`<path d="M4.800 3.400 18.600 10.600l-5.900 1.900-1.900 5.900z" fill="${h('pink')}"/>${line('M17.400 3.200v2.400M21.400 6.600h-2.400M20.300 3.700l-1.700 1.700', h('butter'), 2)}`), 1],
  ].map(([name, note, icon, fresh]) => ({ name, note, icon, fresh }));

  const PARTS = [
    ['button', 'with something about to press it', svg(box(1.8, 5.5, 20.4, 11.5, 5.75, h('pink')) + box(6.5, 10.15, 9, 2.2, 1.1, W) + `<path d="M14.800 12.800 21.600 15.800l-2.900.900-.900 2.900z" fill="${ink('pink')}" stroke="${W}" stroke-width="1" stroke-linejoin="round"/>`)],
    ['link', 'two rings, joined', svg(`<rect x="2.400" y="8.200" width="11.300" height="7.600" rx="3.800" fill="none" stroke="${h('sky')}" stroke-width="3"/><rect x="10.300" y="8.200" width="11.300" height="7.600" rx="3.800" fill="none" stroke="${h('mint')}" stroke-width="3"/><path d="M10.300 12a3.800 3.800 0 0 1 1.700-3.170" fill="none" stroke="${h('sky')}" stroke-width="3"/>`)],
    ['field', 'a caret, waiting', svg(box(1.8, 5, 20.4, 14, 4.6, h('sky')) + box(5.8, 8.5, 2.3, 7, 1.15, W) + dot(11.6, 12, 1.25, W) + dot(15, 12, 1.25, W) + dot(18.4, 12, 1.25, W))],
    ['select', 'one of a few', svg(box(1.8, 5, 20.4, 14, 4.6, h('lilac')) + box(5.4, 10.8, 7, 2.4, 1.2, W) + line('M15.200 10.800l1.900 2 1.900-2', W, 2))],
    ['checkbox', '', svg(box(3, 3, 18, 18, 5.6, h('mint')) + line('M7.400 12.400l3.100 3.100 6.100-7', W, 2.6))],
    ['radio', 'the one that is chosen', svg(dot(12, 12, 9.6, h('lilac')) + dot(12, 12, 3.9, W)), 1],
    ['switch', 'on', svg(box(1.8, 5.8, 20.4, 12.4, 6.2, h('mint')) + dot(16, 12, 4.3, W))],
    ['slider', 'a knob on a track', svg(box(1.8, 10.1, 20.4, 3.8, 1.9, h('sky')) + dot(14.8, 12, 5.4, h('pink')) + dot(14.8, 12, 1.7, W)), 1],
    ['heading', '', svg(tile('pink', line('M8 7.200v9.600M16 7.200v9.600M8 12h8', W, 2.5)))],
    ['text', 'the last line runs short', svg(box(3, 4.2, 18, 3.8, 1.9, h('lilac')) + box(3, 10.1, 18, 3.8, 1.9, h('lilac')) + box(3, 16, 10.5, 3.8, 1.9, h('lilac')))],
    ['image', 'sun, hills', svg(box(2, 3.5, 20, 17, 4.8, h('sky')) + dot(8, 8.8, 2.5, h('butter')) + `<path d="M2.300 17.800 8.600 12.200l3.800 3.300 3.300-2.800 6 5.100a4.800 4.800 0 0 1-4.500 2.700H6.800a4.800 4.800 0 0 1-4.500-2.700z" fill="${h('mint')}"/>`)],
    ['icon', 'a spark', svg(`<path d="M12 1.800 14.500 9.500 22.200 12l-7.700 2.500L12 22.200l-2.500-7.700L1.800 12l7.700-2.500z" fill="${h('butter')}"/>${dot(19.2, 4.8, 1.6, h('pink'))}`)],
    ['avatar', 'says hello', svg(dot(12, 12, 9.8, h('pink')) + dot(8.7, 10.2, 1.3, ink('pink')) + dot(15.3, 10.2, 1.3, ink('pink')) + line('M8.200 14.200a4.400 4.400 0 0 0 7.600 0', ink('pink'), 1.8))],
    ['tag', 'with a hole for the string', svg(`<path d="M2.600 12 8 5.600h11.200A2.800 2.800 0 0 1 22 8.400v7.200a2.800 2.800 0 0 1-2.800 2.800H8z" fill="${h('lilac')}" stroke="${h('lilac')}" stroke-width="1.200" stroke-linejoin="round"/>${dot(8.9, 12, 1.8, W)}`)],
    ['badge', 'one new thing', svg(dot(12, 12, 9.6, h('pink')) + line('M9.600 9.400 12.700 7.100v10', W, 2.6)), 1],
    ['card', 'a picture, then two lines', svg(box(2.5, 2.5, 19, 19, 5, h('butter')) + box(5.6, 5.6, 12.8, 6, 2, W) + box(5.6, 13.8, 9, 2.2, 1.1, ink('butter')) + box(5.6, 17.1, 6, 2.2, 1.1, ink('butter')))],
    ['list', '', svg(dot(4.5, 5.8, 2.2, h('pink')) + dot(4.5, 12, 2.2, h('butter')) + dot(4.5, 18.2, 2.2, h('mint')) + box(9, 4.3, 12.5, 3, 1.5, 'var(--pl-ink)') + box(9, 10.5, 9.5, 3, 1.5, 'var(--pl-ink)') + box(9, 16.7, 11.5, 3, 1.5, 'var(--pl-ink)'))],
    ['row', 'one item, and where it leads', svg(box(1.8, 6.5, 20.4, 11, 3.8, h('sky')) + dot(6.8, 12, 2.5, W) + box(10.8, 10.8, 5.6, 2.4, 1.2, W) + line('M18.200 10.200l1.700 1.800-1.700 1.800', W, 1.9))],
    ['table', 'a header, then cells', svg(box(2, 3, 20, 18, 4.6, h('mint')) + [9.7, 15.3].flatMap((y) => [3.7, 9.9, 16.1].map((x) => box(x, y, 4.9, 4.2, 1.1, W))).join(''))],
    ['tabs', 'one is in front', svg(`<path d="M2 19.500V9a3.200 3.200 0 0 1 3.200-3.200h3.600A3.200 3.200 0 0 1 12 9v10.500z" fill="${h('pink')}"/>${box(13.2, 9.2, 4, 10.3, 1.6, soft('pink'))}${box(18.2, 9.2, 3.8, 10.3, 1.6, soft('pink'))}${box(1.5, 18.8, 21, 2.4, 1.2, ink('pink'))}`)],
    ['navigation', 'a rail of places', svg(box(2, 3, 20, 18, 4.8, h('lilac')) + box(4.4, 5.4, 5.2, 13.2, 1.9, W) + dot(7, 8.2, 1.2, h('lilac')) + dot(7, 12, 1.2, h('lilac')) + dot(7, 15.8, 1.2, h('lilac')) + box(12, 7, 7, 2.4, 1.2, W) + box(12, 11.2, 5, 2.4, 1.2, W))],
    ['dialog', 'three dots, of course', svg(box(2, 3.5, 20, 17, 4.8, h('sky')) + box(4.2, 5.6, 15.600, 4.2, 2.1, W) + dot(6.9, 7.7, 1.15, h('pink')) + dot(10.1, 7.7, 1.15, h('butter')) + dot(13.3, 7.7, 1.15, h('mint')) + box(4.6, 12.200, 8, 2.3, 1.15, W) + box(13.2, 14.6, 6.4, 3.8, 1.9, h('pink')))],
    ['menu', 'one row under the pointer', svg(box(3, 2.5, 18, 19, 4.8, h('lilac')) + box(6, 5.6, 11, 2.5, 1.25, W) + box(4.8, 9.900, 14.4, 4.4, 2.2, W) + box(6.8, 11, 6.5, 2.2, 1.1, h('lilac')) + box(6, 16, 8, 2.5, 1.25, W)), 1],
    ['tooltip', 'it has something to say', svg(`<path d="M5.500 2.800h13A3.800 3.800 0 0 1 22.300 6.600v6.800a3.800 3.800 0 0 1-3.800 3.800h-3.300L12 21.200l-3.200-4H5.500a3.800 3.800 0 0 1-3.800-3.800V6.600A3.800 3.800 0 0 1 5.500 2.800z" fill="${h('butter')}"/>${dot(7.8, 10, 1.5, W)}${dot(12, 10, 1.5, W)}${dot(16.2, 10, 1.5, W)}`)],
    ['toast', 'it is toast', svg(`<path d="M5.200 10.200C2.600 9.200 2.400 5.200 6.200 4c2.600-.800 9-.800 11.600 0 3.800 1.200 3.600 5.200 1 6.200V18a3 3 0 0 1-3 3H8.200a3 3 0 0 1-3-3z" fill="${h('butter')}" stroke="${ink('butter')}" stroke-width="1.500" stroke-linejoin="round"/>${dot(9.4, 12.6, 1.05, ink('butter'))}${dot(14.6, 12.6, 1.05, ink('butter'))}${line('M9.800 15.600a2.800 2.800 0 0 0 4.400 0', ink('butter'), 1.5)}`)],
    ['search', 'a lens with a glint', svg(`<circle cx="10.400" cy="10.400" r="6.400" fill="${soft('sky')}" stroke="${h('lilac')}" stroke-width="3.200"/>${line('M15.600 15.600l4.800 4.800', ink('lilac'), 3.6)}${line('M7.600 9.400a3 3 0 0 1 2-2', W, 1.7)}`), 1],
    ['progress', 'most of the way', svg(box(1.8, 8.5, 20.4, 7, 3.5, soft('mint')) + box(1.8, 8.5, 14, 7, 3.5, h('mint')) + dot(12.3, 12, 1.4, W)), 1],
    ['loading', 'going round', svg(turning), 1],
    ['empty', 'nobody home', svg(`<path d="M12 2.600a7.400 7.400 0 0 1 7.400 7.400v11l-2.470-1.900-2.470 1.900L12 19.100 9.540 21l-2.470-1.900L4.600 21V10A7.400 7.400 0 0 1 12 2.600z" fill="${h('lilac')}" stroke="${h('lilac')}" stroke-width=".8" stroke-linejoin="round"/>${dot(9.3, 10.4, 1.4, ink('lilac'))}${dot(14.7, 10.4, 1.4, ink('lilac'))}${dot(12, 14.4, 1.150, ink('lilac'))}`), 1],
    ['error', 'something went wrong', svg(`<path d="M12 2.800c.900 0 1.700.500 2.200 1.300l7.300 12.600a2.500 2.500 0 0 1-2.200 3.800H4.700a2.500 2.500 0 0 1-2.200-3.800L9.800 4.100c.500-.800 1.300-1.300 2.200-1.300z" fill="${h('coral')}"/>${box(10.8, 8, 2.4, 6.4, 1.2, W)}${dot(12, 17.1, 1.4, W)}`), 1],
  ].map(([name, note, icon, fresh]) => ({ name, note, icon, fresh }));

  const toy = (i) => `<figure class="toy" tabindex="0"${i.fresh ? ' data-new' : ''}><span class="row"><i class="big">${i.icon}</i><i class="mid">${i.icon}</i><i class="sm">${i.icon}</i></span><figcaption>${i.name}${i.note ? `<small>${i.note}</small>` : ''}</figcaption></figure>`;
  const OLD = [['p', 'padding'], ['m', 'margin'], ['g', 'gap'], ['b', 'border'], ['r', 'corner'], ['line', 'type'], ['c', 'size']];
  const byName = (list, name) => list.find((i) => i.name === name);

  root.innerHTML = `<style>${tokens}${LANGUAGE_CSS}
    :host { display: block; font-family: var(--pl-sans); color: var(--pl-ink); }
    :host([data-scheme="dark"]) { --pl-paper: #2a2930; --pl-paper-2: #35343c; --pl-rule: #45444d; --pl-ink: #f4f3ef; }
    .band { margin: 28px 0 12px; font: 600 12px/1 var(--pl-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--pl-ink-2); }
    .band:first-of-type { margin-top: 0; }
    .set { margin: 0 0 14px; padding: 16px 16px 18px; border-radius: 18px; background: var(--pl-paper); box-shadow: 0 0 0 1px var(--pl-rule); }
    .set h2 { margin: 0; font: 600 15px/20px var(--pl-sans); }
    .set h2 span { margin-left: 8px; font: 500 12px/1 var(--pl-mono); color: var(--pl-ink-3); }
    .set p { margin: 3px 0 0; font: 400 13px/19px var(--pl-sans); color: var(--pl-ink-2); max-width: 760px; }
    ol.rules { margin: 10px 0 0; padding: 0 0 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 4px 28px; font: 400 13px/19px var(--pl-sans); color: var(--pl-ink-2); }
    ol.rules b { color: var(--pl-ink); font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
    .toy { position: relative; margin: 0; padding: 14px 12px 11px; border-radius: 14px; background: var(--pl-paper-2); display: flex; flex-direction: column; gap: 10px; outline: none; cursor: default;
      transition: background-color 200ms var(--pl-ease-out), translate 300ms var(--pl-spring-pop); }
    .toy[data-new]::after { content: 'new'; position: absolute; top: 9px; right: 9px; padding: 2px 6px; border-radius: 6px; font: 600 10px/1.2 var(--pl-sans); background: var(--pl-sky-soft); color: var(--pl-sky-ink); }
    .toy .row { display: flex; align-items: flex-end; gap: 12px; height: 46px; }
    .toy i { display: block; flex: none; transform-origin: 50% 80%; transition: rotate 420ms var(--pl-spring-pop), scale 420ms var(--pl-spring-pop); }
    .toy svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .toy .big { width: 44px; height: 44px; }
    .toy .mid { width: 24px; height: 24px; }
    .toy .sm { width: 16px; height: 16px; }
    /* pointed at, the toy is picked up: it tips and grows, the small ones lean the other way */
    .toy:hover, .toy:focus-visible { translate: 0 -2px; background: color-mix(in oklab, var(--pl-butter-soft) 55%, var(--pl-paper-2)); }
    .toy:hover .big, .toy:focus-visible .big { rotate: -9deg; scale: 1.14; }
    .toy:hover .mid, .toy:focus-visible .mid { rotate: 7deg; scale: 1.08; }
    .toy:hover .sm, .toy:focus-visible .sm { rotate: -5deg; }
    .toy figcaption { font: 600 13px/16px var(--pl-sans); color: var(--pl-ink); }
    .toy figcaption small { display: block; font: 400 11px/14px var(--pl-sans); color: var(--pl-ink-3); }
    .was { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-top: 12px; align-items: center; }
    .was span { display: inline-flex; align-items: center; gap: 7px; font: 500 12px/1 var(--pl-sans); color: var(--pl-ink-2); }
    .was i { display: block; width: 16px; height: 16px; color: var(--pl-ink-2); }
    .was svg { display: block; width: 100%; height: 100%; }
    .bars { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .fb { display: inline-flex; align-items: center; gap: 9px; height: 46px; padding: 0 14px 0 9px; border-radius: 23px; white-space: nowrap; }
    .fb i { display: block; width: 28px; height: 28px; }
    .fb svg { display: block; width: 100%; height: 100%; }
    .fb code { font: 600 13px/1 var(--pl-mono); color: var(--pl-ink); }
    .fb .in { font: 500 12px/1 var(--pl-sans); color: var(--pl-ink-2); }
    @media (prefers-reduced-motion: reduce) { .toy, .toy i { transition: none; } }
  </style>${defs}
  <div class="band">The toy set · proposed</div>
  <section class="set"><h2>What makes one of these</h2><p>Taken from the three that came out right: the avatar, the toast and the tooltip.</p>
    <ol class="rules">
      <li><b>One body, one hue.</b> A solid shape you could cut out of card. A second hue only when it is a second thing (the sun in the image, the knob on the slider).</li>
      <li><b>Details are cut out or drawn on.</b> White for a hole in the body, the hue’s own dark for a mark on it. Never a pale fill with an outline.</li>
      <li><b>It says what the thing does.</b> A switch is on. A tag has a hole for its string. A field has a caret waiting.</li>
      <li><b>It still reads at 16.</b> Nothing finer than 1.5 on the 24 grid, four parts at most.</li>
      <li><b>A pattern only ever means space.</b> Hatched is padding, dotted is margin, striped is a gap. Nothing else gets a pattern.</li>
      <li><b>A face only on things that speak to you.</b> The avatar, the toast, the empty state. Not on a border.</li>
      <li><b>Pale is for what is not there.</b> The unfilled part of a progress bar, the tabs behind, a cast shadow.</li>
    </ol></section>
  <section class="set"><h2>Properties<span>${PROPS.length}</span></h2><p>What a fix can change. Size and shape in mint, sky and butter; type on a sky tile; the three kinds of space in their patterns.</p><div class="grid">${PROPS.map(toy).join('')}</div></section>
  <section class="set"><h2>Elements and patterns<span>${PARTS.length}</span></h2><p>What a page is made of, for saying what the thing in hand is with a picture.</p><div class="grid">${PARTS.map(toy).join('')}</div></section>
  <section class="set"><h2>In the fix bar</h2><p>How a cause would open: the property’s toy, the class, and the kind of thing it is on.</p><div class="bars">${[
    ['corner', 'rounded-[5px]', 'tag'], ['padding', 'px-[7px]', 'button'], ['gap', 'gap-[13px]', 'row'], ['margin', 'mt-[10px]', 'card'], ['type', 'text-[13px]', 'menu'], ['shadow', 'shadow-[0_1px_2px]', 'dialog'], ['line height', 'leading-[18px]', 'text'], ['position', 'bottom-[64px]', 'toast'],
  ].map(([p, cls, on]) => `<span class="fb pl-card"><i>${byName(PROPS, p).icon}</i><code>${cls}</code><span class="in">on a</span><i>${byName(PARTS, on).icon}</i></span>`).join('')}</div></section>
  <div class="band">What the overlay has today</div>
  <section class="set"><h2>The grey line set</h2><p>The box icons the overlay uses now, for comparison. The toy set would take their place.</p><div class="was">${OLD.map(([k, name]) => `<span><i>${BLOCK_ICONS[k]}</i>${name}</span>`).join('')}</div></section>`;

  document.getElementById('scheme').onclick = (e) => { const dark = document.body.classList.toggle('dark'); host.dataset.scheme = dark ? 'dark' : 'light'; e.target.textContent = dark ? 'Light' : 'Dark'; };
</script>
</body>
</html>
