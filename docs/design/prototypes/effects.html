<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow and motion editors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* The element card's Shadow ▸ and Motion ▸ fields drill into their editors (docs/briefs/recipes.md): recipes at
     the top, a few physical dials below, the element previewing live. Every recipe, dial and value is the first
     pack's (docs/research/packs/first.json), run through its own formulas; theme names are plain (--shadow-raised). */
  :root {
    --ink: #1c1b19; --ink-2: #55544f; --ink-3: #8b8a85; --line: rgb(0 0 0 / .08); --wash: rgb(0 0 0 / .04);
    --paper: #fff; --sky: #2f6bff; --sky-soft: rgb(47 107 255 / .12); --coral: #e2533a; --page: #f6f5f2;
    --expo: cubic-bezier(.19, 1, .22, 1);
    --mono: 'Geist Mono', ui-monospace, monospace; --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 var(--sans); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  kbd { font: 500 10px/1 var(--mono); padding: 2px 4px; border-radius: 4px; background: var(--paper); box-shadow: 0 0 0 .5px var(--line); color: var(--ink-2); }

  .stage { position: relative; max-width: 1180px; margin: 0 auto; padding: 72px 40px 160px; }
  .stage h1 { font: 500 13px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 18px; }
  /* the element being edited: a notification card */
  #target { position: relative; width: 380px; display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 14px; background: #fff; outline: none; }
  #target .dot { flex: none; width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #ffb38a, #e2533a); }
  #target .t { font-weight: 600; } #target .s { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  #target .more { color: var(--ink-3); font-size: 12.5px; }
  .ring { position: absolute; pointer-events: none; border-radius: 18px; box-shadow: 0 0 0 1.5px var(--sky); transition: box-shadow 120ms ease-out; }
  .ring[data-peek] { box-shadow: 0 0 0 1.5px var(--sky), 0 0 0 5px var(--sky-soft); }
  .try { margin-top: 14px; font-size: 12px; color: var(--ink-3); }

  /* the card beside it */
  .card { position: absolute; z-index: 5; width: 288px; overflow: hidden; background: rgb(255 255 255 / .9); backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6);
    border-radius: 16px; box-shadow: 0 0 0 .5px rgb(0 0 0 / .1), 0 1px 1px rgb(0 0 0 / .04), 0 10px 24px -10px rgb(0 0 0 / .18), 0 32px 64px -28px rgb(0 0 0 / .22), inset 0 1px 0 rgb(255 255 255 / .9);
    transition: height 280ms var(--expo); }
  .card::before { content: ''; position: absolute; }
  .hd { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  .hd .n { font: 600 13px/1.2 var(--mono); } .hd .n span { color: var(--ink-3); font-weight: 500; }
  .hd .at { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--ink-3); }
  .hd .back { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px 0 4px; margin-left: -6px; border-radius: 7px; color: var(--ink-2); font-weight: 550; font-size: 12.5px; }
  .hd .back:hover { background: var(--wash); }
  .hd .crumb { font-weight: 600; font-size: 13px; }
  .lab { display: flex; justify-content: space-between; align-items: baseline; padding: 0 14px; margin: 6px 0 6px; font: 600 10.5px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .lab .v { font: 500 11px/1 var(--mono); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 12px 8px; }
  .fld { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; height: 32px; padding: 0 9px 0 5px; border-radius: 9px; background: var(--wash); outline: none; user-select: none; text-align: left;
    transition: background 120ms ease-out, box-shadow 120ms ease-out, scale 140ms cubic-bezier(.25, .46, .45, .94); }
  @media (hover: hover) and (pointer: fine) { .fld:hover { background: rgb(0 0 0 / .065); } }
  .fld:active { scale: .985; }
  .fld:focus-visible, .fld[data-editing] { background: #fff; box-shadow: 0 0 0 1.5px var(--sky), 0 1px 2px rgb(0 0 0 / .06); }
  .fld.wide { grid-column: 1 / -1; }
  .fld .ic { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; color: var(--ink-3); flex: none; }
  .fld .ic svg { width: 14px; height: 14px; }
  .fld .val { font: 500 13px/1 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fld .name { font: 550 13px/1 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fld .sub { color: var(--ink-3); font: 500 11.5px/1 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fld .chev { margin-left: auto; color: var(--ink-3); font-size: 12px; }
  .fld .u { font: 500 11px/1 var(--mono); color: var(--ink-3); }
  .fld .mini { width: 18px; height: 14px; border-radius: 4px; background: #fff; flex: none; margin-left: 2px; }
  /* a dial: drag the whole field sideways (the value follows the hand), or ← → when it has focus; its place in the
     range is a hairline along the bottom */
  .fld.dial { cursor: ew-resize; }
  .fld.dial .bar { position: absolute; left: 8px; right: 8px; bottom: 3px; height: 2px; border-radius: 1px; background: rgb(0 0 0 / .06); overflow: hidden; }
  .fld.dial .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--sky); border-radius: 1px; transition: width 80ms linear; }
  .fld.dial[data-moved] .val { color: var(--sky); }
  body[data-dragging], body[data-dragging] * { cursor: ew-resize !important; user-select: none; }
  .sun { width: 14px; height: 14px; transition: rotate 80ms linear; }

  /* recipes: shadows as tiles lifted by their own shadow; motion as rows that play */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 2px 10px 10px; }
  .tile .well { transition: background 120ms ease-out; }
  .tile { display: grid; justify-items: center; gap: 7px; padding: 10px 0 7px; border-radius: 10px; transition: background 120ms ease-out, box-shadow 120ms ease-out, scale 140ms ease-out; }
  @media (hover: hover) and (pointer: fine) { .tile:hover { background: var(--wash); } }
  .tile:active { scale: .97; }
  .tile:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--sky); }
  /* a shadow is seen on a ground: each tile is a white chip on stone, lifted by the recipe's own shadow */
  .tile .well { display: grid; place-items: center; width: 52px; height: 40px; border-radius: 9px; background: #eceae5; }
  .tile .sq { width: 26px; height: 18px; border-radius: 5px; background: #fff; }
  .tile b { font: 550 11px/1 var(--sans); color: var(--ink-2); }
  .tile[aria-checked="true"] { background: var(--sky-soft); } .tile[aria-checked="true"] b { color: var(--sky); }
  .tile[data-peek]:not([aria-checked="true"]) { box-shadow: inset 0 0 0 1.5px var(--sky); }
  .seg { display: flex; margin: 0 12px 8px; padding: 2px; border-radius: 9px; background: var(--wash); }
  .seg button { flex: 1; height: 26px; border-radius: 7px; font: 600 12px/1 var(--sans); color: var(--ink-2); transition: background 120ms, box-shadow 120ms, color 120ms; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .1), 0 0 0 .5px rgb(0 0 0 / .06); }
  .rows { display: grid; gap: 2px; padding: 0 8px 8px; }
  .row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; text-align: left; transition: background 120ms ease-out, box-shadow 120ms ease-out; }
  @media (hover: hover) and (pointer: fine) { .row:hover { background: var(--wash); } }
  .row:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--sky); }
  .row[aria-checked="true"] { background: var(--sky-soft); }
  .row .demo { width: 34px; height: 26px; border-radius: 7px; background: var(--wash); display: grid; place-items: center; overflow: hidden; }
  .row .demo i { width: 16px; height: 12px; border-radius: 4px; background: #fff; box-shadow: var(--shadow-raised); }
  .row .nm { font-weight: 550; font-size: 13px; } .row .sm { color: var(--ink-3); font-size: 11.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .row[aria-checked="true"] .sm { -webkit-line-clamp: 3; }
  .row > span:nth-child(2) { min-width: 0; }
  .seg button { white-space: nowrap; }
  .row .tag { font: 600 10px/1 var(--mono); padding: 3px 6px; border-radius: 6px; background: #fff3e8; color: #a8551b; white-space: nowrap; }
  .row[aria-checked="true"] .nm { color: var(--sky); }
  .curve { display: flex; align-items: center; gap: 10px; margin: 0 12px 8px; padding: 8px 10px; border-radius: 10px; background: var(--wash); }
  .curve svg { width: 54px; height: 40px; flex: none; overflow: visible; }
  .curve .cv { fill: none; stroke: var(--sky); stroke-width: 2; stroke-linecap: round; }
  .curve .ax { fill: none; stroke: rgb(0 0 0 / .12); stroke-width: 1; }
  .curve .t { font: 500 11.5px/1.35 var(--mono); color: var(--ink-2); }
  .curve .replay { margin-left: auto; height: 26px; padding: 0 9px; border-radius: 8px; color: var(--ink-2); font-weight: 550; font-size: 12px; display: inline-flex; gap: 5px; align-items: center; }
  .curve .replay:hover { background: rgb(0 0 0 / .05); }
  .note { margin: 0 14px 8px; font-size: 11.5px; color: var(--ink-3); }
  .note.warn { color: #a8551b; }
  .src { margin: 0 14px 10px; font-size: 11px; color: var(--ink-3); } .src a { color: inherit; }
  .acts { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-top: .5px solid var(--line); }
  .acts .primary { height: 30px; padding: 0 12px; border-radius: 10px; background: var(--ink); color: #fff; font-weight: 550; display: inline-flex; gap: 6px; align-items: center; transition: transform 140ms ease-out, opacity 140ms; }
  .acts .primary:active { transform: scale(.97); } .acts .primary[disabled] { opacity: .3; cursor: default; }
  .acts .primary kbd { background: rgb(255 255 255 / .14); color: rgb(255 255 255 / .7); box-shadow: none; }
  .acts .grow { flex: 1; } .acts .hint { color: var(--ink-3); font-size: 11.5px; }
  .pane { animation: none; }
  .pane[data-in="fwd"] { animation: pane-fwd 240ms var(--expo) both; }
  .pane[data-in="back"] { animation: pane-back 240ms var(--expo) both; }
  @keyframes pane-fwd { from { opacity: 0; transform: translateX(14px); } }
  @keyframes pane-back { from { opacity: 0; transform: translateX(-14px); } }
  .mini-sample { margin: 0 12px 8px; padding: 8px 10px; border-radius: 10px; background: var(--wash); font-size: 12px; color: var(--ink-2); }
  .mini-sample button { color: var(--sky); font-weight: 550; }
  .mini-sample .grow-box > div { padding-top: 6px; }
  .toast { position: fixed; left: 50%; bottom: 28px; translate: -50% 0; display: flex; gap: 12px; align-items: center; padding: 8px 8px 8px 14px; border-radius: 12px; background: var(--ink); color: #fff; font-weight: 550; box-shadow: 0 10px 30px -10px rgb(0 0 0 / .4); }
  .toast[hidden] { display: none; }
  .toast button { height: 28px; padding: 0 10px; border-radius: 8px; background: rgb(255 255 255 / .12); }
  @media (prefers-reduced-motion: reduce) { .pane[data-in] { animation: none; } .card { transition: none; } }
</style>
<style id="pack-tokens"></style>
<style id="pack-css"></style>
</head>
<body>
<div class="stage">
  <h1>Shadow and motion · first pack</h1>
  <div id="target" tabindex="0"><span class="dot"></span><div><div class="t">Kiln firing finished</div><div class="s">Ceramics studio · 2 min ago</div><div class="more">Your glaze test batch is ready to unload.</div></div></div>
  <div class="try">Hover, press or focus the card to try its motion · the card's editor is beside it</div>
  <div class="ring" id="ring"></div>
  <div class="card" id="card" role="dialog" aria-label="Edit Notice"></div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button id="undo">Undo</button></div>

const refs = (s) => s.replace(/\{var:([\w-]+)\}/g, 'var(--$1)').replace(/\{prop:([\w-]+)\}/g, '--$1').replace(/\{class:([\w-]+)\}/g, '$1');
function build(r, dials) {
  const scope = { ...dials };
  for (const [k, e] of Object.entries(r.variables ?? {})) scope[k] = evalF(e, scope);
  const fill = (s) => String(s).replace(/\{\{\s*([\s\S]+?)\s*\}\}/g, (_, e) => num(evalF(e, scope)));
  const tokens = r.tokens.map((t) => [t.name, fill(typeof t.value === 'string' ? t.value : t.value.light)]);
  const css = r.apply.filter((a) => a.requires === 'none').map((a) => (a.type === 'class' ? `.${a.name} { ${refs(fill(a.declarations))} }` : refs(fill(a.css ?? '')))).join('\n');
  const cls = r.apply.find((a) => a.type === 'class')?.name ?? /\.\{class:([\w-]+)\}/.exec(r.apply.find((a) => a.type === 'css')?.css ?? '')?.[1] ?? null;
  return { tokens, css, cls };
}
// every recipe installed at its dials (motion recipes use shadow tokens: Lift goes from Raised to Floating)
const DIALS = Object.fromEntries(PACK.recipes.map((r) => [r.id, dialsOf(r)]));
function install() {
  const built = PACK.recipes.map((r) => [r.id, build(r, DIALS[r.id])]);
  document.getElementById('pack-tokens').textContent = `:root { ${built.flatMap(([, b]) => b.tokens.map(([k, v]) => `--${k}: ${v};`)).join(' ')} }`;
  // the shadow picked rules the element at rest: motion recipes that set a resting shadow (Lift: Raised) come first,
  // so a picked shadow wins at rest and the state's own shadow only takes over on hover
  const kindOf = (id) => R[id].kind === 'shadow' ? 1 : 0;
  document.getElementById('pack-css').textContent = [...built].sort((a, b) => kindOf(a[0]) - kindOf(b[0])).map(([, b]) => b.css).join('\n');
  return Object.fromEntries(built);
}
let BUILT = install();

// ── the element's state: one shadow, one state motion, one entrance, one layout motion ──
const KINDS = { state: 'motion.state', enter: 'motion.enter-exit', layout: 'motion.layout' };
const S = { shadow: 'raised', state: 'lift', enter: 'pop', layout: null };
let saved = null;
const target = document.getElementById('target'), card = document.getElementById('card'), ring = document.getElementById('ring');
function dress(over = {}) {
  const s = { ...S, ...over };
  target.className = [s.shadow, s.state, s.enter].map((id) => id && BUILT[id]?.cls).filter(Boolean).join(' ');
}
function replay() { const cls = BUILT[S.enter]?.cls; if (!cls) return; target.classList.remove(cls); void target.offsetWidth; target.classList.add(cls); }

// ── the card: a main view with Shadow ▸ and Motion ▸, and their editors ──
let view = 'main', mtab = 'state', peekId = null, dialFocus = null;
const ICON = {
  shadow: '<svg viewBox="0 0 14 14"><rect x="2" y="2" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 12h6.5a1 1 0 0 0 1-1V4.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".55"/></svg>',
  motion: '<svg viewBox="0 0 14 14"><path d="M2 11c3 0 4-8 10-8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="3" r="1.4" fill="currentColor"/></svg>',
  pad: '<svg viewBox="0 0 14 14"><rect x="1.5" y="1.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="4.5" y="4.5" width="5" height="5" rx="1" fill="currentColor" opacity=".35"/></svg>',
  radius: '<svg viewBox="0 0 14 14"><path d="M2.5 12V7a4.5 4.5 0 0 1 4.5-4.5h5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
};
// the shadow a recipe applies: the box-shadow in its own rule (its first token is not always the shadow)
const shadowOf = (id) => /box-shadow:\s*([^;]+);/.exec(BUILT[id]?.css ?? '')?.[1] ?? 'none';
const credit = (r) => `From <a href="${r.source.url}" target="_blank" rel="noreferrer">${r.source.library}</a> · ${r.source.licence}${r.source.verified === false ? ' · values not verified' : ''}`;
const fmtDial = (d, v) => `${num(v)}${d.unit === 'deg' ? '°' : d.unit === '×' ? '×' : d.unit ? d.unit : ''}`;
const head = (title) => view === 'main'
  ? `<div class="hd"><span class="n">Notice <span>· div</span></span><span class="at">Notice.tsx:18</span></div>`
  : `<div class="hd"><button class="back" data-go="main" aria-label="Back to the card">‹ Card</button><span class="crumb">${title}</span><span class="at">Notice.tsx:18</span></div>`;
function dialField(r, d) {
  const v = DIALS[r.id][d.id], pct = ((v - d.min) / (d.max - d.min)) * 100, moved = v !== d.default;
  const ic = d.id === 'light' ? `<svg class="sun" viewBox="0 0 14 14" style="rotate:${v}deg"><circle cx="7" cy="3" r="2" fill="currentColor"/><path d="M7 6.5v5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>` : d.id.match(/speed/) ? ICON.motion : ICON.shadow;
  return `<div class="fld dial" role="slider" tabindex="0" data-dial="${d.id}" aria-label="${d.label}" aria-valuemin="${d.min}" aria-valuemax="${d.max}" aria-valuenow="${v}" title="Drag to change ${d.label.toLowerCase()}"${moved ? ' data-moved' : ''}><span class="ic">${ic}</span><span class="sub" style="color:var(--ink-2)">${d.label}</span><span class="val" style="margin-left:auto">${fmtDial(d, v)}</span><span class="bar"><i style="width:${pct}%"></i></span></div>`;
}
function curveOf(r) {
  // the entrance's or state's easing, drawn; its duration said beside it
  const b = BUILT[r.id], ease = b.tokens.find(([k, v]) => /cubic-bezier/.test(v)), time = b.tokens.find(([k, v]) => /ms$/.test(v));
  const m = ease && /cubic-bezier\(([^)]+)\)/.exec(ease[1]);
  const [x1, y1, x2, y2] = m ? m[1].split(',').map(Number) : [0.25, 0.1, 0.25, 1];
  const W = 54, H = 40, P = (x, y) => `${x * W},${H - y * H}`;
  return `<div class="curve"><svg viewBox="0 0 ${W} ${H}"><path class="ax" d="M0 ${H}H${W}M0 ${H}V0"/><path class="cv" d="M${P(0, 0)} C${P(x1, y1)} ${P(x2, y2)} ${P(1, 1)}"/></svg><span class="t">${time ? time[1] : ''}<br>${ease ? `${num(x1)}, ${num(y1)}, ${num(x2)}, ${num(y2)}` : ''}</span><button class="replay" data-replay aria-label="Play it again">⟲ Play <kbd>R</kbd></button></div>`;
}

function draw(dir) {
  let html;
  if (view === 'main') {
    const sh = R[S.shadow];
    html = head()
      + `<div class="lab">Surface</div><div class="fields"><div class="fld"><span class="ic">${ICON.pad}</span><span class="val">16</span><span class="u">px</span></div><div class="fld"><span class="ic">${ICON.radius}</span><span class="val">14</span><span class="u">px</span></div>`
      + `<button class="fld wide" data-go="shadow" aria-label="Shadow: ${sh.name}"><span class="ic">${ICON.shadow}</span><span class="name">Shadow</span><span class="mini" style="box-shadow:${shadowOf(S.shadow)}"></span><span class="sub">${sh.name}</span><span class="chev">›</span></button></div>`
      + `<div class="lab">Motion</div><div class="fields">`
      + [['state', 'Hover and press'], ['enter', 'Entrance'], ['layout', 'Layout']].map(([k, label]) => `<button class="fld wide" data-go="motion" data-tab="${k}" aria-label="${label}: ${S[k] ? R[S[k]].name : 'None'}"><span class="ic">${ICON.motion}</span><span class="name">${label}</span><span class="sub" style="margin-left:auto">${S[k] ? R[S[k]].name : 'None'}</span><span class="chev" style="margin-left:6px">›</span></button>`).join('')
      + `</div>`;
  } else if (view === 'shadow') {
    const r = R[peekId && R[peekId]?.kind === 'shadow' ? peekId : S.shadow];
    html = head('Shadow')
      + `<div class="lab">Recipes</div><div class="tiles" role="radiogroup" aria-label="Shadow">${PACK.recipes.filter((x) => x.kind === 'shadow').map((x) => `<button class="tile" role="radio" data-pick="${x.id}" aria-checked="${x.id === S.shadow}"${peekId === x.id ? ' data-peek' : ''} title="${x.summary.replace(/"/g, '&quot;')}"><span class="well"><span class="sq" style="box-shadow:${shadowOf(x.id)}"></span></span><b>${x.name}</b></button>`).join('')}</div>`
      + `<div class="lab">${R[S.shadow].name}<span class="v">dials</span></div><div class="fields">${R[S.shadow].dials.map((d) => dialField(R[S.shadow], d).replace('class="fld dial"', 'class="fld dial wide"')).join('')}</div>`
      + `<div class="src">${credit(R[S.shadow])}</div>`
      + `<div class="acts"><button class="primary" data-use="shadow">Use ${R[S.shadow].name} <kbd>↵</kbd></button><span class="grow"></span><span class="hint"><kbd>esc</kbd> back</span></div>`;
    void r;
  } else {
    const kind = KINDS[mtab], list = PACK.recipes.filter((x) => x.kind === kind), cur = S[mtab] ? R[S[mtab]] : null;
    const needs = (x) => x.requires === 'motion' || x.apply.every((a) => a.requires === 'motion');
    html = head('Motion')
      + `<div class="seg" role="tablist">${[['state', 'Hover & press'], ['enter', 'Entrance'], ['layout', 'Layout']].map(([k, l]) => `<button role="tab" data-tab="${k}" aria-pressed="${k === mtab}">${l}</button>`).join('')}</div>`
      + `<div class="rows" role="radiogroup" aria-label="Motion">${(mtab === 'layout' ? [{ id: '', name: 'None', summary: 'Layout changes snap.' }] : []).concat(list).map((x) => `<button class="row" role="radio" data-pick="${x.id}" aria-checked="${(S[mtab] ?? '') === x.id}"><span class="demo"><i data-demo="${x.id}"></i></span><span><div class="nm">${x.name}</div><div class="sm">${(x.summary ?? '').replace(/\.$/, '')}</div></span>${x.id && needs(x) ? '<span class="tag">Needs motion/react</span>' : ''}</button>`).join('')}</div>`;
    if (cur) {
      html += curveOf(cur)
        + `<div class="fields">${cur.dials.map((d) => dialField(cur, d).replace('class="fld dial"', 'class="fld dial wide"')).join('')}</div>`
        + (mtab === 'enter' ? `<div class="note warn">Exit needs a data-state (Radix, Base UI) or motion/react. Only the entrance is written here.</div>` : '')
        + (mtab === 'layout' && cur.id === 'smooth-height' ? `<div class="mini-sample"><button data-toggle-height>Show more ▾</button><div class="grow-box ${BUILT['smooth-height'].cls}" data-open="false"><div><div>The glaze test batch: six tiles, two at cone 6, four at cone 10. Unload after the kiln reads below 50°C.</div></div></div></div>` : '')
        + `<div class="src">${credit(cur)}</div>`
        + `<div class="acts"><button class="primary" data-use="motion"${needs(cur) ? ' disabled title="Needs motion/react: npm install motion"' : ''}>Use ${cur.name} <kbd>↵</kbd></button><span class="grow"></span><span class="hint">${needs(cur) ? 'npm install motion' : '<kbd>esc</kbd> back'}</span></div>`;
    } else html += `<div class="acts"><button class="primary" data-use="motion">Use none <kbd>↵</kbd></button><span class="grow"></span><span class="hint"><kbd>esc</kbd> back</span></div>`;
  }
  const from = card.offsetHeight;
  card.innerHTML = `<div class="pane"${dir ? ` data-in="${dir}"` : ''}>${html}</div>`;
  // the card's height glides between views (it never jumps)
  if (from) { const to = card.scrollHeight; card.style.height = `${from}px`; void card.offsetHeight; card.style.height = `${to}px`; clearTimeout(draw.t); draw.t = setTimeout(() => (card.style.height = ''), 300); }
  wire();
  place();
  // demos: each motion row plays its own recipe in its little window
  for (const i of card.querySelectorAll('[data-demo]')) { const b = BUILT[i.dataset.demo]; if (b?.cls) i.classList.add(b.cls); }
}
function place() {
  const stage = document.querySelector('.stage').getBoundingClientRect(), t = target.getBoundingClientRect();
  Object.assign(ring.style, { left: `${t.left - stage.left - 6}px`, top: `${t.top - stage.top - 6}px`, width: `${t.width + 12}px`, height: `${t.height + 12}px` });
  card.style.left = `${t.right - stage.left + 22}px`; card.style.top = `${Math.max(12, t.top - stage.top - 30)}px`;
}

// ── interactions ──
function go(to, tab) { const dir = to === 'main' ? 'back' : 'fwd'; view = to; if (tab) mtab = tab; peekId = null; dress(); draw(dir); card.querySelector('[aria-checked="true"], .tile, .row')?.focus({ preventScroll: true }); }
function preview(kind, id) {
  peekId = id; ring.dataset.peek = '';
  if (kind === 'shadow') dress({ shadow: id });
  else { dress({ [mtab]: id || null }); if (mtab === 'enter') { const c = id && BUILT[id]?.cls; if (c) { target.classList.remove(c); void target.offsetWidth; target.classList.add(c); } } }
  for (const el of card.querySelectorAll('[data-peek]')) el.removeAttribute('data-peek');
  card.querySelector(`[data-pick="${id}"]`)?.setAttribute('data-peek', '');
}
function unpreview() { peekId = null; delete ring.dataset.peek; dress(); for (const el of card.querySelectorAll('[data-peek]')) el.removeAttribute('data-peek'); }
function said(text) {
  const toast = document.getElementById('toast'); document.getElementById('toastText').textContent = text; toast.hidden = false;
  clearTimeout(said.t); said.t = setTimeout(() => (toast.hidden = true), 4500);
}
function use(kind) {
  saved = { S: { ...S }, DIALS: structuredClone(DIALS) };
  const r = kind === 'shadow' ? R[S.shadow] : S[mtab] ? R[S[mtab]] : null;
  const tuned = r ? r.dials.filter((d) => DIALS[r.id][d.id] !== d.default).map((d) => `${d.label.toLowerCase()} ${fmtDial(d, DIALS[r.id][d.id])}`) : [];
  said(r ? `Notice uses ${r.name}${tuned.length ? ` (${tuned.join(', ')})` : ''}. Added --${r.tokens[0].name} to your theme` : 'Notice has no layout motion now');
  go('main');
}
document.getElementById('undo').onclick = () => { if (saved) { Object.assign(S, saved.S); Object.assign(DIALS, saved.DIALS); BUILT = install(); saved = null; dress(); draw(); } document.getElementById('toast').hidden = true; };

// a dial: the value follows the hand (no detents: a dial is continuous), ← → nudge it, the element previews live
function setDial(r, d, v) {
  v = Math.min(d.max, Math.max(d.min, Math.round(v / d.step) * d.step));
  if (v === DIALS[r.id][d.id]) return;
  DIALS[r.id][d.id] = +v.toFixed(4);
  BUILT = install();
  const f = card.querySelector(`[data-dial="${d.id}"]`);
  if (f) { f.querySelector('.val').textContent = fmtDial(d, DIALS[r.id][d.id]); f.querySelector('.bar i').style.width = `${((DIALS[r.id][d.id] - d.min) / (d.max - d.min)) * 100}%`; f.toggleAttribute('data-moved', DIALS[r.id][d.id] !== d.default); f.setAttribute('aria-valuenow', DIALS[r.id][d.id]); const sun = f.querySelector('.sun'); if (sun) sun.style.rotate = `${v}deg`; }
  const cv = card.querySelector('.curve'); if (cv) { const fresh = document.createElement('div'); fresh.innerHTML = curveOf(r); cv.replaceWith(fresh.firstChild); card.querySelector('[data-replay]')?.addEventListener('click', replay); }
  for (const i of card.querySelectorAll('[data-demo]')) { const b = BUILT[i.dataset.demo]; if (b?.cls) { i.className = ''; void i.offsetWidth; i.classList.add(b.cls); } }
}
function current() { return view === 'shadow' ? R[S.shadow] : S[mtab] ? R[S[mtab]] : null; }
function wire() {
  for (const b of card.querySelectorAll('[data-go]')) b.addEventListener('click', () => go(b.dataset.go, b.dataset.tab));
  for (const b of card.querySelectorAll('[role="tab"]')) b.addEventListener('click', () => { mtab = b.dataset.tab; dress(); draw(); });
  for (const b of card.querySelectorAll('[data-pick]')) {
    const id = b.dataset.pick, kind = view === 'shadow' ? 'shadow' : 'motion';
    b.addEventListener('pointerenter', () => preview(kind, id)); b.addEventListener('focus', () => preview(kind, id));
    b.addEventListener('pointerleave', unpreview); b.addEventListener('blur', unpreview);
    // a click picks the recipe (its dials show below); Use writes it
    b.addEventListener('click', () => { if (kind === 'shadow') S.shadow = id; else S[mtab] = id || null; peekId = null; dress(); draw(); if (kind !== 'shadow' && mtab === 'enter') replay(); card.querySelector(`[data-pick="${id}"]`)?.focus({ preventScroll: true }); });
  }
  card.querySelector('[data-use]')?.addEventListener('click', (e) => use(e.currentTarget.dataset.use));
  card.querySelector('[data-replay]')?.addEventListener('click', replay);
  card.querySelector('[data-toggle-height]')?.addEventListener('click', (e) => { const g = card.querySelector('.grow-box'); const open = g.dataset.open !== 'true'; g.dataset.open = String(open); e.currentTarget.textContent = open ? 'Show less ▴' : 'Show more ▾'; });
  for (const f of card.querySelectorAll('[data-dial]')) {
    const r = current(), d = r?.dials.find((x) => x.id === f.dataset.dial);
    if (!d) continue;
    f.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const x0 = e.clientX, v0 = DIALS[r.id][d.id], span = d.max - d.min, px = 180; // the whole range is 180px of hand travel
      let moving = false;
      const move = (ev) => { if (!moving && Math.abs(ev.clientX - x0) < 3) return; if (!moving) { moving = true; document.body.dataset.dragging = ''; ring.dataset.peek = ''; } setDial(r, d, v0 + ((ev.clientX - x0) / px) * span); };
      const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); delete document.body.dataset.dragging; delete ring.dataset.peek; if (moving && view !== 'shadow' && mtab === 'enter') replay(); };
      addEventListener('pointermove', move); addEventListener('pointerup', up);
    });
    f.addEventListener('keydown', (e) => { const k = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!k) return; e.preventDefault(); setDial(r, d, DIALS[r.id][d.id] + k * d.step * (e.shiftKey ? 10 : 1)); });
  }
}
addEventListener('keydown', (e) => {
  if (e.target.closest?.('[data-dial]') && /Arrow/.test(e.key)) return;
  if (e.key === 'Escape' && view !== 'main') { e.preventDefault(); unpreview(); go('main'); }
  else if (e.key === 'Enter' && view !== 'main' && !e.target.closest?.('button')) { e.preventDefault(); card.querySelector('[data-use]')?.click(); }
  else if ((e.key === 'r' || e.key === 'R') && view === 'motion') replay();
});
addEventListener('resize', place);
dress(); draw();
</script>
</body>
</html>
