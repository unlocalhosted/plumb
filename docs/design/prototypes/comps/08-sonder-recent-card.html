<!doctype html>
<!-- COMP #8, the one component. Sonder, a music app: Recently played, with the week's listening drawn by the day, four
     records (one still playing, one half heard), and the player. Planted (and drawn here): each tile is a 14px card
     with 8px of padding, and its cover keeps the card's own 14px corner, so the gap between the curves pinches at every
     corner. plumber's fix: 14 − 8 = 6px. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonder recently played card (comp)</title>
<style>
  /* Quarry's Slate primitives, from overlay/showcase/src/theme.css */
  :root {
    --canvas: #f5f7fa; --surface: #ffffff; --sunken: #f3f5f9; --ink: #12233d; --ink-muted: #5a6779; --ink-subtle: #6f7c90;
    --line: rgb(18 35 61 / 0.11); --accent: #5550d8; --accent-soft: #efeefd; --accent-deep: #3631a6; --accent-ink: #fff;
    --positive: #0f6f58; --positive-soft: #e5f4ef; --caution: #965a03; --caution-soft: #fcf1dd; --negative: #b02a3a; --negative-soft: #fbeaed;
    --board: #eef1f5; --board-dot: #d6dce4;
    --r-chip: 4px; --r-control: 6px; --r-card: 10px; --r-sheet: 14px;
    --shadow-raised: 0 1px 1px oklch(0.21 0.02 264 / 0.04), 0 1px 3px oklch(0.21 0.02 264 / 0.08);
    --shadow-overlay: 0 2px 4px oklch(0.21 0.02 264 / 0.04), 0 6px 16px oklch(0.21 0.02 264 / 0.1);
    --shadow-popover: 0 4px 8px oklch(0.21 0.02 264 / 0.05), 0 12px 32px oklch(0.21 0.02 264 / 0.14);
    --shadow-card: 0 0 0 1px rgb(18 35 61 / 0.11), 0 1px 1px rgb(18 35 61 / 0.03), 0 2px 6px rgb(18 35 61 / 0.04);
    /* a hairline: one device pixel at 2x, drawn as a half-pixel inset shadow (theme.css) */
    --hl: 0.5px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px; background-color: var(--board);
    background-image: radial-gradient(var(--board-dot) 1px, transparent 1px); background-size: 16px 16px;
    font: 14px/20px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  p, h1, h2, h3, ul, dl, dd, figure { margin: 0; padding: 0; }
  ul { list-style: none; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: default; }
  .num { font-variant-numeric: tabular-nums; }
  .card { border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow-card); }
  .hl-t { box-shadow: inset 0 var(--hl) 0 var(--line); }
  .hl-b { box-shadow: inset 0 calc(-1 * var(--hl)) 0 var(--line); }
  .face { border-radius: 50%; object-fit: cover; outline: 1px solid rgb(0 0 0 / 0.1); outline-offset: -1px; display: block; flex: none; }
  .logo { display: block; background: var(--g, #fff); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
  .muted { color: var(--ink-muted); } .subtle { color: var(--ink-subtle); }
  .di-icon { flex: none; display: block; }

  .card { width: 576px; overflow: hidden; }
  header { display: flex; align-items: center; gap: 16px; padding: 18px 20px 14px; }
  header .t { font-size: 17px; line-height: 24px; font-weight: 500; letter-spacing: -0.01em; }
  header .s { font-size: 13px; color: var(--ink-muted); }
  .week { margin-left: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .week .b { display: flex; align-items: flex-end; gap: 3px; height: 24px; }
  .week .b i { width: 8px; border-radius: 2px; background: rgb(18 35 61 / 0.14); }
  .week .b i.now { background: var(--accent); }
  .week .d { display: flex; gap: 3px; font-size: 10px; line-height: 12px; color: var(--ink-subtle); }
  .week .d span { width: 8px; text-align: center; }
  header a { font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; }

  ul { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 20px; }
  /* PLANTED: the cover keeps the tile's 14px corner, 8px inside it */
  .tile { display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 8px; border-radius: var(--r-sheet); background: var(--sunken); text-align: left; }
  .cover { position: relative; display: block; overflow: hidden; border-radius: var(--r-sheet); }
  .cover img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; outline: 1px solid rgb(18 35 61 / 0.1); outline-offset: -1px; }
  .mix { display: grid; grid-template-columns: 1fr 1fr; aspect-ratio: 1; }
  .mix img { aspect-ratio: auto; height: 100%; outline: 0; }
  .mix .more { display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; }
  .eq { position: absolute; left: 8px; bottom: 8px; display: flex; align-items: flex-end; gap: 2px; height: 22px; padding: 5px 6px; border-radius: 99px; background: rgb(18 35 61 / 0.72); }
  .eq i { width: 3px; border-radius: 1px; background: #fff; }
  .meta { display: flex; flex-direction: column; padding: 0 2px 2px; min-width: 0; }
  .meta .n { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .a { font-size: 12px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .x { margin-top: 6px; display: flex; align-items: center; gap: 6px; font-size: 11.5px; line-height: 14px; color: var(--ink-subtle); }
  .meta .x .p { flex: 1; height: 3px; border-radius: 2px; background: rgb(18 35 61 / 0.1); overflow: hidden; }
  .meta .x .p b { display: block; height: 100%; border-radius: 2px; background: var(--ink-muted); }
  .meta .x.live { color: var(--accent-deep); font-weight: 500; }

  footer { margin-top: 16px; display: flex; align-items: center; gap: 12px; padding: 12px 20px 14px; box-shadow: inset 0 var(--hl) 0 var(--line); }
  footer .mini { width: 44px; height: 44px; border-radius: var(--r-control); object-fit: cover; outline: 1px solid rgb(18 35 61 / 0.1); outline-offset: -1px; flex: none; }
  footer .who { width: 132px; flex: none; min-width: 0; }
  footer .who .n { font-size: 13px; font-weight: 500; }
  footer .who .a { font-size: 12px; color: var(--ink-muted); }
  .wave { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .wave .bars { display: flex; align-items: center; gap: 2px; height: 26px; }
  .wave .bars i { flex: 1; border-radius: 1px; background: rgb(18 35 61 / 0.16); }
  .wave .bars i.on { background: var(--ink); }
  .wave .tm { display: flex; justify-content: space-between; font-size: 11px; line-height: 14px; color: var(--ink-subtle); font-variant-numeric: tabular-nums; }
  .pause { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; }
</style>
</head>
