<!doctype html>
<!-- COMP #40 (continuous corners). A tablet's home screen in edit mode with the widget gallery open: big tiles at a
     22px radius beside the system's own smooth app icons. Drawn here with corner-shape: squircle on every tile;
     plumber's mistake is planted on the gallery's tiles (the Weather tile is [data-widget]): plain border-radius, a
     quarter circle whose kink shows at this size. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget gallery (comp)</title>
<style>
  :root {
    --surface: #fff; --sunken: #f3f5f9; --ink: #12233d; --ink-muted: #5a6779; --ink-subtle: #6f7c90;
    --line: rgb(18 35 61 / 0.09); --accent: #5550d8; --accent-soft: #efeefd; --accent-deep: #3631a6; --negative: #d6334a;
    --board: #e9edf2; --board-dot: #d3d9e2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px; background: var(--board);
    background-image: radial-gradient(var(--board-dot) 1px, transparent 1px); background-size: 16px 16px;
    font: 13px/18px Inter, -apple-system, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
  .num { font-variant-numeric: tabular-nums; }
  img { display: block; }
  .sq { corner-shape: squircle; }

  /* the device */
  .device { width: 984px; height: 688px; padding: 14px; border-radius: 40px; background: #1b1d22; box-shadow: inset 0 0 0 1.5px #3a3d44, 0 1px 2px rgb(18 35 61 / 0.1), 0 20px 50px rgb(18 35 61 / 0.22), 0 40px 90px rgb(18 35 61 / 0.14); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 27px; overflow: hidden; background: #2a3b45; }
  .wall { position: absolute; inset: -20px; background: url(../../../../overlay/showcase/src/media/valley.jpg) center 60% / cover; filter: saturate(1.1); }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 30px; display: flex; align-items: center; padding: 0 22px; color: #fff; font-size: 13px; font-weight: 600; z-index: 3; }
  .status .r { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .status svg { height: 11px; fill: #fff; }

  /* the home screen, in edit mode behind the sheet */
  .home { position: absolute; inset: 80px 56px 0; display: grid; grid-template-columns: repeat(8, 1fr); row-gap: 26px; justify-items: center; align-content: start; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff; font-size: 11.5px; font-weight: 500; text-shadow: 0 1px 2px rgb(0 0 0 / 0.35); position: relative; }
  .app .ic { width: 68px; height: 68px; border-radius: 16px; corner-shape: squircle; display: grid; place-items: center; box-shadow: 0 2px 6px rgb(0 0 0 / 0.18); }
  .app .ic svg { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .app .x { position: absolute; top: -6px; left: -6px; width: 20px; height: 20px; border-radius: 50%; background: rgb(240 240 244 / 0.85); color: #333; display: grid; place-items: center; font-size: 13px; line-height: 1; text-shadow: none; box-shadow: 0 1px 3px rgb(0 0 0 / 0.25); }
  .dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 16px; padding: 12px 16px; border-radius: 30px; corner-shape: squircle; background: rgb(255 255 255 / 0.28); backdrop-filter: blur(20px); }
  .dock .ic { width: 58px; height: 58px; border-radius: 14px; }
  .dock .ic svg { width: 30px; height: 30px; }
  .dim { position: absolute; inset: 176px 0 0; background: linear-gradient(rgb(10 16 24 / 0), rgb(10 16 24 / 0.42) 60px); z-index: 1; }
  .done { position: absolute; top: 38px; right: 26px; z-index: 2; height: 30px; padding: 0 14px; display: grid; place-items: center; border-radius: 99px; background: rgb(255 255 255 / 0.85); font-weight: 600; font-size: 13px; }

  /* the gallery sheet */
  .sheet { position: absolute; z-index: 2; left: 50%; top: 204px; transform: translateX(-50%); width: 640px; padding: 20px 22px 22px; border-radius: 30px; corner-shape: squircle; background: rgb(244 245 248 / 0.97); box-shadow: 0 20px 60px rgb(0 0 0 / 0.35); }
  .sh { display: flex; align-items: center; gap: 12px; }
  .sh h1 { margin: 0; font-size: 19px; line-height: 24px; font-weight: 600; letter-spacing: -0.015em; }
  .srch { margin-left: auto; height: 30px; width: 180px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-radius: 9px; background: rgb(18 35 61 / 0.06); color: var(--ink-subtle); }
  .srch svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; }
  .sh .x { width: 28px; height: 28px; border-radius: 50%; background: rgb(18 35 61 / 0.08); display: grid; place-items: center; color: var(--ink-muted); font-size: 15px; }
  .search { margin-top: 14px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 10px; background: rgb(18 35 61 / 0.06); color: var(--ink-subtle); font-size: 14px; }
  .search svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; }
  .label { margin: 18px 2px 10px; font-size: 12px; font-weight: 600; color: var(--ink-subtle); letter-spacing: 0.02em; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .w { aspect-ratio: 1; border-radius: 22px; corner-shape: squircle; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
  .w.wide { grid-column: span 2; aspect-ratio: auto; }
  .w .t { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; }
  .w .big { font-size: 40px; line-height: 1; font-weight: 500; letter-spacing: -0.035em; }
  .w small { font-size: 11.5px; line-height: 15px; display: block; padding-top: 5px; }
  /* weather: the sky it's describing */
  .wx { background: linear-gradient(170deg, #3f86d8 0%, #5aa2e6 55%, #8cc3f0 100%); color: #fff; }
  .wx small { color: rgb(255 255 255 / 0.85); }
  .wx svg { width: 20px; height: 20px; }
  .wx .hrs { display: flex; justify-content: space-between; font-size: 10.5px; color: rgb(255 255 255 / 0.85); margin-top: 6px; }
  .cal { background: #fff; box-shadow: 0 1px 2px rgb(18 35 61 / 0.06), 0 0 0 0.5px rgb(18 35 61 / 0.06); }
  .cal .t { color: var(--negative); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .cal small { color: var(--ink-muted); }
  .cal .ev { display: flex; gap: 6px; align-items: stretch; margin-top: 6px; }
  .cal .ev i { width: 3px; border-radius: 2px; background: var(--accent); }
  .cal .ev span { font-size: 11.5px; line-height: 14px; } .cal .ev b { font-weight: 600; display: block; }
  .ph { padding: 0; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ph::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgb(0 0 0 / 0.55), rgb(0 0 0 / 0.2) 40%, transparent 70%); }
  .ph .cap { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 1; color: #fff; font-size: 12.5px; font-weight: 600; line-height: 16px; }
  .ph .cap small { padding-top: 1px; font-weight: 400; color: rgb(255 255 255 / 0.85); }
  .rings { background: #111317; color: #fff; }
  .rings .row { display: flex; align-items: center; gap: 12px; }
  .rings svg { width: 78px; height: 78px; flex: none; }
  .rings .st { display: flex; flex-direction: column; gap: 3px; font-size: 12px; line-height: 15px; }
  .rings .st b { font-size: 15px; font-weight: 600; }
  .rings .st span { color: rgb(255 255 255 / 0.6); font-size: 11px; }
  .size { display: flex; justify-content: center; gap: 6px; margin-top: 18px; }
  .size i { width: 7px; height: 7px; border-radius: 50%; background: rgb(18 35 61 / 0.2); }
  .size i.on { background: var(--ink); }
  .add { margin: 14px auto 0; width: 220px; height: 44px; border-radius: 99px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 14px; box-shadow: 0 2px 8px rgb(85 80 216 / 0.35); }
  .w.picked { box-shadow: 0 0 0 3px rgb(244 245 248), 0 0 0 5px var(--accent); }
</style>
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="wall"></div>
    <div class="status num"><span>9:41</span><span style="margin-left:10px;font-weight:500">Thu 6 Nov</span>
      <span class="r"><svg viewBox="0 0 16 11"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.3c1.4 0 2.6.5 3.6 1.4l1.2-1.3A7 7 0 0 0 8 3.7a7 7 0 0 0-4.8 1.9l1.2 1.3c1-.9 2.2-1.4 3.6-1.4zM8 8.8l-1.8 1.9L8 12.6l1.8-1.9z"/></svg><span>82%</span><svg viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="#fff" opacity="0.6"/><rect x="2" y="2" width="16" height="8" rx="1.6"/><rect x="23.5" y="4" width="1.8" height="4" rx="0.9" opacity="0.6"/></svg></span></div>
    <div class="home">
      <div class="app"><span class="x">–</span><span class="ic" style="background:linear-gradient(160deg,#ff9d55,#f2662f)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg></span>Weather</div>
      <div class="app"><span class="x">–</span><span class="ic" style="background:#fff"><svg viewBox="0 0 24 24" style="stroke:#d6334a"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>Calendar</div>
      <div class="app"><span class="x">–</span><span class="ic" style="background:linear-gradient(160deg,#ffd86b,#f5a524)"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM5 10h14"/></svg></span>Notes</div>
      <div class="app"><span class="x">–</span><span class="ic" style="background:linear-gradient(160deg,#5ac87a,#2e9e57)"><svg viewBox="0 0 24 24"><path d="M5 17V9a7 7 0 0 1 14 0v8"/><path d="M5 14h3v5H5zM16 14h3v5h-3z"/></svg></span>Podcasts</div>

      <div class="app"><span class="x">–</span><span class="ic" style="background:linear-gradient(160deg,#3a3d44,#16181c)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg></span>Settings</div>
      <div class="app"><span class="x">–</span><span class="ic" style="background:linear-gradient(160deg,#ff6b8b,#e2365f)"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></span>Music</div>
      <div class="app"><span class="x">–</span><span class="ic" style="background:linear-gradient(160deg,#7ad0ff,#2d9de6)"><svg viewBox="0 0 24 24"><path d="M4 7l8 6 8-6"/><rect x="4" y="5" width="16" height="14" rx="2"/></svg></span>Mail</div>
    </div>
    <div class="dock">
      <span class="app"><span class="ic" style="background:linear-gradient(160deg,#5ef08a,#21c45a)"><svg viewBox="0 0 24 24"><path d="M5 18l1.5-4A7 7 0 1 1 10 18z"/></svg></span></span>
      <span class="app"><span class="ic" style="background:linear-gradient(160deg,#7ad0ff,#2d9de6)"><svg viewBox="0 0 24 24"><path d="M4 7l8 6 8-6"/><rect x="4" y="5" width="16" height="14" rx="2"/></svg></span></span>
      <span class="app"><span class="ic" style="background:#fff"><svg viewBox="0 0 24 24" style="stroke:#e2365f"><circle cx="9" cy="9" r="4"/><circle cx="15" cy="9" r="4" style="stroke:#f5a524"/><circle cx="12" cy="14.5" r="4" style="stroke:#2d9de6"/></svg></span></span>
      <span class="app"><span class="ic" style="background:linear-gradient(160deg,#ffd86b,#f5a524)"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM5 10h14"/></svg></span></span>
    </div>
    <div class="dim"></div>

    <section class="sheet">

</html>
