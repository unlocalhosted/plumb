<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Element cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Inline element cards for kinds other than text, in direction D (text-card.html, "D · Editor"): an editor, not a
     catalogue. At rest only what the element is now; the scale shows under the fields only while a value changes.
     The field, the rail, the drag and its springs are D's, copied, not redesigned. */
  :root {
    --ink: #1c1b19; --ink-2: #55544f; --ink-3: #8b8a85; --line: rgb(0 0 0 / .08); --wash: rgb(0 0 0 / .035);
    --paper: #fff; --glass: rgb(255 255 255 / .88); --sky: #2f6bff; --sky-soft: rgb(47 107 255 / .12);
    --coral: #e2533a; --coral-soft: rgb(226 83 58 / .12); --page: #fafaf8;
    --spring: cubic-bezier(.2, .9, .25, 1.15); --ease: cubic-bezier(.2, .8, .2, 1);
    --mono: 'Geist Mono', ui-monospace, monospace; --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 var(--sans); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }

  /* the switcher */
  .bar { position: sticky; top: 0; z-index: 10; display: flex; gap: 6px; align-items: center; padding: 12px 20px; background: rgb(250 250 248 / .9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .bar .t { font: 600 12px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); margin-right: 10px; }
  .bar button { height: 30px; padding: 0 12px; border-radius: 9px; color: var(--ink-2); font-weight: 550; }
  .bar button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .bar .hint { margin-left: auto; color: var(--ink-3); font-size: 12px; }

  /* the page under the card */
  .stage { position: relative; max-width: 1180px; margin: 0 auto; padding: 72px 40px 200px; display: grid; grid-template-columns: minmax(0, 560px) 1fr; gap: 40px; }
  .kick { font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
  .page h2 { font: 500 30px/1.1 var(--sans); letter-spacing: -.02em; margin: 0 0 22px; }
  .page .lede { color: var(--ink-2); font-size: 16px; line-height: 1.55; margin: 0 0 24px; max-width: 460px; }
  /* the element keeps up with the hand: a preview lands at once (only colours and shadows ease) */
  #target { transition: background-color 160ms ease, box-shadow 160ms ease, border-color 160ms ease, color 160ms ease; }
  .ring { position: absolute; pointer-events: none; border-radius: 10px; box-shadow: 0 0 0 1.5px var(--sky); z-index: 2; }
  .ring[data-previewing] { box-shadow: 0 0 0 1.5px var(--sky), 0 0 0 5px var(--sky-soft); }
  .ring[hidden] { display: none; }

  /* sample: a notification card */
  .notice { display: flex; gap: 12px; max-width: 420px; }
  .notice .nic { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: #dff3e7; color: #1d7a45; }
  .notice b { display: block; font-weight: 600; font-size: 14.5px; }
  .notice p { margin: 3px 0 6px; color: var(--ink-2); font-size: 13.5px; line-height: 1.45; }
  .notice small { font: 500 11px/1 var(--mono); color: var(--ink-3); }
  .notice.after { margin-top: 12px; opacity: .45; padding: 13px; border-radius: 12px; background: #fff; border: 1px solid #dedbd3; }
  /* sample: a toolbar row */
  .tb { width: 460px; min-height: 104px; padding: 12px; border-radius: 12px; background: #fff; border: 1px solid #e4e2dc; }
  .tb > * { flex: none; }
  .tb .av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #ffd5a8, #e2533a); }
  .tb .who { display: grid; gap: 2px; } .tb .who b { font-size: 13.5px; } .tb .who span { font-size: 12px; color: var(--ink-3); }
  .tb .chip { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: #f1efea; font-size: 12.5px; font-weight: 550; }
  .tb .go { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 12.5px; font-weight: 600; }
  /* sample: a recipe row with its picture */
  .recipe { display: flex; gap: 16px; align-items: flex-start; max-width: 480px; padding: 16px; border-radius: 14px; background: #fff; box-shadow: 0 0 0 .5px rgb(0 0 0 / .08), 0 4px 14px -6px rgb(0 0 0 / .12); }
  .recipe .pic { flex: none; overflow: hidden; background: #ece9e2; }
  .recipe .pic img { display: block; width: 100%; height: 100%; }
  .recipe b { display: block; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .recipe p { margin: 0 0 8px; color: var(--ink-2); font-size: 13.5px; line-height: 1.45; }
  .recipe small { font: 500 11px/1 var(--mono); color: var(--ink-3); }
  /* sample: a call to action */
  .actions { display: inline-flex; gap: 14px; align-items: center; }
  .btn { display: inline-flex; align-items: center; white-space: nowrap; font-family: var(--sans); }
  .actions .alt { font-size: 14px; font-weight: 550; color: var(--ink-2); }

  /* the card: inline, beside the element, its caret on the element */
  .card { position: absolute; z-index: 5; width: 284px; background: var(--glass); backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6);
    border-radius: 16px; box-shadow: 0 0 0 .5px rgb(0 0 0 / .1), 0 1px 1px rgb(0 0 0 / .04), 0 10px 24px -10px rgb(0 0 0 / .18), 0 32px 64px -28px rgb(0 0 0 / .22), inset 0 1px 0 rgb(255 255 255 / .9);
    transform-origin: left center; animation: pop 280ms var(--spring) both; }
  .card::before { content: ''; position: absolute; left: -6px; top: var(--caret, 40px); width: 12px; height: 12px; rotate: 45deg; background: var(--paper); box-shadow: -.5px .5px 0 rgb(0 0 0 / .1); border-radius: 2px 0 0 0; }
  @keyframes pop { from { opacity: 0; scale: .96; translate: -6px 0; } }
  .card[hidden] { display: none; }
  .card[data-below="y"]::before { left: 40px; top: -6px; box-shadow: -.5px -.5px 0 rgb(0 0 0 / .1); }
  .head { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 8px; }
  .head .n { font: 600 13px/1.2 var(--mono); }
  .head .n span { color: var(--ink-3); font-weight: 500; }
  .head .at { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--ink-3); }
  .say { font-size: 11.5px; color: var(--ink-3); margin: -4px 14px 10px; }
  .toast { position: fixed; z-index: 20; left: 50%; bottom: 28px; translate: -50% 0; display: flex; gap: 12px; align-items: center; padding: 8px 8px 8px 14px; border-radius: 12px; background: var(--ink); color: #fff; font-weight: 550; box-shadow: 0 10px 30px -10px rgb(0 0 0 / .4); animation: pop 240ms var(--spring) both; }
  .toast button { height: 28px; padding: 0 10px; border-radius: 8px; background: rgb(255 255 255 / .12); }
  .toast[hidden] { display: none; }

  /* shared pressable choice: hover lifts, pressed sinks, picked fills */
  .ch { position: relative; border-radius: 8px; transition: background 120ms ease-out, box-shadow 120ms ease-out, scale 120ms ease-out, color 120ms; }
  @media (hover: hover) { .ch:hover, .ch.is-hover { background: var(--wash); } }
  .ch:active { scale: .96; }
  .ch:focus-visible, .ch.is-focus { outline: none; box-shadow: 0 0 0 2px var(--sky); }
  .ch[aria-checked="true"] { background: var(--sky-soft); color: var(--sky); }
  .seg { display: flex; padding: 2px; border-radius: 9px; background: var(--wash); }
  .seg .ch { flex: 1; display: grid; place-items: center; height: 26px; border-radius: 7px; font: 600 12px/1 var(--sans); color: var(--ink-2); }
  .seg .ch svg { width: 14px; height: 14px; }
  .seg .ch[aria-checked="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .1), 0 0 0 .5px rgb(0 0 0 / .06); }
  /* not set: the page decides; the option it lands on is outlined, quiet, not picked */
  .seg .ch[data-page] { color: var(--ink-2); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .18); }
  .seg .ch[data-page]::after { content: ''; position: absolute; inset: 3px; border-radius: 5px; border: 1px dashed rgb(0 0 0 / .22); }
  .seg .ch[data-page] { box-shadow: none; }
  .seg[aria-disabled="true"] { opacity: .55; pointer-events: none; }
  .sw { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .sw .ch { aspect-ratio: 1; border-radius: 7px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1); }
  .sw .ch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--sky); background: inherit; }
  .sw .ch:focus-visible { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--ink); }

  /* ── the field (D's, unchanged) ── */
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px 12px 10px; }
  .fields + .fields { padding-top: 0; }
  .fields.pad { grid-template-columns: 1fr 1fr 32px; }
  .fld { position: relative; display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 9px 0 4px; border-radius: 9px; background: var(--wash); cursor: default; outline: none; min-width: 0;
    transition: background 120ms ease-out, box-shadow 120ms ease-out, scale 140ms cubic-bezier(.25, .46, .45, .94); user-select: none; text-align: left; }
  @media (hover: hover) { .fld:hover { background: rgb(0 0 0 / .06); } }
  .fld.is-hover { background: rgb(0 0 0 / .06); }
  .fld:focus-visible, .fld[data-editing], .fld.is-focus { background: var(--paper); box-shadow: 0 0 0 1.5px var(--sky), 0 1px 2px rgb(0 0 0 / .06); }
  .fld:active { scale: .985; }
  .fld .ic { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: var(--ink-3); cursor: ew-resize; flex: none; font: 600 12px/1 var(--sans); }
  @media (hover: hover) { .fld .ic:hover { color: var(--ink); background: rgb(0 0 0 / .05); } }
  .fld .ic svg { width: 14px; height: 14px; }
  .fld .val { display: inline-block; font: 500 13px/1 var(--mono); font-variant-numeric: tabular-nums; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fld .u { font: 500 11px/1 var(--mono); color: var(--ink-3); white-space: nowrap; }
  .fld .u:empty { display: none; }
  .fld .was { font: 500 11px/1 var(--mono); color: var(--ink-3); text-decoration: line-through; margin-left: auto; }
  .fld[data-off] .val { color: var(--coral); }
  .fld[data-off]::after { content: ''; position: absolute; right: 8px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--coral); }
  .fld[data-off][data-editing]::after, .fld[data-changed]::after { display: none; }
  .fld[data-changed] .val { color: var(--sky); }
  .fld[data-scrubbing], .fld[data-key] { cursor: ew-resize; }
  .fld.wide { grid-column: 1 / -1; }
  .fld.span2 { grid-column: span 2; }
  .fld.pick { cursor: pointer; padding-right: 8px; }
  .fld.pick .chev { margin-left: auto; color: var(--ink-3); font-size: 10px; }
  .fld .sub:empty { display: none; }
  .fld .sub { color: var(--ink-3); font: 500 11.5px/1 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fld .chip { width: 16px; height: 16px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); flex: none; margin-left: 4px; }
  /* not set here: the page decides; quiet, says so */
  .fld[data-page] .val { color: var(--ink-3); }
  .fld .src { margin-left: auto; font: 500 10.5px/1 var(--sans); color: var(--ink-3); white-space: nowrap; }
  .fld[data-changed] .src, .fld[data-editing] .src { display: none; }
  /* set in code: can't be changed here; the lock says why on click */
  .fld[data-locked], .fld[aria-disabled="true"] { cursor: pointer; }
  .fld[data-locked] .val { color: var(--ink-2); }
  .fld[data-locked] .ic { cursor: pointer; }
  .fld .lock { margin-left: auto; width: 11px; height: 11px; color: var(--ink-3); flex: none; }
  .fld[aria-disabled="true"] { opacity: .5; }
  .fld[aria-disabled="true"] .ic { cursor: pointer; }
  /* the link between padding sides */
  .lnk { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; color: var(--ink-3); transition: background 120ms ease-out, color 120ms, scale 140ms; }
  @media (hover: hover) { .lnk:hover { background: var(--wash); color: var(--ink); } }
  .lnk:active { scale: .94; } .lnk:focus-visible { outline: none; box-shadow: 0 0 0 1.5px var(--sky); }
  .lnk[aria-pressed="true"] { color: var(--sky); }
  .lnk svg { width: 15px; height: 15px; }

  /* the scale, on demand: under the fields while one is changing (D's rail, unchanged) */
  .rail { margin: 0 12px 10px; padding: 9px 10px 8px; border-radius: 10px; background: var(--wash); }
  .rail[data-new] { animation: rail-open 240ms cubic-bezier(.19, 1, .22, 1) both; }
  @keyframes rail-open { from { clip-path: inset(0 0 100% 0 round 10px); translate: 0 -4px; opacity: .4; } to { clip-path: inset(0 0 0 0 round 10px); } }
  @keyframes rail-in { from { opacity: 0; translate: 0 -4px; } }
  .rail .ticks { position: relative; height: 30px; margin: 14px 8px 0; }
  .rail .ticks::before { content: ''; position: absolute; left: 0; right: 0; top: 8px; height: 2px; border-radius: 1px; background: rgb(0 0 0 / .07); }
  .rail .tk { position: absolute; top: 3px; translate: -50% 0; display: grid; justify-items: center; gap: 5px; font: 500 10px/1 var(--mono); color: var(--ink-3); cursor: pointer; padding: 0 2px; border-radius: 5px; transition: color 120ms; }
  .rail .thumb { position: absolute; left: 0; top: 2px; width: 0; height: 14px; pointer-events: none; will-change: transform; }
  .rail .knob { position: absolute; left: -7px; top: 0; width: 14px; height: 14px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 0 .5px rgb(0 0 0 / .15), 0 2px 6px rgb(0 0 0 / .2), inset 0 0 0 3.5px var(--sky); }
  .rail .bub { position: absolute; bottom: calc(100% + 7px); left: 0; translate: -50% 0; padding: 3px 7px; border-radius: 7px; background: var(--ink); color: #fff;
    font: 600 10.5px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; transform-origin: 50% 100%; overflow: hidden; }
  .rail .bub span { display: inline-block; }
  .rail .tk i { display: block; transform-origin: 50% 100%; will-change: transform; width: 2px; height: 9px; border-radius: 1px; background: currentColor; opacity: .5; }
  .rail .tk b { display: block; font: inherit; }
  .rail[data-dragging] .tk { cursor: ew-resize; }
  body[data-dragging], body[data-dragging] * { cursor: ew-resize !important; user-select: none; }
  .rail .tk[data-at] { color: var(--sky); } .rail .tk[data-at] i { height: 11px; width: 3px; opacity: 1; }
  .rail .tk[data-off] { color: var(--coral); } .rail .tk[data-off] i { opacity: 1; height: 11px; width: 3px; background: repeating-linear-gradient(0deg, var(--coral) 0 2px, transparent 2px 3px); }
  @media (hover: hover) { .rail .tk:not([data-off]):hover { color: var(--ink); } }
  .rail .hint { margin-top: 7px; font-size: 11px; color: var(--ink-3); display: flex; gap: 10px; flex-wrap: wrap; }
  .rail .hint kbd, .note kbd { font: 500 10px/1 var(--mono); padding: 2px 4px; border-radius: 4px; background: var(--paper); box-shadow: 0 0 0 .5px var(--line); color: var(--ink-2); }
  /* why a value can't change here: in the rail's place, no scale */
  .note { display: flex; gap: 8px; align-items: flex-start; margin: 0 12px 10px; padding: 9px 10px; border-radius: 10px; background: var(--wash); font-size: 11.5px; line-height: 1.4; color: var(--ink-2); animation: rail-in 180ms var(--ease) both; }
  .note svg { width: 11px; height: 11px; flex: none; margin-top: 2px; color: var(--ink-3); }
  .note .at { display: block; font: 500 10.5px/1.4 var(--mono); color: var(--ink-3); }

  /* lists, on demand from a field with a ▾ */
  .menu { position: absolute; z-index: 3; left: 12px; right: 12px; padding: 4px; border-radius: 12px; background: var(--paper); box-shadow: 0 0 0 .5px rgb(0 0 0 / .1), 0 12px 28px -8px rgb(0 0 0 / .25); animation: rail-in 180ms var(--ease) both; }
  .menu .row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 9px; text-align: left; }
  .menu .row .ag { width: 30px; font-family: var(--sans); line-height: 1; }
  .menu .row .nb { margin-left: auto; font: 500 10.5px/1 var(--mono); color: var(--ink-3); }
  .menu .row[aria-checked="true"] .nb { color: inherit; }
  .menu .sw { padding: 6px; }
  .menu .mname { display: flex; justify-content: space-between; padding: 2px 8px 6px; font: 500 11px/1 var(--mono); color: var(--ink-3); }
  .menu .mname b { font-weight: 500; color: var(--ink); }
  .ratio { display: grid; place-items: center; width: 30px; height: 20px; }
  .ratio i { display: block; border-radius: 2px; border: 1.5px solid currentColor; opacity: .7; }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px 4px 4px; }
  .tiles .ch { display: grid; justify-items: center; gap: 9px; padding: 10px 0 7px; font: 500 10px/1 var(--sans); color: var(--ink-2); }
  .tiles .ch i { display: block; width: 26px; height: 26px; border-radius: 6px; background: #fff; }
  .tiles .ch[aria-checked="true"] { background: var(--sky-soft); color: var(--sky); }
  .fld .tile { width: 16px; height: 16px; border-radius: 4px; background: #fff; flex: none; margin-left: 4px; }

  /* layout: direction and wrap side by side; the 3×3 dot grid beside gap */
  .cell { min-width: 0; }
  .cell .k { display: block; font: 600 10px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 2px 0 5px 2px; }
  .lay { grid-column: 1 / -1; display: grid; grid-template-columns: 78px 1fr; gap: 8px; }
  .lay .col { display: grid; gap: 6px; align-content: start; min-width: 0; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 78px; height: 72px; padding: 3px; border-radius: 9px; background: var(--wash); }
  .g3 .ch { display: grid; place-items: center; border-radius: 6px; }
  .g3 .ch .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-3); opacity: .6; }
  .g3 .ch .bars { display: none; gap: 1.5px; }
  .g3 .ch .bars i { display: block; border-radius: 1px; background: currentColor; }
  .g3[data-dir="row"] .bars i { width: 2.5px; } .g3[data-dir="row"] .bars i:nth-child(1) { height: 9px; } .g3[data-dir="row"] .bars i:nth-child(2) { height: 5px; } .g3[data-dir="row"] .bars i:nth-child(3) { height: 7px; }
  .g3[data-dir="column"] .bars i { height: 2.5px; } .g3[data-dir="column"] .bars i:nth-child(1) { width: 9px; } .g3[data-dir="column"] .bars i:nth-child(2) { width: 5px; } .g3[data-dir="column"] .bars i:nth-child(3) { width: 7px; }
  @media (hover: hover) { .g3 .ch:hover .bars { display: flex; opacity: .45; } .g3 .ch:hover .dot { display: none; } }
  .g3 .ch:focus-visible .bars { display: flex; opacity: .6; } .g3 .ch:focus-visible .dot { display: none; }
  .g3 .ch[aria-checked="true"] { background: var(--paper); color: var(--sky); box-shadow: 0 1px 2px rgb(0 0 0 / .1), 0 0 0 .5px rgb(0 0 0 / .06); }
  .g3 .ch[aria-checked="true"] .bars { display: flex; opacity: 1; } .g3 .ch[aria-checked="true"] .dot { display: none; }
  .g3[data-page] { background: repeating-linear-gradient(45deg, rgb(0 0 0 / .035) 0 3px, transparent 3px 7px), var(--wash); }
  .g3 .ch:focus-visible[aria-checked="true"] { box-shadow: 0 0 0 2px var(--sky); }

  .foot { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-top: .5px solid var(--line); color: var(--ink-2); font-size: 12.5px; }
  .foot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--coral); }
  .foot button { margin-left: auto; height: 26px; padding: 0 9px; border-radius: 8px; color: var(--ink-2); }
  .foot button:hover { background: var(--wash); } .foot button:focus-visible { outline: none; box-shadow: 0 0 0 1.5px var(--sky); }

  /* the states sheet: every state of every control, side by side, for review */
  .sheet { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, 284px); justify-content: center; align-items: start; gap: 18px; }
  .spec { border-radius: 14px; background: var(--glass); box-shadow: 0 0 0 .5px rgb(0 0 0 / .1), 0 10px 24px -14px rgb(0 0 0 / .18); padding: 4px 0 0; position: relative; }
  .spec h3 { margin: 0; padding: 10px 14px 6px; font: 600 10.5px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .spec p { margin: -2px 14px 10px; font-size: 11.5px; color: var(--ink-3); }
  .spec .menu { position: static; margin: 0 12px 12px; animation: none; }

  @media (prefers-reduced-motion: reduce) {
    .card, .toast, .note, .menu { animation: none; }
    #target { transition: none; }
    .rail[data-new] { animation: rail-fade 160ms ease both; } @keyframes rail-fade { from { opacity: 0; } }
    .ch, .fld, .lnk { transition: none; } .ch:active, .fld:active, .lnk:active { scale: none; }
  }

// ── the drag (D's, unchanged but for reading any field) ──
// The whole field is the handle: past 3px a press becomes a drag and the scale opens from the field. One spring moves
// the thumb (transform only, every frame, velocity carried, so a reversal stays smooth). What it springs toward is the
// hand pulled by a smooth magnet around each step: on the step when the hand is near, the hand itself at the midpoint
// between two, so it never jumps. Past either end the hand meets a rubber band. The step nearest the hand is the
// value: it previews on the element at once, and its number rolls in from the side it came from. Letting go springs

// a value field: drag it to move through the steps; click it to change it with the keys or by typing
const refocus = (key) => card.querySelector(`.fld[data-key="${key}"]`)?.focus({ preventScroll: true });
function toggleNote(key) { editing = null; menu = null; unpreview(); note = note === key ? null : key; draw(); card.querySelector(`[data-key="${key}"], [data-note="${key}"]`)?.focus({ preventScroll: true }); }
function wireFields() {

    const show = (at, moved = true) => { note = null; editing = { key, at, typed: '', moved }; if (moved) preview(f.set(f.steps()[at])); else unpreview(); draw(); refocus(key); };

// ── the measuring layer: every spacing value drawn where it lives, one grammar for all ──────────────────────────
// Point near an edge of the element (or of one of its rows) and that side's padding shows inside it (green) or its
// margin outside (amber); the gaps between children show violet. Drag across a band or scroll over it: one notch is
// one step of the spacing scale (a trackpad gathers ~40px per step), with a detent and the value floating by the
// pointer ("16 · s4", coral when off the scale), and the scale under it marking the step that keeps the hierarchy
// (inside < between ≤ around). ⇧ widens to the pair (left+right, top+bottom), ⌘ to all of that kind on the element;

const STEP_NAME = (px) => (px % 4 === 0 ? `s${px / 4}` : null);

// what each owner's spacing is in the state (the list itself, or the rows, which are one line of code)
const OWNERS = {
  list: { name: 'Members', at: 'Members.tsx:12', pad: () => T.pad, margin: () => T.mar },
  row: { name: 'MemberRow', at: 'MemberRow.tsx:8', pad: () => T.rowPad, margin: () => T.rowMar, copies: 3 },

function mEnsure() {

// which values a gesture on this band changes, given the keys held

function mBubble(px, py) {

// ── finding the band under the pointer ──
const ZONE = 12; // px from an edge that count as pointing at it

// ── gestures: drag across, or scroll over; both step through the scale ──
function mStart(b) {

}
function mStep(dir) {

function mWire() {
