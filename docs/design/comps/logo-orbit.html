<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React Plumber · the guardrails become orbits</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
<style>
  /* A motion idea, not the logo: plumber's guardrails (the guides its stem, cap and foot sit on) glide to the centre, turn
     to 0°, 60° and 120°, and open into three orbits round the P, which shrinks to sit at their heart; then they fold
     back into guides. React's atom is Meta's trademark, so this is a moment in the films, never the still mark. */
  :root { --ink: #1d1b17; --ink-2: #6b665c; --desk: #f6f5f2; --guard: #2f86dc; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--desk); color: var(--ink); font: 400 14px/20px "Instrument Sans", system-ui, sans-serif; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; cursor: pointer; }
  p { margin: 0; color: var(--ink-2); }
  svg { overflow: visible; }
  .g { fill: none; stroke: var(--guard); stroke-width: .8; stroke-dasharray: 2.4 2; stroke-linecap: round; transform-box: view-box;
    /* coming home: the orbits close first, then glide back to the edges they guard */
    transition: opacity 250ms ease 1050ms, ry 380ms cubic-bezier(.4,0,.2,1), rx 380ms cubic-bezier(.4,0,.2,1), cx 900ms cubic-bezier(.7,0,.3,1) 320ms, cy 900ms cubic-bezier(.7,0,.3,1) 320ms, transform 900ms cubic-bezier(.7,0,.3,1) 320ms, stroke-width 600ms ease 320ms; }
  /* going out: the guides glide and turn first, then open */
  .orbit .g { transition: opacity 120ms ease, cx 900ms cubic-bezier(.7,0,.3,1), cy 900ms cubic-bezier(.7,0,.3,1), rx 900ms cubic-bezier(.7,0,.3,1), ry 700ms cubic-bezier(.3,1.25,.5,1) 600ms, transform 900ms cubic-bezier(.7,0,.3,1), stroke-width 600ms ease; }
  .mark { transform-origin: 60px 60px; transition: transform 800ms cubic-bezier(.3,1.2,.5,1) 450ms; }
  .orbit .mark { transition: transform 900ms cubic-bezier(.3,1.2,.5,1) 300ms; }
  /* rest: three straight guides where the P's edges sit */
  .g { transform-origin: 60px 60px; opacity: 0; }
  .g1 { cx: 60px; cy: 18px; rx: 56px; ry: .01px; transform: rotate(0deg); }
  .g2 { cx: 24px; cy: 60px; rx: .01px; ry: 56px; transform: rotate(0deg); }
  .g3 { cx: 22px; cy: 102px; rx: 18px; ry: .01px; transform: rotate(0deg); }
  /* at rest the guides are true dashed lines; the ellipses take over as they leave, and hand back as they arrive */
  .line { fill: none; stroke: var(--guard); stroke-width: .8; stroke-dasharray: 2.4 2; stroke-linecap: round; transition: opacity 300ms ease 1000ms; }
  .orbit .line { opacity: 0; transition: opacity 200ms ease; }
  .orbit .g { opacity: 1; }
  /* orbit: the same three, round the centre, turned a third apart, opened */
  .orbit .g { stroke-width: 1.4; }
  .orbit .g1 { cx: 60px; cy: 60px; rx: 56px; ry: 21px; transform: rotate(0deg); }
  .orbit .g2 { cx: 60px; cy: 60px; rx: 56px; ry: 21px; transform: rotate(60deg); }
  .orbit .g3 { cx: 60px; cy: 60px; rx: 56px; ry: 21px; transform: rotate(120deg); }
  .orbit .mark { transform: scale(.52); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg id="s" viewBox="0 0 120 120" width="420" height="420">
    <defs>
      <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7ac0"/><stop offset=".55" stop-color="#f24a9f"/><stop offset="1" stop-color="#d0287f"/></linearGradient>
      <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a7dff"/><stop offset=".55" stop-color="#7356f0"/><stop offset="1" stop-color="#5232d4"/></linearGradient>
    </defs>
    <path class="line" d="M4 18H116M24 4V116M4 102H40"/>
    <ellipse class="g g1"/><ellipse class="g g2"/><ellipse class="g g3"/>
    <g class="mark" id="mark"></g>
  </svg>
  <p>Click to play: the guardrails become orbits, then guides again.</p>
</div>
<script>
const box = (x, y, w, h, r) => { const f = Math.min(1, w / (r[0] + r[1]), w / (r[3] + r[2]), h / (r[0] + r[3]), h / (r[1] + r[2])), [a, b, c, d] = r.map((v) => v * f);
  return `M${x + a} ${y}H${x + w - b}A${b} ${b} 0 0 1 ${x + w} ${y + b}V${y + h - c}A${c} ${c} 0 0 1 ${x + w - c} ${y + h}H${x + d}A${d} ${d} 0 0 1 ${x} ${y + h - d}V${y + a}A${a} ${a} 0 0 1 ${x + a} ${y}Z`; };
// the mark: a pink stem and a violet bowl, the gap between them exact
document.getElementById('mark').innerHTML = `<path d="${box(24, 18, 34, 84, [24, 5, 10, 10])}" fill="url(#stem)"/><path d="${box(62, 18, 34, 56, [5, 28, 28, 5])}" fill="url(#bowl)"/>`;
const s = document.getElementById('s');
const play = () => { s.classList.add('orbit'); setTimeout(() => s.classList.remove('orbit'), 3200); };
document.getElementById('stage').addEventListener('click', play);
setTimeout(play, 700);
</script>
</body>
</html>
