<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React Plumber · the box model, round the P</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
<style>
  /* The owner (2026-11-13): margin, padding, radius "forming a react logo … dont have to show the whole react logo,
     somehow it adjust itself around the p", then: "no coherence no composition … cover the top portion … like from
     right to bottom leaving the 4th quadrant".
     The composition's one rule: three orbits at React's angles (0°, 60°, 120°) wrap the P through three quadrants, from
     the right, over the top, down the left, to the bottom, and leave the bottom-right quadrant open: the corner where
     the P itself is open, under its bowl. Two dashed guides mark that open corner, and every orbit ends on them. Each
     orbit is one of plumber's box-model marks: margin (butter dots), padding (a hatched mint ribbon), radius (a sky guide
     with its corner handles). They sit behind the P, a halo, never across it. React's atom is Meta's trademark: a film
     moment, never the still mark. */
  :root { --ink-2: #6b665c; --desk: #f6f5f2; --sky: #2f86dc; --mint: #1aa36a; --butter: #f5b400; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--desk); font: 400 14px/20px "Instrument Sans", system-ui, sans-serif; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; cursor: pointer; }
  p { margin: 0; color: var(--ink-2); }
  svg { overflow: visible; }
  .o { transform-box: view-box; transform-origin: 60px 60px; }
  .o1 { transform: rotate(0deg); } .o2 { transform: rotate(60deg); } .o3 { transform: rotate(120deg); }
  /* each orbit draws on along its own ellipse; the open corner is cut away, so what shows sweeps the three quadrants */
  .reveal { fill: none; stroke: #fff; stroke-width: 12; stroke-dasharray: 0 100; transition: stroke-dasharray 1500ms cubic-bezier(.6, 0, .2, 1) var(--d, 0ms); }
  .on .reveal { stroke-dasharray: 100 0; }
  .margin { fill: none; stroke: var(--butter); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 0 3.4; }
  .padding { fill: none; stroke: url(#hatch); stroke-width: 3.4; }
  .padding-edge { fill: none; stroke: var(--mint); stroke-width: .45; }
  .radius { fill: none; stroke: var(--sky); stroke-width: .8; }
  /* the open corner's two guides, drawn once the orbits have arrived */
  .guide { fill: none; stroke: var(--sky); stroke-width: .6; stroke-dasharray: 2 1.6; stroke-linecap: round; opacity: 0; transition: opacity 400ms ease; }
  .on .guide { opacity: 1; transition-delay: 1500ms; }
  .handle { opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(.4); transition: opacity 200ms ease, transform 300ms cubic-bezier(.3, 1.6, .5, 1); }
  .on .handle { opacity: 1; transform: scale(1); transition-delay: 1750ms; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg id="s" viewBox="0 0 120 120" width="460" height="460">
    <defs>
      <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7ac0"/><stop offset=".55" stop-color="#f24a9f"/><stop offset="1" stop-color="#d0287f"/></linearGradient>
      <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a7dff"/><stop offset=".55" stop-color="#7356f0"/><stop offset="1" stop-color="#5232d4"/></linearGradient>
      <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <pattern id="hatch" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#e9f7f0"/><rect width=".9" height="2.4" fill="#1aa36a"/></pattern>
      <!-- three quadrants: everything but the bottom-right corner, which stays open -->
      <clipPath id="three" clipPathUnits="userSpaceOnUse"><path d="M-20 -20H140V60H60V140H-20Z"/></clipPath>
      <g id="h"><rect x="-1.9" y="-1.9" width="3.8" height="3.8" rx=".9" fill="#fff" stroke="#2f86dc" stroke-width=".7"/></g>
    </defs>

    <g clip-path="url(#three)">
      <!-- 0°: radius, a fine guide -->
      <g class="o o1"><mask id="m1" maskUnits="userSpaceOnUse" x="-30" y="-30" width="180" height="180"><path class="reveal" pathLength="100" d="M117 60A57 19 0 1 0 3 60A57 19 0 1 0 117 60" style="--d: 0ms"/></mask>
        <path class="radius" mask="url(#m1)" d="M117 60A57 19 0 1 0 3 60A57 19 0 1 0 117 60"/></g>
      <!-- 60°: margin, dots -->
      <g class="o o2"><mask id="m2" maskUnits="userSpaceOnUse" x="-30" y="-30" width="180" height="180"><path class="reveal" pathLength="100" d="M117 60A57 19 0 1 0 3 60A57 19 0 1 0 117 60" style="--d: 140ms"/></mask>
        <path class="margin" mask="url(#m2)" d="M117 60A57 19 0 1 0 3 60A57 19 0 1 0 117 60"/></g>
      <!-- 120°: padding, a hatched ribbon with its edges -->
      <g class="o o3"><mask id="m3" maskUnits="userSpaceOnUse" x="-30" y="-30" width="180" height="180"><path class="reveal" pathLength="100" d="M117 60A57 19 0 1 0 3 60A57 19 0 1 0 117 60" style="--d: 280ms"/></mask>
        <g mask="url(#m3)"><path class="padding" d="M117 60A57 19 0 1 0 3 60A57 19 0 1 0 117 60"/><path class="padding-edge" d="M115.3 60A55.3 17.3 0 1 0 4.7 60A55.3 17.3 0 1 0 115.3 60"/><path class="padding-edge" d="M118.7 60A58.7 20.7 0 1 0 1.3 60A58.7 20.7 0 1 0 118.7 60"/></g></g>
    </g>

    <!-- the open corner's edges: two guides from the centre, right and down; every orbit ends on one of them -->
    <path class="guide" d="M60 60H122M60 60V122"/>
    <!-- where the radius guide meets them: plumber's corner handles -->
    <use href="#h" class="handle" x="117" y="60"/><use href="#h" class="handle" x="60" y="79"/>

    <!-- the P, at the heart, in front of everything -->
    <g id="mark" transform="translate(60 60) scale(.62) translate(-60 -60)"></g>
  </svg>
  <p>Click to play again. Margin, padding and radius wrap the P through three quadrants; the corner under its bowl stays open.</p>
</div>
<script>
const STEM = 'M48 18H53A5 5 0 0 1 58 23V92A10 10 0 0 1 48 102H34A10 10 0 0 1 24 92V42A24 24 0 0 1 48 18Z';
const BOWL = 'M67 18H68A28 28 0 0 1 96 46V46A28 28 0 0 1 68 74H67A5 5 0 0 1 62 69V23A5 5 0 0 1 67 18Z';
document.getElementById('mark').innerHTML = `<path d="${STEM}" fill="url(#stem)"/><path d="${STEM}" fill="url(#lit)" style="mix-blend-mode:soft-light"/><path d="${BOWL}" fill="url(#bowl)"/><path d="${BOWL}" fill="url(#lit)" style="mix-blend-mode:soft-light"/>`;
const s = document.getElementById('s');
const play = () => { s.classList.remove('on'); void s.getBoundingClientRect(); requestAnimationFrame(() => s.classList.add('on')); };
document.getElementById('stage').addEventListener('click', play);
setTimeout(play, 500);
</script>
</body>
</html>
