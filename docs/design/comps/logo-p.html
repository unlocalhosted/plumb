<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React Plumber · the marks as a P</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
<style>
  /* Three marks the owner picked (the turning sides, registration, the declared gap), polished as one family:
     - one grid (120 units), one outer size (84), one gap (4) everywhere, corners concentric with the whole
     - one palette: pink is the hero, ink holds it, one accent per mark (no rainbow)
     - one finish: React Plumber's tactile language, lit from the top, a soft shadow, a fine highlight on each top edge
     Each shown lit, flat in one colour, on a dark app tile, at 32/24/16 px, and beside the name. */
  :root { --ink: #1d1b17; --ink-2: #6b665c; --rule: rgb(29 27 23 / 0.09); --desk: #f6f5f2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 400 14px/20px "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  header { padding: 28px 32px 16px; }
  h1 { margin: 0; font: 600 20px/26px "Instrument Sans"; letter-spacing: -0.01em; }
  .sub { margin: 4px 0 0; color: var(--ink-2); max-width: 900px; }
  .list { display: flex; flex-direction: column; gap: 16px; padding: 0 32px 32px; }
  .card { background: #fff; border-radius: 20px; box-shadow: 0 0 0 1px var(--rule), 0 12px 30px -22px rgb(0 0 0 / .3); display: grid; grid-template-columns: 300px 1fr; overflow: hidden; }
  .hero { display: grid; place-items: center; height: 300px; background: radial-gradient(circle at 50% 40%, #fff, #f7f5f0); border-right: 1px solid var(--rule); }
  .side { display: grid; grid-template-columns: repeat(3, 1fr); }
  .cell { display: grid; place-items: center; border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); min-height: 150px; }
  .cell.dark { background: #1d1b17; }
  .sizes { display: flex; align-items: flex-end; gap: 18px; }
  .lock { display: flex; align-items: center; gap: 12px; font: 650 28px/1 "Instrument Sans"; letter-spacing: -0.035em; }
  .lock.dark { color: #fff; }
  .tile { width: 84px; height: 84px; border-radius: 20px; background: linear-gradient(#2c2a26, #191815); display: grid; place-items: center; box-shadow: inset 0 1px 0 rgb(255 255 255 / .08), 0 10px 20px -12px rgb(0 0 0 / .6); }
  .name { grid-column: 1 / -1; padding: 14px 20px; display: flex; gap: 10px; align-items: baseline; }
  .name b { font: 650 15px/20px "Instrument Sans"; } .name span { color: var(--ink-2); }
  svg { display: block; overflow: visible; }
</style>
</head>
<body>
<header><h1>The turning sides and the declared gap, as a P</h1>
<p class="sub">One grid, one gap, corners concentric with the whole; pink as the hero, ink to hold it, one accent each; lit from the top in React Plumber's tactile finish. Then flat in one colour, on a dark app tile, small, and beside the name.</p></header>
<div class="list" id="list"></div>
<script>
const C = { pink: ['#ff6fb5', '#f24a9f', '#d8338a'], ink: ['#3a3733', '#1d1b17', '#0f0e0c'], butter: ['#ffd24d', '#ffbf1a', '#eaa800'], sky: ['#5aa2ea', '#2f86dc', '#1f6ec1'], violet: ['#8b6bff', '#6a4ae6', '#5233c9'], paper: ['#ffffff', '#f4f1ea', '#dcd7cc'] };
// on a dark ground the ink parts turn to paper, so the mark keeps its whole shape
let DARK = false; const hueOf = (h) => (DARK && h === 'ink' ? 'paper' : h);
// a box with its own corner radii [top-left, top-right, bottom-right, bottom-left]
// corners that don't fit their side are scaled down together, the way CSS scales border-radius (no arc ever overshoots)
const R = (x, y, w, h, radii) => { const f = Math.min(1, w / (radii[0] + radii[1] || 1), w / (radii[3] + radii[2] || 1), h / (radii[0] + radii[3] || 1), h / (radii[1] + radii[2] || 1)); return R0(x, y, w, h, radii.map((r) => r * f)); };
const R0 = (x, y, w, h, [a, b, c, d]) => `M${x + a} ${y}H${x + w - b}${b ? `A${b} ${b} 0 0 1 ${x + w} ${y + b}` : ''}V${y + h - c}${c ? `A${c} ${c} 0 0 1 ${x + w - c} ${y + h}` : ''}H${x + d}${d ? `A${d} ${d} 0 0 1 ${x} ${y + h - d}` : ''}V${y + a}${a ? `A${a} ${a} 0 0 1 ${x + a} ${y}` : ''}Z`;
let uid = 0;
// a part, lit: a vertical gradient (lighter at the top), and a fine highlight along its top edge
function part(d, hue, lit, id = `p${uid++}`) {
  if (!lit) return `<path d="${d}" fill="${DARK && hue === C.ink[1] ? C.paper[1] : hue}"/>`;
  const [hi, base, lo] = C[hueOf(hue)];
  // lit from the top: the body's own gradient, and a soft light over its top quarter only (no rim round the sides)
  return `<defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${hi}"/><stop offset=".55" stop-color="${base}"/><stop offset="1" stop-color="${lo}"/></linearGradient>
    <linearGradient id="${id}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".22" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="${id}c"><path d="${d}"/></clipPath></defs>
    <path d="${d}" fill="url(#${id}g)"/><path d="${d}" fill="url(#${id}h)" style="mix-blend-mode:soft-light"/>`;
}

// the grid: 120 across; every mark fills 18..102 (84), the gap is 4, outer corners 24 (the whole's), inner corners 5
const G = 4, O = 24, I = 5, A = 18, B = 102;
const MARKS = [
  {
    name: 'The turning sides, as a P', idea: 'The same four sides of padding, turning round the content (butter), become the P\'s bowl; the left side runs on down as its stem. The box model and the letter are one shape, every gap 4.',
    draw: (lit, one) => {
      // the bowl is a ring 20 thick round a 24 × 14 content; each side stops 4 short of the next, as when it turned
      const parts = [
        [R(24, 18, 48, 20, [O, I, I, I]), 'pink'],     // top
        [R(76, 18, 20, 38, [I, O, I, I]), 'ink'],      // right
        [R(48, 60, 48, 20, [I, I, O, I]), 'pink'],     // bottom of the bowl
        [R(24, 42, 20, 60, [I, I, 10, 10]), 'ink'],    // left, running on as the stem
        [R(48, 42, 24, 14, [I, I, I, I]), 'butter'],   // the content
      ];
      return parts.map(([d, h]) => part(d, lit ? h : (one || C[h][1]), lit)).join('');
    },
  },
  {
    name: 'The declared gap, as a P', idea: 'A stem and a bowl, and between them exactly the gap: two blocks, and the space between them makes the letter.',
    draw: (lit, one) => [[R(24, 18, 34, 84, [O, I, 10, 10]), 'pink'], [R(62, 18, 34, 56, [I, 28, 28, I]), 'ink']].map(([d, h]) => part(d, lit ? h : (one || C[h][1]), lit)).join(''),
  },
  {
    name: 'The declared gap, as a P, in three', idea: 'The bowl split in two: three blocks and two gaps, both exactly 4, and the P is what they leave.',
    draw: (lit, one) => [[R(24, 18, 34, 84, [O, I, 10, 10]), 'pink'], [R(62, 18, 34, 26, [I, 26, I, I]), 'ink'], [R(62, 48, 34, 26, [I, I, 26, I]), 'sky']].map(([d, h]) => part(d, lit ? h : (one || C[h][1]), lit)).join(''),
  },
];
const svg = (s, draw, lit, one, extra = '', dark = false) => { DARK = dark; const out = `<svg width="${s}" height="${s}" viewBox="0 0 120 120" ${extra}>${draw(lit, one)}</svg>`; DARK = false; return out; };
document.getElementById('list').innerHTML = MARKS.map((m) => `<section class="card">
  <div class="hero">${svg(220, m.draw, true, null, 'style="filter: drop-shadow(0 14px 18px rgb(29 27 23 / .16)) drop-shadow(0 2px 3px rgb(29 27 23 / .12))"')}</div>
  <div class="side">
    <div class="cell">${svg(96, m.draw, false, '#1d1b17')}</div>
    <div class="cell dark"><div class="tile">${svg(58, m.draw, true, null, '', true)}</div></div>
    <div class="cell"><div class="sizes">${svg(32, m.draw, false, null)}${svg(24, m.draw, false, null)}${svg(16, m.draw, false, null)}</div></div>
    <div class="cell" style="grid-column: span 2"><div class="lock">${svg(40, m.draw, true, null)}React Plumber</div></div>
    <div class="cell dark"><div class="lock dark" style="font-size:22px">${svg(30, m.draw, false, '#fff')}React Plumber</div></div>
    <div class="name"><b>${m.name}</b><span>${m.idea}</span></div>
  </div></section>`).join('');
</script>
</body>
</html>
