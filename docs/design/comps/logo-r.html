<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React Plumber · the guardrails draw an R</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
<style>
  /* The P inside an R (the owner's idea, 2026-11-13): the guardrails draw the one part a P lacks to be an R, its leg, in
     their own dashed line. The P stays solid; the leg stays a guide. R is for React. The leg is the stem's shoulder
     again (the same quarter round, radius 24), so it belongs to the mark's geometry. */
  :root { --ink: #1d1b17; --ink-2: #6b665c; --desk: #f6f5f2; --guard: #2f86dc; --open: cubic-bezier(.22, 1, .36, 1); --glide: cubic-bezier(.7, 0, .3, 1); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--desk); color: var(--ink); font: 400 14px/20px "Instrument Sans", system-ui, sans-serif; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; cursor: pointer; }
  p { margin: 0; color: var(--ink-2); }
  svg { overflow: visible; }

  /* the guardrails: a full frame the mark is built in. Top and bottom, left and right, each running the same way past
     the mark and fading out at its tips; a small cross where two meet. The frame's empty corner, under the bowl, is
     where the leg will go */
  .line { fill: none; stroke-width: .4; stroke-dasharray: 1.2 1.8; stroke-linecap: round; opacity: .85; }
  .line.h { stroke: url(#fade-h); } .line.v { stroke: url(#fade-v); }
  .cross { fill: none; stroke: var(--guard); stroke-width: .5; stroke-linecap: round; }

  /* the leg: drawn by a pen along its outline (a mask), in the guide's dashes, with a breath of the guide's blue inside */
  .pen { fill: none; stroke: #fff; stroke-width: 2.4; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 420ms var(--glide); }
  .r .pen { stroke-dashoffset: 0; transition: stroke-dashoffset 900ms var(--glide) 650ms; }
  .leg-line { fill: none; stroke: var(--guard); stroke-width: .6; stroke-dasharray: 1.2 1.2; }
  .leg-fill { fill: var(--guard); opacity: 0; transition: opacity 260ms ease; }
  .r .leg-fill { opacity: .09; transition: opacity 500ms ease 1300ms; }
  .leg-con { opacity: 0; transition: opacity 200ms ease; }
  .r .leg-con { opacity: 1; transition: opacity 300ms ease 1450ms; }

  /* the DOM leg's nodes: each drops out of its parent, a step down and a step in, the way children sit in a tree */
  .node { opacity: 0; transform: translate(-4px, -4px); transition: opacity 200ms ease, transform 200ms ease; }
  .r .node { opacity: 1; transform: none; transition: opacity 320ms ease var(--nd), transform 560ms var(--open) var(--nd); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg id="s" viewBox="0 0 120 120" width="440" height="440">
    <defs>
      <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7ac0"/><stop offset=".55" stop-color="#f24a9f"/><stop offset="1" stop-color="#d0287f"/></linearGradient>
      <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a7dff"/><stop offset=".55" stop-color="#7356f0"/><stop offset="1" stop-color="#5232d4"/></linearGradient>
      <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <!-- the construction's own pieces: a faint light hatch over the material, and the handle-points' small lift -->
      <pattern id="hatch" width="2" height="4" patternUnits="userSpaceOnUse"><rect width=".3" height="4" fill="#fff"/></pattern>
      <filter id="lift" x="-1" y="-1" width="3" height="3"><feDropShadow dx="0" dy=".25" stdDeviation=".3" flood-color="#1d1b17" flood-opacity=".25"/></filter>
      <!-- a guide fades out at its tips -->
      <linearGradient id="fade-h" gradientUnits="userSpaceOnUse" x1="6" y1="0" x2="114" y2="0"><stop offset="0" stop-color="#2f86dc" stop-opacity="0"/><stop offset=".12" stop-color="#2f86dc"/><stop offset=".88" stop-color="#2f86dc"/><stop offset="1" stop-color="#2f86dc" stop-opacity="0"/></linearGradient>
      <linearGradient id="fade-v" gradientUnits="userSpaceOnUse" x1="0" y1="2" x2="0" y2="118"><stop offset="0" stop-color="#2f86dc" stop-opacity="0"/><stop offset=".12" stop-color="#2f86dc"/><stop offset=".88" stop-color="#2f86dc"/><stop offset="1" stop-color="#2f86dc" stop-opacity="0"/></linearGradient>
    </defs>
    <!-- the guides, at rest on the mark's edges -->
    <path class="line h" d="M6 18H114"/><path class="line h" d="M6 102H114"/><path class="line v" d="M24 2V118"/><path class="line v" d="M96 2V118"/>
    <path class="cross" d="M22.6 18H25.4M24 16.6V19.4M94.6 18H97.4M96 16.6V19.4M22.6 102H25.4M24 100.6V103.4M94.6 102H97.4M96 100.6V103.4"/>
    <g class="mark">
      <g id="g-stem"></g><g id="g-bowl"></g>
      <mask id="draw" maskUnits="userSpaceOnUse" x="50" y="66" width="60" height="50"><path class="pen" id="pen" pathLength="1"/></mask>
      <path class="leg-fill" id="leg-fill"/>
      <path class="leg-line" id="leg-line" mask="url(#draw)"/>
      <g class="leg-con" id="leg-con"></g>
      <g id="nodes"></g>
    </g>
  </svg>
  <p>Click to draw the leg again.</p>
</div>
<script>
// the mark's two parts, the same as overlay/src/mark.js (this page is a plain file, so they are written out)
const STEM = 'M48 18H53A5 5 0 0 1 58 23V92A10 10 0 0 1 48 102H34A10 10 0 0 1 24 92V42A24 24 0 0 1 48 18Z';
const BOWL = 'M67 18H68A28 28 0 0 1 96 46V46A28 28 0 0 1 68 74H67A5 5 0 0 1 62 69V23A5 5 0 0 1 67 18Z';
// the P's construction, drawn on top of its material (docs/design/comps/logo-construct.html): the outline in each part's
// deep tone, the hatch, the curve handles as sky dots, and every on-curve point as plumber's selection handle. It lives
// inside the mark.
const POINTS = [[48, 18], [58, 92], [48, 102], [34, 102], [24, 92], [24, 42], [68, 18], [96, 46], [68, 74]];
const K = 0.5523;
const arc = (x1, y1, x2, y2, r, tx1, ty1, tx2, ty2) => (r <= 5 ? [] : [[[x1, y1], [x1 + tx1 * r * K, y1 + ty1 * r * K]], [[x2, y2], [x2 + tx2 * r * K, y2 + ty2 * r * K]]]);
const HANDLES = [...arc(24, 42, 48, 18, 24, 0, -1, -1, 0), ...arc(68, 18, 96, 46, 28, 1, 0, 0, -1), ...arc(96, 46, 68, 74, 28, 0, 1, 1, 0)];
const part = (d, fill, deep) => `<path d="${d}" fill="url(#${fill})"/><path d="${d}" fill="url(#lit)" style="mix-blend-mode:soft-light"/><path d="${d}" fill="url(#hatch)" opacity=".16"/><path d="${d}" fill="none" stroke="${deep}" stroke-opacity=".45" stroke-width=".3"/>`;
document.getElementById('g-stem').innerHTML = part(STEM, 'stem', '#5a0d3c');
document.getElementById('g-bowl').innerHTML = part(BOWL, 'bowl', '#2b1a6b') + `<g class="con">
  <g stroke="#2f86dc" stroke-width=".24">${HANDLES.map(([a, b]) => `<path d="M${a[0]} ${a[1]}L${b[0].toFixed(2)} ${b[1].toFixed(2)}"/>`).join('')}</g>
  ${HANDLES.map(([, b]) => `<circle cx="${b[0].toFixed(2)}" cy="${b[1].toFixed(2)}" r=".6" fill="#2f86dc" stroke="#fff" stroke-width=".3"/>`).join('')}
  ${POINTS.map(([x, y]) => `<rect x="${x - 1.1}" y="${y - 1.1}" width="2.2" height="2.2" rx=".55" fill="#fff" stroke="#2f86dc" stroke-width=".42"/>`).join('')}</g>`;
// the leg (add ?leg=dom, ?leg=pipe, ?leg=round or ?leg=slant to the address for the earlier ones):
// ghost (shown): one drawn shape at the P's own scale, the stem's shoulder again (a quarter round, radius 24), so the R
//   reads from far away; inside it, a small DOM tree: three nodes, each a child of the one above, joined by pipe elbows
// dom: the three nodes alone, as the leg. pipe: a pipe elbow with collars. round: the quarter round, empty. slant: a bar
const kind = new URLSearchParams(location.search).get('leg') || 'ghost';
const round = kind === 'round';
const fillet = (pts, r) => pts.map((p, i) => {
  const a = pts[(i + pts.length - 1) % pts.length], b = pts[(i + 1) % pts.length];
  const to = (q) => { const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy); return [(p[0] + dx / l * r).toFixed(2), (p[1] + dy / l * r).toFixed(2)]; };
  return `${i ? 'L' : 'M'}${to(a).join(' ')}Q${p[0]} ${p[1]} ${to(b).join(' ')}`;
}).join('') + 'Z';
const QUARTER = 'M72 78A24 24 0 0 1 96 102H67A5 5 0 0 1 62 97V83A5 5 0 0 1 67 78Z';
const LEG = kind === 'ghost' ? QUARTER : kind === 'dom' ? 'M66 84V88A2 2 0 0 0 68 90H71M75 93V97A2 2 0 0 0 77 99H80' : kind === 'pipe' ? 'M62 80H72A22 22 0 0 1 94 102H82A10 10 0 0 0 72 92H62Z' : round ? 'M72 78A24 24 0 0 1 96 102H67A5 5 0 0 1 62 97V83A5 5 0 0 1 67 78Z' : fillet([[62, 78], [79, 78], [96, 102], [79, 102]], 4);
for (const id of kind === 'dom' ? ['pen', 'leg-line'] : ['pen', 'leg-fill', 'leg-line']) document.getElementById(id).setAttribute('d', LEG);
const LH = round ? arc(72, 78, 96, 102, 24, 1, 0, 0, -1) : [];
const LP = kind === 'ghost' ? [[72, 78], [96, 102]] : kind === 'pipe' || kind === 'dom' ? [] : round ? [[72, 78], [96, 102]] : [[70.5, 78], [87.5, 102]];
// the pipe's collars: plumber's selection handle, stretched across each open end
const COLLARS = kind === 'pipe' ? [[62, 78, 4, 16], [80, 98, 16, 4]] : [];
document.getElementById('leg-con').innerHTML = `<g stroke="#2f86dc" stroke-width=".24">${LH.map(([a, b]) => `<path d="M${a[0]} ${a[1]}L${b[0].toFixed(2)} ${b[1].toFixed(2)}"/>`).join('')}</g>
  ${LH.map(([, b]) => `<circle cx="${b[0].toFixed(2)}" cy="${b[1].toFixed(2)}" r=".6" fill="#2f86dc" stroke="#fff" stroke-width=".3"/>`).join('')}
  ${COLLARS.map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.2" fill="#fff" stroke="#2f86dc" stroke-width=".5"/>`).join('')}
  ${LP.map(([x, y]) => `<rect x="${x - 1.1}" y="${y - 1.1}" width="2.2" height="2.2" rx=".55" fill="#fff" stroke="#2f86dc" stroke-width=".42"/>`).join('')}`;
if (kind === 'dom') document.getElementById('nodes').innerHTML = [[62, 78, 650], [71, 87, 1000], [80, 96, 1350]].map(([x, y, nd]) => `<rect class="node" style="--nd: ${nd}ms" x="${x}" y="${y}" width="16" height="6" rx="2" fill="#e6effa" stroke="#2f86dc" stroke-width=".5"/>`).join('');
if (kind === 'ghost') document.getElementById('nodes').innerHTML = `<path class="node" style="--nd: 1750ms" d="M68 87V90A1 1 0 0 0 69 91H71.5M73.5 93V96A1 1 0 0 0 74.5 97H77" fill="none" stroke="#2f86dc" stroke-width=".45" stroke-dasharray="1 1"/>`
  + [[66, 83, 1500], [71.5, 89, 1750], [77, 95, 2000]].map(([x, y, nd]) => `<rect class="node" style="--nd: ${nd}ms" x="${x}" y="${y}" width="10" height="4" rx="1.4" fill="#fff" stroke="#2f86dc" stroke-width=".42"/>`).join('');
const s = document.getElementById('s');
// the R is the logo, so it rests with its leg drawn; a click takes the leg away and draws it again
const play = () => { s.classList.remove('r'); setTimeout(() => s.classList.add('r'), 700); };
document.getElementById('stage').addEventListener('click', play);
setTimeout(() => s.classList.add('r'), 300);
</script>
</body>
</html>
