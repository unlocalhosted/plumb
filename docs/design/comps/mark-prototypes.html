<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>React Plumber · mark prototypes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
<style>
  /* React Plumber's hues (overlay/src/tokens.css) */
  :root { --ink: #1d1b17; --ink-2: #6b665c; --rule: rgb(29 27 23 / 0.09); --pink: #f24a9f; --mint: #1a9460; --sky: #2a7fd0; --lilac: #7a5cf0; --butter: #f5b800; --coral: #bf3a1e; --desk: #f6f5f2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 400 14px/20px "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1 { margin: 36px 40px 4px; font: 600 22px/28px "Instrument Sans"; letter-spacing: -0.01em; }
  .sub { margin: 0 40px 24px; color: var(--ink-2); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; padding: 0 40px 40px; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 0 0 1px var(--rule), 0 10px 30px -20px rgb(0 0 0 / .25); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 14px; }
  .n { font: 600 12px/1 "Instrument Sans"; color: var(--ink-2); }
  .n b { color: var(--ink); font-size: 14px; margin-right: 6px; }
  .sizes { display: flex; align-items: flex-end; gap: 18px; height: 100px; }
  .lock { display: flex; align-items: center; gap: 9px; font: 650 19px/1 "Instrument Sans"; letter-spacing: -0.025em; }
  .idea { margin: 0; font-size: 12.5px; line-height: 17px; color: var(--ink-2); }
  svg { display: block; flex: none; }
</style>
</head>
<body>
<h1>React Plumber · mark prototypes</h1>
<p class="sub">Ten ideas, each from something plumber does. Shown at 96, 32 and 16 px, and beside the name. Toy rules: one solid body, cuts in white, patterns only for space.</p>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#fff"/><rect width="1.6" height="4" fill="#1a9460"/></pattern>

  <!-- 1 Level: a spirit level's vial, its bubble dead centre between the two lines -->
  <symbol id="m1" viewBox="0 0 48 48"><rect x="3" y="14" width="42" height="20" rx="10" fill="#1a9460"/><rect x="17.5" y="18" width="13" height="12" rx="6" fill="#fff"/><rect x="14" y="17" width="2" height="14" rx="1" fill="#0b3d26"/><rect x="32" y="17" width="2" height="14" rx="1" fill="#0b3d26"/></symbol>

  <!-- 2 Square: a carpenter's square, the corner every edge is checked against, with its ticks -->
  <symbol id="m2" viewBox="0 0 48 48"><path d="M6 6h11v25h25v11H10a4 4 0 0 1-4-4z" fill="#f24a9f"/><path d="M11 12h3M11 18h3M11 24h3M22 36v3M28 36v3M34 36v3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></symbol>

  <!-- 3 Box: the element as plumber sees it: content, hatched padding, its edge -->
  <symbol id="m3" viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="11" fill="url(#hatch)"/><rect x="4" y="4" width="40" height="40" rx="11" fill="none" stroke="#1a9460" stroke-width="3"/><rect x="15" y="15" width="18" height="18" rx="5" fill="#1a9460"/></symbol>

  <!-- 4 Snap: a block nudged back into line with its row; the guide it snaps to -->
  <symbol id="m4" viewBox="0 0 48 48"><rect x="4" y="9" width="12" height="30" rx="4" fill="#2a7fd0"/><rect x="18" y="9" width="12" height="30" rx="4" fill="#2a7fd0"/><rect x="32" y="13" width="12" height="30" rx="4" fill="#f24a9f"/><path d="M2 9h44" stroke="#1d1b17" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/></symbol>

  <!-- 5 Reticle: plumber's instrument, the crosshair it reads a page through, the centre lit -->
  <symbol id="m5" viewBox="0 0 48 48"><circle cx="24" cy="24" r="17" fill="none" stroke="#2a7fd0" stroke-width="5"/><path d="M24 2v10M24 36v10M2 24h10M36 24h10" stroke="#2a7fd0" stroke-width="5" stroke-linecap="round"/><circle cx="24" cy="24" r="5.5" fill="#f24a9f"/></symbol>

  <!-- 6 Plumb line: the true vertical, one line dropped through a block that sits square on it -->
  <symbol id="m6" viewBox="0 0 48 48"><rect x="8" y="12" width="32" height="24" rx="8" fill="#7a5cf0"/><path d="M24 3v42" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M24 3v8M24 37v8" stroke="#1d1b17" stroke-width="3" stroke-linecap="round"/></symbol>

  <!-- 7 rp: the two letters, the p's stem a ruler -->
  <symbol id="m7" viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="12" fill="#1d1b17"/><path d="M13 35V20a6 6 0 0 1 6-6h2" stroke="#fff" stroke-width="4.5" stroke-linecap="round" fill="none"/><path d="M27 14v24" stroke="#f24a9f" stroke-width="4.5" stroke-linecap="round"/><path d="M27 14h4a6 6 0 0 1 0 12h-4" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M30 31h3M30 35h2" stroke="#f24a9f" stroke-width="2" stroke-linecap="round"/></symbol>

  <!-- 8 Tight: a hex nut, tightened: drift is a loose nut (the site's NutMark world), square again -->
  <symbol id="m8" viewBox="0 0 48 48"><path d="M24 3l18.2 10.5v21L24 45 5.8 34.5v-21z" fill="#f5b800"/><circle cx="24" cy="24" r="8" fill="#fff"/><path d="M20 24.5l3 3 5.5-6" stroke="#4a3400" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>

  <!-- 9 Spacing: two blocks and the gap between them, the gap striped: space as a decision -->
  <symbol id="m9" viewBox="0 0 48 48"><rect x="4" y="6" width="15" height="36" rx="5" fill="#7a5cf0"/><rect x="29" y="6" width="15" height="36" rx="5" fill="#7a5cf0"/><path d="M21.5 12h5M21.5 18h5M21.5 24h5M21.5 30h5M21.5 36h5" stroke="#7a5cf0" stroke-width="2.4" stroke-linecap="round"/></symbol>

  <!-- 10 Marked: a block with plumber's mark on it: the pill that says it's on the scale -->
  <symbol id="m10" viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="12" fill="#f24a9f"/><rect x="11" y="18" width="26" height="12" rx="6" fill="#fff"/><path d="M18.5 24.3l2.6 2.6 5.4-5.6" stroke="#f24a9f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
</defs></svg>

<div class="grid" id="grid"></div>
<script>
const IDEAS = [
  ['Level', 'A spirit level\'s vial, bubble dead centre: everything level.'],
  ['Square', 'A carpenter\'s square: the corner every edge is checked against.'],
  ['Box', 'The element as plumber sees it: content, hatched padding, its edge.'],
  ['Snap', 'A block that drifted, snapping back to its row\'s line.'],
  ['Reticle', 'Plumber\'s instrument: the crosshair it reads a page through.'],
  ['Plumb line', 'The true vertical, dropped through a block sitting square on it.'],
  ['rp', 'The two letters on a dark tile; the p\'s stem is a ruler.'],
  ['Tight', 'Drift is a loose nut: this one is tightened, square again.'],
  ['Spacing', 'Two blocks and the gap between them: space as a decision.'],
  ['Marked', 'A block wearing plumber\'s own pill: on the scale.'],
];
document.getElementById('grid').innerHTML = IDEAS.map(([name, idea], i) => `
  <section class="card">
    <span class="n"><b>${i + 1}</b>${name}</span>
    <span class="sizes"><svg width="96" height="96"><use href="#m${i + 1}"/></svg><svg width="32" height="32"><use href="#m${i + 1}"/></svg><svg width="16" height="16"><use href="#m${i + 1}"/></svg></span>
    <span class="lock"><svg width="26" height="26"><use href="#m${i + 1}"/></svg>React Plumber</span>
    <p class="idea">${idea}</p>
  </section>`).join('');
</script>
</body>
</html>
